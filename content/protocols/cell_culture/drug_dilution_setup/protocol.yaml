  - step_name: prepare_metformin_200mm
    prompt: >
      Make 300 &micro;L of labeled 200 mM metformin working stock from 1 M master stock.
      Calculate the master-stock volume, load it with a P200, then switch to a
      fresh P1000 tip for the media complement. Mix the 300 &micro;L endpoint. This is
      enough for 48 x 5 &micro;L doses plus approximately 60 &micro;L dead volume.
    sequence:
      - target: calculation_60_ul
        gesture: select
        instruction: "Choose the calculation card that matches the metformin master-stock volume."
        hint: "Compare the visible 1 M stock, 200 mM target, and 300 microL final volume with the card values."
        validator: { preset: correct_choice }
        response:
          scene_operations:
            - type: ObjectStateChange
              target: calculation_pad
              state: { entered_value: 60 }
            - type: SceneChange
              to_scene: dilution_workspace
          feedback:
            correct: "60 &micro;L of 1 M metformin plus 240 &micro;L media makes 300 &micro;L of 200 mM stock."
            incorrect: "Use C1V1 = C2V2 with 1 M, 200 mM, and a 300 &micro;L final volume."
      - target: micropipette_tip_box
        gesture: click
        instruction: "Fit a fresh tip on the p200 micropipette for the parent-stock transfer."
        hint: "Use the tip box before touching the metformin stock tube for this parent-stock transfer; keep the transfer sterile."
        validator: { preset: correct_target }
        response:
          scene_operations: [{ type: ObjectStateChange, target: p200_micropipette, state: { tip_status: fresh } }]
          feedback: { correct: "Fit a fresh P200 tip before drawing 1 M metformin.", incorrect: "Select a new P200 tip before entering the metformin master-stock tube." }
      - target: p200_micropipette
        gesture: adjust
        instruction: "Set the p200 micropipette to 60 microL for the metformin master-stock transfer."
        hint: "The 60 microL set point is the calculated stock volume needed to prepare the 300 microL working stock."
        validator: { preset: target_with_value, value: { set_volume: 60 } }
        response:
          scene_operations:
            - type: ObjectStateChange
              target: p200_micropipette
              state: { set_volume: 60 }
      - target: metformin_stock_tube
        gesture: click
        instruction: "Draw 60 microL of metformin master stock from the stock tube."
        hint: "Use the calculated master-stock volume before adding sterile media to the working tube."
        validator: { preset: correct_target }
        response:
          scene_operations:
            - type: ObjectStateChange
              target: metformin_stock_tube
              state: { material_volume: 49.94 }
            - type: ObjectStateChange
              target: p200_micropipette
              state: { held_material_name: metformin_1mol, held_material_volume: 60 }
      - target: metformin_working_tube
        gesture: click
        instruction: "Use the metformin working tube for repeated action 1."
        hint: "Complete repeated action 1 on the metformin working tube before continuing."
        validator: { preset: correct_target }
        response:
          scene_operations:
            - type: ObjectStateChange
              target: metformin_working_tube
              state: { material_name: metformin_1mol, material_volume: 60 }
            - type: ObjectStateChange
              target: p200_micropipette
              state: { held_material_name: empty, held_material_volume: 0, tip_status: used }
      - target: micropipette_tip_box
        gesture: click
        instruction: "Fit a fresh tip on the p1000 micropipette for the media transfer."
        hint: "Use the tip box before touching the media bottle for this media transfer; keep the transfer sterile."
        validator: { preset: correct_target }
        response:
          scene_operations: [{ type: ObjectStateChange, target: p1000_micropipette, state: { tip_status: fresh } }]
          feedback: { correct: "Fit a fresh P1000 tip before drawing sterile media.", incorrect: "Select a new P1000 tip before entering sterile media." }
      - target: p1000_micropipette
        gesture: adjust
        instruction: "Set the p1000 micropipette to 240 microL for the sterile-media complement."
        hint: "Adding 240 microL media to the 60 microL master stock reaches the 300 microL endpoint needed for dosing and dead volume."
        validator: { preset: target_with_value, value: { set_volume: 240 } }
        response:
          scene_operations:
            - type: ObjectStateChange
              target: p1000_micropipette
              state: { set_volume: 240 }
          feedback:
            correct: "Fresh P1000 tip selected for the 240 &micro;L sterile-media transfer."
            incorrect: "Use a fresh P1000 tip set to 240 &micro;L for the media complement."
      - target: media_bottle
        gesture: click
        instruction: "Draw 240 microL of media from the bottle."
        hint: "Use the measured media load for the receiving tube, flask, or reservoir in the next action."
        validator: { preset: correct_target }
        response:
          scene_operations:
            - type: ObjectStateChange
              target: media_bottle
              state: { material_volume: 458.72 }
            - type: ObjectStateChange
              target: p1000_micropipette
              state: { held_material_name: media, held_material_volume: 240 }
      - target: metformin_working_tube
        gesture: click
        instruction: "Use the metformin working tube for repeated action 2."
        hint: "Complete repeated action 2 on the metformin working tube before continuing."
        validator: { preset: correct_target }
        response:
          scene_operations:
            - type: ObjectStateChange
              target: metformin_working_tube
              state: { material_name: metformin_200mmol, material_volume: 300 }
            - type: ObjectStateChange
              target: p1000_micropipette
              state: { held_material_name: empty, held_material_volume: 0, tip_status: used }
      - target: vortex
        gesture: click
        instruction: "Start vortex mixing for vortexing."
        hint: "Keep the tube on the vortexer until the timed mixing step completes."
        validator: { preset: correct_target }
        response:
          scene_operations:
            - type: TimedWait
              target: vortex
              duration_min: 0.05
              display: vortexing
            - type: SceneChange
              to_scene: dilution_volume_review
          feedback:
            correct: "The labeled 200 mM metformin stock is mixed; its 300 &micro;L fill visibly covers dosing and dead-volume allowance."
            incorrect: "Mix the complete metformin working stock before its quality check."
    step_validator: { preset: sequence_complete }
    outcome: { on_success: complete, on_failure: retry }
    next_step: verify_metformin_volume
  - step_name: verify_metformin_volume
    prompt: >
      Inspect the graduated, labeled metformin tube. Does its 300 &micro;L endpoint
      cover 240 &micro;L needed for 48 wells plus 60 &micro;L of dead-volume allowance?
      Choose the visible decision card that matches the calculation.
    sequence:
      - target: volume_decision_sufficient
        gesture: select
        instruction: "Choose the decision card supported by the visible tube volume and the stated dosing requirement."
        hint: "Check whether the readable endpoint covers all 48 doses and the stated dead-volume allowance before selecting."
        validator: { preset: correct_choice }
        response:
          scene_operations: []
          feedback:
            correct: "Release approved: 300 &micro;L equals 240 &micro;L dosing volume plus 60 &micro;L dead-volume allowance."
            incorrect: "Compare the readable tube volume with the stated 240 &micro;L dosing requirement and 60 &micro;L allowance before choosing."
    step_validator: { preset: sequence_complete }
    outcome: { on_success: complete, on_failure: retry }
    next_step: null
