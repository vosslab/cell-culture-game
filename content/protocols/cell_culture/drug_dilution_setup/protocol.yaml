protocol_type: mini_protocol
protocol_name: drug_dilution_setup
entry_step: prepare_carb_parent_stock
initial_state:
  - target: carboplatin_stock_tube
    state: { material_name: carboplatin_10mmol, material_volume: 50 }
  - target: media_bottle
    state: { material_name: media, material_volume: 465.04 }
  - target: metformin_stock_tube
    state: { material_name: metformin_1mol, material_volume: 50 }
  - target: well_plate_96.all_wells
    state: { material_name: cells_in_growth_media, material_volume: 100 }
learning:
  objectives: >
    Students completing this mini-protocol will have achieved fluency with C1V1 =
    C2V2 calculations, selecting an accurate micropipette range, and preparing
    independently labeled working stocks from master stocks.
  outcomes: >
    Students completing this mini-protocol will be able to prepare a 400 &micro;M
    carboplatin parent stock, a 1-2-5 carboplatin working series (4, 8, 20, 40,
    80, and 200 &micro;M), and a 200 mM metformin stock while preserving aseptic
    tip changes and volume conservation.
  goals: >
    Overall, this mini-protocol aims to accomplish preparation and quality control
    of the treatment-ready stocks for the two-drug dose-response experiment. The
    400 &micro;M carboplatin parent is the 40x row-H stock; the remaining separate
    working stocks produce 0.1-5 &micro;M final carboplatin in 200 &micro;L wells, while
    200 mM metformin produces 5 mM final concentration.
steps:
  - step_name: prepare_carb_parent_stock
    scene: dilution_initial_calculation_review
    prompt: >
      Make 1.00 mL of labeled 400 &micro;M carboplatin parent stock from the 10 mM
      master stock. Use C1V1 = C2V2 to calculate the master-stock volume on the
      calculation pad. Use the P200 for the master stock, then switch to a fresh
      P1000 tip for sterile media. Vortex the completed parent stock.
    sequence:
      - target: calculation_40_ul
        gesture: select
        instruction: "Choose the calculation card that matches the C1V1 = C2V2 master-stock volume."
        hint: "Compare the visible 10 mM stock, 400 microM target, and 1.00 mL final volume with each card before choosing."
        validator: { preset: correct_choice }
        response:
          scene_operations:
            - type: ObjectStateChange
              target: calculation_pad
              state: { entered_value: 40 }
            - type: SceneChange
              to_scene: dilution_workspace
          feedback:
            correct: "40 &micro;L of 10 mM stock in 1.00 mL gives 400 &micro;M. Select a pipette that can measure 40 &micro;L accurately."
            incorrect: "Use C1V1 = C2V2 with 10 mM, 400 &micro;M, and 1000 &micro;L; record the master-stock volume."
      - target: micropipette_tip_box
        gesture: click
        instruction: "Fit a fresh tip on the p200 micropipette for the parent-stock transfer."
        hint: "Use the tip box before touching the carboplatin stock tube for this parent-stock transfer; keep the transfer sterile."
        validator: { preset: correct_target }
        response:
          scene_operations:
            - type: ObjectStateChange
              target: p200_micropipette
              state: { tip_status: fresh }
          feedback:
            correct: "Fit a fresh P200 tip before drawing carboplatin master stock."
            incorrect: "Select a sterile P200 tip before entering the carboplatin stock tube."
      - target: p200_micropipette
        gesture: adjust
        instruction: "Set the p200 micropipette to 40 microL for the carboplatin master-stock transfer."
        hint: "This set point matches the calculated stock volume and keeps the transfer within the P200's accurate working range."
        validator: { preset: target_with_value, value: { set_volume: 40 } }
        response:
          scene_operations:
            - type: ObjectStateChange
              target: p200_micropipette
              state: { set_volume: 40 }
      - target: carboplatin_stock_tube
        gesture: click
        instruction: "Draw 40 microL of carboplatin master stock from the stock tube."
        hint: "Use the calculated master-stock volume before transferring into the labeled intermediate tube."
        validator: { preset: correct_target }
        response:
          scene_operations:
            - type: ObjectStateChange
              target: carboplatin_stock_tube
              state: { material_volume: 49.96 }
            - type: ObjectStateChange
              target: p200_micropipette
              state: { held_material_name: carboplatin_10mmol, held_material_volume: 40 }
          feedback:
            correct: "The P200 now holds 40 &micro;L of carboplatin master stock."
            incorrect: "Load the calculated master-stock volume from the carboplatin tube."
      - target: microtube_15ml_intermediate
        gesture: click
        instruction: "Use the microtube 15ml intermediate for repeated action 1."
        hint: "Complete repeated action 1 on the microtube 15ml intermediate before continuing."
        validator: { preset: correct_target }
        response:
          scene_operations:
            - type: ObjectStateChange
              target: microtube_15ml_intermediate
              state: { material_name: carboplatin_10mmol, material_volume: 0.04 }
            - type: ObjectStateChange
              target: p200_micropipette
              state: { held_material_name: empty, held_material_volume: 0, tip_status: used }
      - target: micropipette_tip_box
        gesture: click
        instruction: "Fit a fresh tip on the p1000 micropipette for the media transfer."
        hint: "Use the tip box before touching the media bottle for this media transfer; keep the transfer sterile."
        validator: { preset: correct_target }
        response:
          scene_operations:
            - type: ObjectStateChange
              target: p1000_micropipette
              state: { tip_status: fresh }
          feedback:
            correct: "Fit a fresh P1000 tip before entering sterile media."
            incorrect: "Select a new sterile P1000 tip for the media complement."
      - target: p1000_micropipette
        gesture: adjust
        instruction: "Set the p1000 micropipette to 960 microL for the sterile-media complement."
        hint: "The 960 microL set point supplies the volume needed to bring the 40 microL stock transfer to a 1.00 mL parent preparation."
        validator: { preset: target_with_value, value: { set_volume: 960 } }
        response:
          scene_operations:
            - type: ObjectStateChange
              target: p1000_micropipette
              state: { set_volume: 960 }
          feedback:
            correct: "Fresh P1000 tip selected for sterile media; 960 &micro;L completes the 1.00 mL parent stock."
            incorrect: "Use a fresh P1000 tip for the 960 &micro;L media transfer."
      - target: media_bottle
        gesture: click
        instruction: "Draw 960 microL of media from the bottle."
        hint: "Use the measured media load for the receiving tube, flask, or reservoir in the next action."
        validator: { preset: correct_target }
        response:
          scene_operations:
            - type: ObjectStateChange
              target: media_bottle
              state: { material_volume: 464.08 }
            - type: ObjectStateChange
              target: p1000_micropipette
              state: { held_material_name: media, held_material_volume: 960 }
      - target: microtube_15ml_intermediate
        gesture: click
        instruction: "Use the microtube 15ml intermediate for repeated action 2."
        hint: "Complete repeated action 2 on the microtube 15ml intermediate before continuing."
        validator: { preset: correct_target }
        response:
          scene_operations:
            - type: ObjectStateChange
              target: microtube_15ml_intermediate
              state: { material_name: carboplatin_400umol, material_volume: 1 }
            - type: ObjectStateChange
              target: p1000_micropipette
              state: { held_material_name: empty, held_material_volume: 0, tip_status: used }
      - target: vortex
        gesture: click
        instruction: "Start vortex mixing for vortexing."
        hint: "Keep the tube on the vortexer until the timed mixing step completes."
        validator: { preset: correct_target }
        response:
          scene_operations:
            - type: TimedWait
              target: vortex
              duration_min: 0.05
              display: vortexing
            - type: SceneChange
              to_scene: dilution_calculation_500
          feedback:
            correct: "The labeled 400 &micro;M parent stock is mixed and ready as the single source for the carboplatin series."
            incorrect: "Mix the completed parent stock before preparing its dilutions."
    step_validator: { preset: sequence_complete }
    outcome: { on_success: complete, on_failure: retry }
    next_step: prepare_carb_working_200um
  - step_name: prepare_carb_working_200um
    prompt: >
      Work one complete example: make 1.00 mL of labeled 200 &micro;M carboplatin from
      the 400 &micro;M parent. Calculate the parent-stock volume, transfer it with a
      fresh P1000 tip into rack tube G, then use another fresh P1000 tip to add
      sterile media. Mix the labeled tube.
    sequence:
      - target: calculation_500_ul
        gesture: select
        instruction: "Choose the calculation card that matches the parent-stock volume for this working dilution."
        hint: "Use the visible 400 microM parent, 200 microM target, and 1.00 mL final volume to compare the cards."
        validator: { preset: correct_choice }
        response:
          scene_operations:
            - type: ObjectStateChange
              target: calculation_pad
              state: { entered_value: 500 }
            - type: SceneChange
              to_scene: dilution_workspace
          feedback:
            correct: "Correct: a twofold dilution uses 500 &micro;L parent stock and 500 &micro;L media."
            incorrect: "Calculate V1 from 400 &micro;M x V1 = 200 &micro;M x 1000 &micro;L."
      - target: micropipette_tip_box
        gesture: click
        instruction: "Fit a fresh tip on the p1000 micropipette for the media transfer for the microtube 15ml intermediate."
        hint: "Use the tip box before touching the microtube 15ml intermediate for this media transfer; keep the transfer sterile."
        validator: { preset: correct_target }
        response:
          scene_operations:
            - type: ObjectStateChange
              target: p1000_micropipette
              state: { tip_status: fresh }
          feedback:
            correct: "Fit a fresh P1000 tip before drawing the 400 &micro;M parent stock."
            incorrect: "Select a sterile P1000 tip before entering the carboplatin parent tube."
      - target: p1000_micropipette
        gesture: adjust
        instruction: "Set the p1000 micropipette to 500 microL for the parent-stock transfer."
        hint: "Use this set point for the microtube 15ml intermediate during this parent-stock transfer; keep the selected value unchanged."
        validator: { preset: target_with_value, value: { set_volume: 500 } }
        response:
          scene_operations:
            - type: ObjectStateChange
              target: p1000_micropipette
              state: { set_volume: 500 }
      - target: microtube_15ml_intermediate
        gesture: click
        instruction: "Draw 500 microL of carboplatin 400umol from the microtube 15ml intermediate."
        hint: "Use the microtube 15ml intermediate as the source, then carry this measured load to dilution tube rack 8."
        validator: { preset: correct_target }
        response:
          scene_operations:
            - type: ObjectStateChange
              target: microtube_15ml_intermediate
              state: { material_volume: 0.5 }
            - type: ObjectStateChange
              target: p1000_micropipette
              state: { held_material_name: carboplatin_400umol, held_material_volume: 500 }
      - target: dilution_tube_rack_8
        gesture: click
        instruction: "Deliver 500 microL of carboplatin 400 microM into tube G."
        hint: "Place the loaded pipette over tube G; this addition advances the dilution series for this 500 microL addition."
        validator: { preset: correct_target }
        response:
          scene_operations:
            - type: ObjectStateChange
              target: dilution_tube_rack_8.tube_G
              state: { material_name: carboplatin_400umol, material_volume: 500 }
            - type: ObjectStateChange
              target: p1000_micropipette
              state: { held_material_name: empty, held_material_volume: 0, tip_status: used }
      - target: micropipette_tip_box
        gesture: click
        instruction: "Fit a fresh tip on the p1000 micropipette for the media transfer for the media bottle."
        hint: "Use the tip box before touching the media bottle for this media transfer; keep the transfer sterile."
        validator: { preset: correct_target }
        response:
          scene_operations:
            - type: ObjectStateChange
              target: p1000_micropipette
              state: { tip_status: fresh }
          feedback:
            correct: "Change to a fresh P1000 tip before drawing sterile media."
            incorrect: "Select a new sterile P1000 tip for the media complement."
      - target: p1000_micropipette
        gesture: adjust
        instruction: "Set the p1000 micropipette to 500 microL for the sterile media transfer."
        hint: "Use this set point for the media bottle during this sterile media transfer; keep the selected value unchanged."
        validator: { preset: target_with_value, value: { set_volume: 500 } }
        response:
          scene_operations:
            - type: ObjectStateChange
              target: p1000_micropipette
              state: { set_volume: 500 }
          feedback:
            correct: "Use a fresh tip before entering sterile media."
            incorrect: "Set a fresh P1000 tip to the calculated media volume."
      - target: media_bottle
        gesture: click
        instruction: "Draw 500 microL of media from the bottle."
        hint: "Use the measured media load for the receiving tube, flask, or reservoir in the next action."
        validator: { preset: correct_target }
        response:
          scene_operations:
            - type: ObjectStateChange
              target: media_bottle
              state: { material_volume: 463.58 }
            - type: ObjectStateChange
              target: p1000_micropipette
              state: { held_material_name: media, held_material_volume: 500 }
      - target: dilution_tube_rack_8
        gesture: click
        instruction: "Deliver 1000 microL of carboplatin 200 microM into tube G."
        hint: "Place the loaded pipette over tube G; this addition advances the dilution series for this 1000 microL addition."
        validator: { preset: correct_target }
        response:
          scene_operations:
            - type: ObjectStateChange
              target: dilution_tube_rack_8.tube_G
              state: { material_name: carboplatin_200umol, material_volume: 1000 }
            - type: ObjectStateChange
              target: p1000_micropipette
              state: { held_material_name: empty, held_material_volume: 0, tip_status: used }
            - type: SceneChange
              to_scene: dilution_calculation_200
          feedback:
            correct: "Tube G is visibly filled and labeled 200 &micro;M: the worked example establishes the single-source rule."
            incorrect: "Add the media to the same labeled tube that received parent stock."
    step_validator: { preset: sequence_complete }
    outcome: { on_success: complete, on_failure: retry }
    next_step: prepare_carb_working_mid_series
  - step_name: prepare_carb_working_mid_series
    prompt: >
      Continue the 1-2-5 series from the same 400 &micro;M parent. First calculate and
      prepare 1.00 mL of 80 &micro;M in tube F, then prepare 40 &micro;M in tube E. Select
      the P200 for each parent-stock transfer and a fresh P1000 tip for each
      media transfer; the completed tubes make the series progress visible.
    sequence:
      - target: calculation_200_ul
        gesture: select
        instruction: "Choose the calculation card that matches the parent-stock volume for the 80 microM preparation."
        hint: "Compare the displayed 400 microM parent, 80 microM target, and 1.00 mL final volume with the visible choices."
        validator: { preset: correct_choice }
        response:
          scene_operations:
            - type: ObjectStateChange
              target: calculation_pad
              state: { entered_value: 200 }
            - type: SceneChange
              to_scene: dilution_workspace
          feedback:
            correct: "80 &micro;M requires 200 &micro;L parent stock; apply the same equation to derive the 40 &micro;M transfer."
            incorrect: "Calculate V1 for 400 &micro;M parent stock diluted to 80 &micro;M in 1000 &micro;L."
      - target: micropipette_tip_box
        gesture: click
        instruction: "Fit a fresh tip on the p200 micropipette for the parent-stock transfer for the microtube 15ml intermediate (substep 1 of 2)."
        hint: "Use the tip box before touching the microtube 15ml intermediate for this parent-stock transfer; keep the transfer sterile for the microtube 15ml intermediate (substep 1 of 2)."
        validator: { preset: correct_target }
        response:
          scene_operations: [{ type: ObjectStateChange, target: p200_micropipette, state: { tip_status: fresh } }]
          feedback: { correct: "Fit a fresh P200 tip before drawing parent stock for tube F.", incorrect: "Select a new P200 tip before entering the parent-stock tube." }
      - target: p200_micropipette
        gesture: adjust
        instruction: "Set the p200 micropipette to 200 microL for the parent-stock transfer."
        hint: "Use this set point for the microtube 15ml intermediate during this parent-stock transfer; keep the selected value unchanged for the 200 microL set point."
        validator: { preset: target_with_value, value: { set_volume: 200 } }
        response:
          scene_operations:
            - type: ObjectStateChange
              target: p200_micropipette
              state: { set_volume: 200 }
      - target: microtube_15ml_intermediate
        gesture: click
        instruction: "Draw 200 microL of carboplatin 400 microM for dilution tube rack 8 tube F."
        hint: "Use the microtube 15ml intermediate as the source, then transfer this measured load to dilution tube rack 8 tube F."
        validator: { preset: correct_target }
        response:
          scene_operations:
            - type: ObjectStateChange
              target: microtube_15ml_intermediate
              state: { material_volume: 0.3 }
            - type: ObjectStateChange
              target: p200_micropipette
              state: { held_material_name: carboplatin_400umol, held_material_volume: 200 }
      - target: dilution_tube_rack_8
        gesture: click
        instruction: "Deliver 200 microL of carboplatin 400 microM into tube F."
        hint: "Place the loaded pipette over tube F; this addition advances the dilution series for this 200 microL addition."
        validator: { preset: correct_target }
        response:
          scene_operations:
            - type: ObjectStateChange
              target: dilution_tube_rack_8.tube_F
              state: { material_name: carboplatin_400umol, material_volume: 200 }
            - type: ObjectStateChange
              target: p200_micropipette
              state: { held_material_name: empty, held_material_volume: 0, tip_status: used }
      - target: micropipette_tip_box
        gesture: click
        instruction: "Fit a fresh tip on the p1000 micropipette for the media transfer for the media bottle (substep 1 of 2)."
        hint: "Use the tip box before touching the media bottle for this media transfer; keep the transfer sterile for the media bottle (substep 1 of 2)."
        validator: { preset: correct_target }
        response:
          scene_operations: [{ type: ObjectStateChange, target: p1000_micropipette, state: { tip_status: fresh } }]
          feedback: { correct: "Fit a fresh P1000 tip before drawing media for tube F.", incorrect: "Select a new P1000 tip before entering sterile media." }
      - target: p1000_micropipette
        gesture: adjust
        instruction: "Set the p1000 micropipette to 800 microL for the sterile media transfer."
        hint: "Use this set point for the media bottle during this sterile media transfer; keep the selected value unchanged for the 800 microL set point."
        validator: { preset: target_with_value, value: { set_volume: 800 } }
        response:
          scene_operations:
            - type: ObjectStateChange
              target: p1000_micropipette
              state: { set_volume: 800 }
          feedback:
            correct: "Fresh P1000 tip selected for the 800 &micro;L media complement."
            incorrect: "Use a fresh P1000 tip for the 800 &micro;L media complement."
      - target: media_bottle
        gesture: click
        instruction: "Draw 800 microL of media for dilution tube rack 8 tube F."
        hint: "Use the media bottle as the source, then deliver this load into dilution tube rack 8 tube F."
        validator: { preset: correct_target }
        response:
          scene_operations:
            - type: ObjectStateChange
              target: media_bottle
              state: { material_volume: 462.78 }
            - type: ObjectStateChange
              target: p1000_micropipette
              state: { held_material_name: media, held_material_volume: 800 }
      - target: dilution_tube_rack_8
        gesture: click
        instruction: "Deliver 1000 microL of carboplatin 80 microM into tube F."
        hint: "Place the loaded pipette over tube F; this addition advances the dilution series for this 1000 microL addition."
        validator: { preset: correct_target }
        response:
          scene_operations:
            - type: ObjectStateChange
              target: dilution_tube_rack_8.tube_F
              state: { material_name: carboplatin_80umol, material_volume: 1000 }
            - type: ObjectStateChange
              target: p1000_micropipette
              state: { held_material_name: empty, held_material_volume: 0, tip_status: used }
      - target: micropipette_tip_box
        gesture: click
        instruction: "Fit a fresh tip on the p200 micropipette for the parent-stock transfer for the microtube 15ml intermediate (substep 2 of 2)."
        hint: "Use the tip box before touching the microtube 15ml intermediate for this parent-stock transfer; keep the transfer sterile for the microtube 15ml intermediate (substep 2 of 2)."
        validator: { preset: correct_target }
        response:
          scene_operations: [{ type: ObjectStateChange, target: p200_micropipette, state: { tip_status: fresh } }]
          feedback: { correct: "Fit a fresh P200 tip before drawing parent stock for tube E.", incorrect: "Select a new P200 tip before entering the parent-stock tube." }
      - target: p200_micropipette
        gesture: adjust
        instruction: "Set the p200 micropipette to 100 microL for the parent-stock transfer."
        hint: "Use this set point for the microtube 15ml intermediate during this parent-stock transfer; keep the selected value unchanged for the 100 microL set point."
        validator: { preset: target_with_value, value: { set_volume: 100 } }
        response:
          scene_operations:
            - type: ObjectStateChange
              target: p200_micropipette
              state: { set_volume: 100 }
      - target: microtube_15ml_intermediate
        gesture: click
        instruction: "Draw 100 microL of carboplatin 400 microM for dilution tube rack 8 tube E."
        hint: "Use the microtube 15ml intermediate as the source, then transfer this measured load to dilution tube rack 8 tube E."
        validator: { preset: correct_target }
        response:
          scene_operations:
            - type: ObjectStateChange
              target: microtube_15ml_intermediate
              state: { material_volume: 0.2 }
            - type: ObjectStateChange
              target: p200_micropipette
              state: { held_material_name: carboplatin_400umol, held_material_volume: 100 }
      - target: dilution_tube_rack_8
        gesture: click
        instruction: "Deliver 100 microL of carboplatin 400 microM into tube E."
        hint: "Place the loaded pipette over tube E; this addition advances the dilution series for this 100 microL addition."
        validator: { preset: correct_target }
        response:
          scene_operations:
            - type: ObjectStateChange
              target: dilution_tube_rack_8.tube_E
              state: { material_name: carboplatin_400umol, material_volume: 100 }
            - type: ObjectStateChange
              target: p200_micropipette
              state: { held_material_name: empty, held_material_volume: 0, tip_status: used }
      - target: micropipette_tip_box
        gesture: click
        instruction: "Fit a fresh tip on the p1000 micropipette for the media transfer for the media bottle (substep 2 of 2)."
        hint: "Use the tip box before touching the media bottle for this media transfer; keep the transfer sterile for the media bottle (substep 2 of 2)."
        validator: { preset: correct_target }
        response:
          scene_operations: [{ type: ObjectStateChange, target: p1000_micropipette, state: { tip_status: fresh } }]
          feedback: { correct: "Fit a fresh P1000 tip before drawing media for tube E.", incorrect: "Select a new P1000 tip before entering sterile media." }
      - target: p1000_micropipette
        gesture: adjust
        instruction: "Set the p1000 micropipette to 900 microL for the sterile media transfer."
        hint: "Use this set point for the media bottle during this sterile media transfer; keep the selected value unchanged for the 900 microL set point."
        validator: { preset: target_with_value, value: { set_volume: 900 } }
        response:
          scene_operations:
            - type: ObjectStateChange
              target: p1000_micropipette
              state: { set_volume: 900 }
      - target: media_bottle
        gesture: click
        instruction: "Draw 900 microL of media for dilution tube rack 8 tube E."
        hint: "Use the media bottle as the source, then deliver this load into dilution tube rack 8 tube E."
        validator: { preset: correct_target }
        response:
          scene_operations:
            - type: ObjectStateChange
              target: media_bottle
              state: { material_volume: 461.88 }
            - type: ObjectStateChange
              target: p1000_micropipette
              state: { held_material_name: media, held_material_volume: 900 }
      - target: dilution_tube_rack_8
        gesture: click
        instruction: "Deliver 1000 microL of carboplatin 40 microM into tube E."
        hint: "Place the loaded pipette over tube E; this addition advances the dilution series for this 1000 microL addition."
        validator: { preset: correct_target }
        response:
          scene_operations:
            - type: ObjectStateChange
              target: dilution_tube_rack_8.tube_E
              state: { material_name: carboplatin_40umol, material_volume: 1000 }
            - type: ObjectStateChange
              target: p1000_micropipette
              state: { held_material_name: empty, held_material_volume: 0, tip_status: used }
            - type: SceneChange
              to_scene: dilution_calculation_50
          feedback:
            correct: "The 80 and 40 &micro;M tubes are complete; their labeled endpoints document the middle of the series."
            incorrect: "Complete tube E with its media complement."
    step_validator: { preset: sequence_complete }
    outcome: { on_success: complete, on_failure: retry }
    next_step: prepare_carb_working_low_series
  - step_name: prepare_carb_working_low_series
    prompt: >
      Complete the low end of the single-source series: 20 &micro;M in tube D, 8 &micro;M in
      tube C, and 4 &micro;M in tube B. Calculate the first parent-stock transfer,
      then use the P200, P20, and P1000 only within their marked ranges. Each
      switch from drug stock to media requires a fresh tip.
    sequence:
      - target: calculation_50_ul
        gesture: select
        instruction: "Choose the calculation card that matches the first low-series parent-stock volume."
        hint: "Use C1V1 = C2V2 with the visible 400 microM parent, 20 microM target, and 1.00 mL final volume."
        validator: { preset: correct_choice }
        response:
          scene_operations:
            - type: ObjectStateChange
              target: calculation_pad
              state: { entered_value: 50 }
            - type: SceneChange
              to_scene: dilution_workspace
          feedback:
            correct: "20 &micro;M requires 50 &micro;L parent stock. Derive the 8 and 4 &micro;M volumes from the same parent."
            incorrect: "Calculate the parent-stock volume for 20 &micro;M in a 1000 &micro;L final volume."
      - target: micropipette_tip_box
        gesture: click
        instruction: "Fit a fresh tip on the p200 micropipette for the parent-stock transfer."
        hint: "Use the tip box before touching the microtube 15ml intermediate for this parent-stock transfer; keep the transfer sterile."
        validator: { preset: correct_target }
        response:
          scene_operations: [{ type: ObjectStateChange, target: p200_micropipette, state: { tip_status: fresh } }]
          feedback: { correct: "Fit a fresh P200 tip before drawing parent stock for tube D.", incorrect: "Select a new P200 tip before entering the parent-stock tube." }
      - target: p200_micropipette
