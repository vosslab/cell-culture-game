protocol_type: mini_protocol
protocol_name: passage_hood_detachment
entry_step: inspect_confluence
initial_state:
  # Direct launch begins with the same representative culture that the
  # sequence runners seed: an identity-labeled T75 containing a 70-80%
  # adherent monolayer in complete medium. The roughly 3 mL trypsin rinse
  # below is therefore a fixed teaching scenario, not a universal T75 rule.
  - target: t75_flask
    state:
      material_name: media
      material_volume: 12
      cell_state: attached_70_80
      label_status: identity_complete
  - target: pbs_bottle
    state: { material_name: pbs, material_volume: 500 }
  - target: trypsin_bottle
    state: { material_name: trypsin, material_volume: 500 }
  - target: media_bottle
    state: { material_name: media, material_volume: 500 }
learning:
  objectives:
    Students completing this mini-protocol will have achieved fluency with
    the visual assessment of cell confluence and the technique of enzymatic cell detachment
    from a tissue-culture flask using trypsin.
  outcomes:
    Students completing this mini-protocol will be able to inspect and confirm
    cell confluence under a microscope, aseptically detach adherent cells from a culture
    flask with trypsin and appropriate incubation, and neutralize the trypsin to preserve
    cell viability during transfer.
  goals:
    "Overall, this mini-protocol aims to accomplish the first stage of routine
    cell passage: detaching cells from a T75 flask for subculture and replating. This
    is the entry point for any maintenance-passage or experimental-expansion workflow.
    The 9 steps reflect the full pedagogical pathway from initial confluence assessment
    through trypsin neutralization, including the essential ~2-minute incubation and visual detachment check."
steps:
  - step_name: inspect_confluence
    prompt:
      Inspect the representative T75 field under the microscope. Compare the visible monolayer with both decisions; this fixed scenario is about 70-80% confluent.
    sequence:
      - target: microscope
        gesture: click
        validator:
          preset: correct_target
        response:
          scene_operations:
            - type: SceneChange
              to_scene: passage_hood_detachment_microscope_view
      - target: t75_flask
        gesture: click
        validator:
          preset: correct_target
        response:
          scene_operations:
            - type: ObjectStateChange
              target: microscope
              state:
                observation_state: confluent_70_80
      - target: confluence_decision_proceed
        gesture: select
        validator:
          preset: correct_choice
        response:
          scene_operations:
            - type: ObjectStateChange
              target: t75_flask
              state:
                inspection_status: observed_at_confluence
          feedback:
            correct: "Proceed: the visible monolayer is in the 70-80% confluence range for routine passage."
            incorrect: "Compare the visible field with both choices. In this fixed scenario, the near-confluent adherent monolayer is ready to passage."
      - target: hood_surface
        gesture: click
        validator:
          preset: correct_target
        response:
          scene_operations:
            - type: SceneChange
              to_scene: passage_hood_detachment_hood_workspace
    step_validator:
      preset: sequence_complete
    outcome:
      on_success: complete
      on_failure: retry
    next_step: spray_hood_with_ethanol
  - step_name: spray_hood_with_ethanol
    prompt: Spray the interior hood surface with 70% ethanol, then use a clean paper towel to wipe the wetted surface. This disinfects/decontaminates the work area; it does not sterilize it.
    sequence:
      - target: ethanol_bottle
        gesture: click
        validator:
          preset: correct_target
        response:
          scene_operations:
            - type: ObjectStateChange
              target: hood_surface
              state:
                surface_cleanliness: ethanol_sprayed
      - target: paper_towel_pad
        gesture: click
        validator:
          preset: correct_target
        response:
          scene_operations:
            - type: ObjectStateChange
              target: hood_surface
              state:
                surface_cleanliness: ethanol_wiped
                contact_status: wet_wipe_complete
          feedback:
            correct: "Correct: the wet wipe completes surface contact for disinfection/decontamination. Ethanol does not sterilize the hood."
            incorrect: "After applying ethanol, wipe the wetted hood surface with the clean paper towel to complete the contact step."
    step_validator:
      preset: sequence_complete
    outcome:
      on_success: complete
      on_failure: retry
    next_step: aspirate_spent_media
  - step_name: aspirate_spent_media
    prompt: Aspirate spent medium from the flask while keeping the tip above the adherent-cell layer.
    sequence:
      - target: aspirating_pipette
        gesture: click
        validator:
          preset: correct_target
        response:
          scene_operations: []
      - target: t75_flask
        gesture: click
        validator:
          preset: correct_target
        response:
          scene_operations:
            - type: ObjectStateChange
              target: t75_flask
              state:
                material_name: empty
                material_volume: 0
    step_validator:
      preset: sequence_complete
    outcome:
      on_success: complete
      on_failure: retry
    next_step: pbs_wash
  - step_name: pbs_wash
    prompt:
      Measure approximately 4 mL PBS at the serological-pipette graduations, cover the monolayer, and rinse gently to remove residual serum.
    sequence:
      - target: serological_pipette_pack
        gesture: click
        validator:
          preset: correct_target
        response:
          scene_operations:
            - type: ObjectStateChange
              target: serological_pipette
              state: { freshness: sterile }
      - target: serological_pipette
        gesture: click
        validator:
          preset: correct_target
        response:
          scene_operations: []
      - target: pbs_bottle
        gesture: click
        validator:
          preset: correct_target
        response:
          scene_operations:
            - type: ObjectStateChange
              target: pbs_bottle
              state:
                material_volume: 496
            - type: ObjectStateChange
              target: serological_pipette
              state:
                held_material_name: pbs
                held_material_volume: 4
                freshness: used
      - target: t75_flask
        gesture: click
        validator:
          preset: correct_target
        response:
          scene_operations:
            - type: ObjectStateChange
              target: t75_flask
              state:
                material_name: pbs
                material_volume: 4
                cell_state: attached_70_80
                rinse_status: pbs_coverage_pending
            - type: ObjectStateChange
              target: serological_pipette
              state:
                held_material_name: empty
                held_material_volume: 0
      - target: t75_flask
        gesture: click
        validator:
          preset: correct_target
        response:
          scene_operations:
            - type: ObjectStateChange
              target: t75_flask
              state:
                rinse_status: pbs_rinse_complete
          feedback:
            correct: "The visible PBS coverage has been gently rinsed across the adherent surface; the wash can now be vacuum-aspirated."
            incorrect: "After PBS covers the monolayer, complete the gentle rinse before removing it by vacuum aspiration."
    step_validator:
      preset: sequence_complete
    outcome:
      on_success: complete
      on_failure: retry
    next_step: aspirate_pbs
  - step_name: aspirate_pbs
    prompt: Aspirate all PBS from the flask. Residual serum can inhibit trypsin.
    sequence:
      - target: aspirating_pipette
        gesture: click
        validator:
          preset: correct_target
        response:
          scene_operations: []
      - target: t75_flask
        gesture: click
        validator:
          preset: correct_target
        response:
          scene_operations:
            - type: ObjectStateChange
              target: t75_flask
              state:
                material_name: empty
                material_volume: 0
    step_validator:
      preset: sequence_complete
    outcome:
      on_success: complete
      on_failure: retry
    next_step: add_trypsin
  - step_name: add_trypsin
    prompt:
      For this fixed teaching scenario, measure approximately 3 mL trypsin at the serological-pipette graduations and add it to cover the monolayer.
    sequence:
      - target: serological_pipette_pack
        gesture: click
        validator:
          preset: correct_target
        response:
          scene_operations:
            - type: ObjectStateChange
              target: serological_pipette
              state: { freshness: sterile }
      - target: serological_pipette
        gesture: click
        validator:
          preset: correct_target
        response:
          scene_operations: []
      - target: trypsin_bottle
        gesture: click
        validator:
          preset: correct_target
        response:
          scene_operations:
            - type: ObjectStateChange
              target: trypsin_bottle
              state:
                material_volume: 497
            - type: ObjectStateChange
              target: serological_pipette
              state:
                held_material_name: trypsin
                held_material_volume: 3
                freshness: used
      - target: t75_flask
        gesture: click
        validator:
          preset: correct_target
        response:
          scene_operations:
            - type: ObjectStateChange
              target: t75_flask
              state:
                material_name: trypsin
                material_volume: 3
                cell_state: attached_70_80
            - type: ObjectStateChange
              target: serological_pipette
              state:
                held_material_name: empty
                held_material_volume: 0
    step_validator:
      preset: sequence_complete
    outcome:
      on_success: complete
      on_failure: retry
    next_step: incubate_for_detachment
  - step_name: incubate_for_detachment
    prompt:
      Incubate with trypsin for about 2 minutes, then inspect for rounded, detached cells rather than relying on time alone.
    sequence:
      - target: incubator
        gesture: click
        validator:
          preset: correct_target
        response:
          scene_operations:
            - type: TimedWait
              target: incubator
              duration_min: 2
              display: "Allowing trypsin to act; check detachment"
    step_validator:
      preset: sequence_complete
    outcome:
      on_success: complete
      on_failure: retry
    next_step: confirm_detachment
  - step_name: confirm_detachment
    prompt:
      Inspect the fixed-scenario field under the microscope. Compare the visible rounded cells with both decisions before returning to the hood to neutralize trypsin.
    sequence:
      - target: microscope
        gesture: click
        validator:
          preset: correct_target
        response:
          scene_operations:
            - type: SceneChange
              to_scene: passage_hood_detachment_microscope_view
      - target: t75_flask
        gesture: click
        validator:
          preset: correct_target
        response:
          scene_operations:
            - type: ObjectStateChange
              target: microscope
              state:
                observation_state: rounded_detached
      - target: detachment_decision_neutralize
        gesture: select
        validator:
          preset: correct_choice
        response:
          scene_operations:
            - type: ObjectStateChange
              target: t75_flask
              state:
                cell_state: rounded_detached
          feedback:
            correct: "Confirmed: the cells are rounded and detached, so medium can now neutralize trypsin."
            incorrect: "Compare the visible field with both choices. In this fixed scenario, the rounded detached cells are ready for neutralization."
      - target: hood_surface
        gesture: click
        validator:
          preset: correct_target
        response:
          scene_operations:
            - type: SceneChange
              to_scene: passage_hood_detachment_hood_workspace
    step_validator:
      preset: sequence_complete
    outcome:
      on_success: complete
      on_failure: retry
    next_step: neutralize_trypsin
  - step_name: neutralize_trypsin
    prompt:
      Measure 9 mL complete medium at the serological-pipette graduations and add it to neutralize 3 mL trypsin. The flask should now contain a uniform cell suspension.
    sequence:
      - target: serological_pipette_pack
        gesture: click
        validator:
          preset: correct_target
        response:
          scene_operations:
            - type: ObjectStateChange
              target: serological_pipette
              state: { freshness: sterile }
      - target: serological_pipette
        gesture: click
        validator:
          preset: correct_target
        response:
          scene_operations: []
      - target: media_bottle
        gesture: click
        validator:
          preset: correct_target
        response:
          scene_operations:
            - type: ObjectStateChange
              target: media_bottle
              state:
                material_volume: 491
            - type: ObjectStateChange
              target: serological_pipette
              state:
                held_material_name: media
                held_material_volume: 9
                freshness: used
      - target: t75_flask
        gesture: click
        validator:
          preset: correct_target
        response:
          scene_operations:
            - type: ObjectStateChange
              target: t75_flask
              state:
                material_name: cell_suspension
                material_volume: 12
                cell_state: suspension
            - type: ObjectStateChange
              target: serological_pipette
              state:
                held_material_name: empty
                held_material_volume: 0
    step_validator:
      preset: sequence_complete
    outcome:
      on_success: complete
      on_failure: retry
    next_step: null
