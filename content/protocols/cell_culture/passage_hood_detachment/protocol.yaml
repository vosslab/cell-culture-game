protocol_type: mini_protocol
protocol_name: passage_hood_detachment
entry_step: inspect_confluence
initial_state:
  # Direct launch begins with the same representative culture that the
  # sequence runners seed: an identity-labeled T75 containing a 70-80%
  # adherent monolayer in complete medium. The roughly 3 mL trypsin rinse
  # below is therefore a fixed teaching scenario, not a universal T75 rule.
  - target: t75_flask
    state:
      material_name: media
      material_volume: 12
      cell_state: attached_70_80
      label_status: identity_complete
  - target: pbs_bottle
    state: { material_name: pbs, material_volume: 500 }
  - target: trypsin_bottle
    state: { material_name: trypsin, material_volume: 500 }
  - target: media_bottle
    state: { material_name: media, material_volume: 500 }
learning:
  objectives:
    Students completing this mini-protocol will have achieved fluency with
    the visual assessment of cell confluence and the technique of enzymatic cell detachment
    from a tissue-culture flask using trypsin.
  outcomes:
    Students completing this mini-protocol will be able to inspect and confirm
    cell confluence under a microscope, aseptically detach adherent cells from a culture
    flask with trypsin and appropriate incubation, and neutralize the trypsin to preserve
    cell viability during transfer.
  goals:
    "Overall, this mini-protocol aims to accomplish the first stage of routine
    cell passage: detaching cells from a T75 flask for subculture and replating. This
    is the entry point for any maintenance-passage or experimental-expansion workflow.
    The 9 steps reflect the full pedagogical pathway from initial confluence assessment
    through trypsin neutralization, including the essential ~2-minute incubation and visual detachment check."
steps:
  - step_name: inspect_confluence
    prompt:
      Inspect the representative T75 field under the microscope. Compare the visible monolayer with the available decisions and choose the conclusion supported by cell coverage and spacing.
    sequence:
      - target: microscope
        gesture: click
        instruction: "Open the microscope view to inspect confluence."
        hint: "Use the visible monolayer field to assess readiness before choosing the confluence decision."
        validator:
          preset: correct_target
        response:
          scene_operations:
            - type: SceneChange
              to_scene: passage_hood_detachment_microscope_view
      - target: t75_flask
        gesture: click
        instruction: "Inspect the visible T75 monolayer."
        hint: "Use the microscope field to assess confluence before choosing the decision."
        validator:
          preset: correct_target
        response:
          scene_operations:
            - type: ObjectStateChange
              target: microscope
              state:
                observation_state: confluent_70_80
      - target: confluence_decision_proceed
        gesture: select
        instruction: "Compare the visible monolayer with the available confluence decisions and choose the matching readiness assessment."
        hint: "Use cell coverage and spacing in the microscope field as evidence for the passage-readiness decision."
        validator:
          preset: correct_choice
        response:
          scene_operations:
            - type: ObjectStateChange
              target: t75_flask
              state:
                inspection_status: observed_at_confluence
          feedback:
            correct: "Proceed: the visible monolayer is in the 70-80% confluence range for routine passage."
            incorrect: "Compare the visible field with both choices. In this fixed scenario, the near-confluent adherent monolayer is ready to passage."
      - target: hood_surface
        gesture: click
        instruction: "Move to the disinfected hood surface."
        hint: "Work on the cleaned hood surface before handling the culture."
        validator:
          preset: correct_target
        response:
          scene_operations:
            - type: SceneChange
              to_scene: passage_hood_detachment_hood_workspace
    step_validator:
      preset: sequence_complete
    outcome:
      on_success: complete
      on_failure: retry
    next_step: spray_hood_with_ethanol
  - step_name: spray_hood_with_ethanol
    prompt: Spray the interior hood surface with 70% ethanol, then use a clean paper towel to wipe the wetted surface. This disinfects/decontaminates the work area; it does not sterilize it.
    sequence:
      - target: ethanol_bottle
        gesture: click
        instruction: "Apply 70% ethanol to the hood surface."
        hint: "Wet the interior surface evenly before wiping it with the clean towel."
        validator:
          preset: correct_target
        response:
          scene_operations:
            - type: ObjectStateChange
              target: hood_surface
              state:
                surface_cleanliness: ethanol_sprayed
      - target: paper_towel_pad
        gesture: click
        instruction: "Wipe the wetted hood surface with the clean paper towel."
        hint: "Complete contact across the ethanol-wetted area; this disinfects but does not sterilize the hood."
        validator:
          preset: correct_target
        response:
          scene_operations:
            - type: ObjectStateChange
              target: hood_surface
              state:
                surface_cleanliness: ethanol_wiped
                contact_status: wet_wipe_complete
          feedback:
            correct: "Correct: the wet wipe completes surface contact for disinfection/decontamination. Ethanol does not sterilize the hood."
            incorrect: "After applying ethanol, wipe the wetted hood surface with the clean paper towel to complete the contact step."
    step_validator:
      preset: sequence_complete
    outcome:
      on_success: complete
      on_failure: retry
    next_step: aspirate_spent_media
  - step_name: aspirate_spent_media
    prompt: Aspirate spent medium from the flask while keeping the tip above the adherent-cell layer.
    sequence:
      - target: aspirating_pipette
        gesture: click
        instruction: "Attach the aspirating pipette for the removal step."
        hint: "Keep its tip above the cell layer or pellet while aspirating."
        validator:
          preset: correct_target
        response:
          scene_operations: []
      - target: t75_flask
        gesture: click
        instruction: "Aspirate the spent medium from the T75 flask."
        hint: "Keep the pipette tip above the adherent-cell layer while removing the liquid."
        validator:
          preset: correct_target
        response:
          scene_operations:
            - type: ObjectStateChange
              target: t75_flask
              state:
                material_name: empty
                material_volume: 0
    step_validator:
      preset: sequence_complete
    outcome:
      on_success: complete
      on_failure: retry
    next_step: pbs_wash
  - step_name: pbs_wash
    prompt:
      Measure approximately 4 mL PBS at the serological-pipette graduations, cover the monolayer, and rinse gently to remove residual serum.
    sequence:
      - target: serological_pipette_pack
        gesture: click
        instruction: "Fit a fresh sterile pipette from the pack."
        hint: "Use the sterile graduated pipette for the measured transfer that follows."
        validator:
          preset: correct_target
        response:
          scene_operations:
            - type: ObjectStateChange
              target: serological_pipette
              state: { freshness: sterile }
      - target: serological_pipette
        gesture: click
        instruction: "Attach the serological pipette for the next transfer."
        hint: "Use the attached tool to perform the following source draw or dispense."
        validator:
          preset: correct_target
        response:
          scene_operations: []
      - target: pbs_bottle
        gesture: click
        instruction: "Draw 4 mL of PBS from the bottle."
        hint: "Measure the PBS at the pipette graduations before rinsing or filling the solution tube."
        validator:
          preset: correct_target
        response:
          scene_operations:
            - type: ObjectStateChange
              target: pbs_bottle
              state:
                material_volume: 496
            - type: ObjectStateChange
              target: serological_pipette
              state:
                held_material_name: pbs
                held_material_volume: 4
                freshness: used
      - target: t75_flask
        gesture: click
        instruction: "Rinse the covered monolayer gently with the PBS."
        hint: "Keep the PBS over the adherent cells while completing the wash."
        validator:
          preset: correct_target
        response:
          scene_operations:
            - type: ObjectStateChange
              target: t75_flask
              state:
                material_name: pbs
                material_volume: 4
                cell_state: attached_70_80
                rinse_status: pbs_coverage_pending
            - type: ObjectStateChange
              target: serological_pipette
              state:
                held_material_name: empty
                held_material_volume: 0
      - target: t75_flask
        gesture: click
        instruction: "Finish the PBS rinse across the monolayer."
        hint: "The coverage is already present; complete the gentle rinse before aspiration."
        validator:
          preset: correct_target
        response:
          scene_operations:
            - type: ObjectStateChange
              target: t75_flask
              state:
                rinse_status: pbs_rinse_complete
          feedback:
            correct: "The visible PBS coverage has been gently rinsed across the adherent surface; the wash can now be vacuum-aspirated."
            incorrect: "After PBS covers the monolayer, complete the gentle rinse before removing it by vacuum aspiration."
    step_validator:
      preset: sequence_complete
    outcome:
      on_success: complete
      on_failure: retry
    next_step: aspirate_pbs
  - step_name: aspirate_pbs
    prompt: Aspirate all PBS from the flask. Residual serum can inhibit trypsin.
    sequence:
      - target: aspirating_pipette
        gesture: click
        instruction: "Attach the aspirating pipette for the removal step."
        hint: "Keep its tip above the cell layer or pellet while aspirating."
        validator:
          preset: correct_target
        response:
          scene_operations: []
      - target: t75_flask
        gesture: click
        instruction: "Aspirate the PBS rinse from the T75 flask."
        hint: "Keep the pipette tip above the adherent-cell layer while removing the liquid."
        validator:
          preset: correct_target
        response:
          scene_operations:
            - type: ObjectStateChange
              target: t75_flask
              state:
                material_name: empty
                material_volume: 0
    step_validator:
      preset: sequence_complete
    outcome:
      on_success: complete
      on_failure: retry
    next_step: add_trypsin
  - step_name: add_trypsin
    prompt:
      For this fixed teaching scenario, measure approximately 3 mL trypsin at the serological-pipette graduations and add it to cover the monolayer.
    sequence:
      - target: serological_pipette_pack
        gesture: click
        instruction: "Fit a fresh sterile pipette from the pack."
        hint: "Use the sterile graduated pipette for the measured transfer that follows."
        validator:
          preset: correct_target
        response:
          scene_operations:
            - type: ObjectStateChange
              target: serological_pipette
              state: { freshness: sterile }
      - target: serological_pipette
        gesture: click
        instruction: "Attach the serological pipette for the next transfer."
        hint: "Use the attached tool to perform the following source draw or dispense."
        validator:
          preset: correct_target
        response:
          scene_operations: []
      - target: trypsin_bottle
        gesture: click
        instruction: "Draw 3 mL of trypsin from the bottle."
        hint: "Use the graduated pipette to measure the fixed 3 mL trypsin addition."
        validator:
          preset: correct_target
        response:
          scene_operations:
            - type: ObjectStateChange
              target: trypsin_bottle
              state:
                material_volume: 497
            - type: ObjectStateChange
              target: serological_pipette
              state:
                held_material_name: trypsin
                held_material_volume: 3
                freshness: used
      - target: t75_flask
        gesture: click
        instruction: "Cover the T75 monolayer with the measured trypsin."
        hint: "Spread the trypsin across the attached cells before the timed detachment step."
        validator:
          preset: correct_target
        response:
          scene_operations:
            - type: ObjectStateChange
              target: t75_flask
              state:
                material_name: trypsin
                material_volume: 3
                cell_state: attached_70_80
            - type: ObjectStateChange
              target: serological_pipette
              state:
                held_material_name: empty
                held_material_volume: 0
    step_validator:
      preset: sequence_complete
    outcome:
      on_success: complete
      on_failure: retry
    next_step: incubate_for_detachment
  - step_name: incubate_for_detachment
    prompt:
      Incubate with trypsin for about 2 minutes, then inspect for rounded, detached cells rather than relying on time alone.
    sequence:
      - target: incubator
        gesture: click
        instruction: "Place the prepared vessel in the incubator and start the Allowing trypsin to act; check detachment."
        hint: "Allow the authored Allowing trypsin to act; check detachment to complete before continuing the culture workflow."
        validator:
          preset: correct_target
        response:
          scene_operations:
            - type: TimedWait
              target: incubator
              duration_min: 2
              display: "Allowing trypsin to act; check detachment"
    step_validator:
      preset: sequence_complete
    outcome:
      on_success: complete
      on_failure: retry
    next_step: confirm_detachment
  - step_name: confirm_detachment
    prompt:
      Inspect the fixed-scenario field under the microscope. Compare the visible rounded cells with both decisions before returning to the hood to neutralize trypsin.
    sequence:
      - target: microscope
        gesture: click
        instruction: "Open the microscope view to inspect cell detachment."
        hint: "Compare the rounded, detached cells in the visible field before neutralizing trypsin."
        validator:
          preset: correct_target
        response:
          scene_operations:
            - type: SceneChange
              to_scene: passage_hood_detachment_microscope_view
      - target: t75_flask
        gesture: click
        instruction: "Inspect the T75 flask for rounded, detached cells."
        hint: "Use the visible detachment field before neutralizing the trypsin."
        validator:
          preset: correct_target
        response:
          scene_operations:
            - type: ObjectStateChange
              target: microscope
              state:
                observation_state: rounded_detached
      - target: detachment_decision_neutralize
        gesture: select
        instruction: "Compare the visible cell shapes with the available detachment decisions and choose the matching assessment."
        hint: "Use the rounded-cell pattern and separation from the surface as evidence before neutralizing trypsin."
        validator:
          preset: correct_choice
        response:
          scene_operations:
            - type: ObjectStateChange
              target: t75_flask
              state:
                cell_state: rounded_detached
          feedback:
            correct: "Confirmed: the cells are rounded and detached, so medium can now neutralize trypsin."
            incorrect: "Compare the visible field with both choices. In this fixed scenario, the rounded detached cells are ready for neutralization."
      - target: hood_surface
        gesture: click
        instruction: "Return to the hood surface after inspecting the flask."
        hint: "Keep the inspected flask in the clean hood workspace for the next transfer."
        validator:
          preset: correct_target
        response:
          scene_operations:
            - type: SceneChange
              to_scene: passage_hood_detachment_hood_workspace
    step_validator:
      preset: sequence_complete
    outcome:
      on_success: complete
      on_failure: retry
    next_step: neutralize_trypsin
  - step_name: neutralize_trypsin
    prompt:
      Measure 9 mL complete medium at the serological-pipette graduations and add it to neutralize 3 mL trypsin. The flask should now contain a uniform cell suspension.
    sequence:
      - target: serological_pipette_pack
        gesture: click
        instruction: "Fit a fresh sterile pipette from the pack."
        hint: "Use the sterile graduated pipette for the measured transfer that follows."
        validator:
          preset: correct_target
        response:
          scene_operations:
            - type: ObjectStateChange
              target: serological_pipette
              state: { freshness: sterile }
      - target: serological_pipette
        gesture: click
        instruction: "Attach the serological pipette for the next transfer."
        hint: "Use the attached tool to perform the following source draw or dispense."
        validator:
          preset: correct_target
        response:
          scene_operations: []
      - target: media_bottle
        gesture: click
        instruction: "Draw 9 mL of media from the bottle."
        hint: "Use the measured media load for the receiving tube, flask, or reservoir in the next action."
        validator:
          preset: correct_target
        response:
          scene_operations:
            - type: ObjectStateChange
              target: media_bottle
              state:
                material_volume: 491
            - type: ObjectStateChange
              target: serological_pipette
              state:
                held_material_name: media
                held_material_volume: 9
                freshness: used
      - target: t75_flask
        gesture: click
        instruction: "Add complete medium to the T75 flask to neutralize trypsin."
        hint: "Use the measured 9 mL medium addition to protect the detached cells."
        validator:
          preset: correct_target
        response:
          scene_operations:
            - type: ObjectStateChange
              target: t75_flask
              state:
                material_name: cell_suspension
                material_volume: 12
                cell_state: suspension
            - type: ObjectStateChange
              target: serological_pipette
              state:
                held_material_name: empty
                held_material_volume: 0
    step_validator:
      preset: sequence_complete
    outcome:
      on_success: complete
      on_failure: retry
    next_step: null
