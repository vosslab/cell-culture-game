scene_name: seeding_workspace
extends: plate_focus_hood
scene_notes: |
  Workspace for cell seeding (A29-A31): prepare diluted suspension and seed
  96-well plate. The inherited foreground plate is deliberately enlarged for
  well-level teaching; every supporting item below is an authored protocol target.

add_placements:
  # A single rear preparation shelf leaves the foreground band tall enough for
  # the 96-well plate. Keeping every support object on the same depth tier
  # avoids an artificial middle row that pushed the plate off the canvas.
  # The two preparation vessels occupy the rear-left context station. The plate
  # remains unobscured in the foreground teaching zone.
  - placement_name: rear_left_cell_suspension_conical
    object_name: conical_15ml
    zone: rear_center
    depth_tier: 1
    align_stop: center

  - placement_name: rear_left_conical_tube_for_dilution
    object_name: conical_tube_for_dilution
    zone: rear_center
    depth_tier: 1
    align_stop: right

  # Media is the preparation reagent needed before dispensing into the
  # foreground plate. Mixing is gentle inversion of the closed tube, not vortexing.
  - placement_name: rear_center_media_bottle
    object_name: media_bottle
    zone: rear_center
    depth_tier: 1
    align_stop: left

  # The reservoir is required for an eight-channel draw; a conical tube cannot
  # physically service all eight tips at once.
  - placement_name: rear_center_reagent_reservoir
    object_name: reagent_reservoir
    zone: rear_center
    depth_tier: 1
    align_stop: center

  # Incubator is the post-seeding destination in the rear-right context station.
  - placement_name: rear_right_incubator
    object_name: incubator
    zone: rear_center
    depth_tier: 1
    align_stop: center

  # The two required transfer tools remain on the rear preparation shelf. The
  # generic micropipette was unused here and crowded the plate-focused composition.
  - placement_name: right_multichannel_pipette
    object_name: multichannel_pipette
    zone: rear_center
    depth_tier: 1
    align_stop: left

  - placement_name: right_serological_pipette
    object_name: serological_pipette
    zone: rear_center
    depth_tier: 1
    align_stop: right

  - placement_name: right_sterile_serological_pipette_pack
    object_name: serological_pipette_pack
    zone: right_tool_area
    depth_tier: 1
    align_stop: center

  - placement_name: right_multichannel_tip_box
    object_name: micropipette_tip_box
    zone: right_tool_area
    depth_tier: 1
    align_stop: left
