scene_name: seeding_workspace
extends: plate_focus_hood
scene_notes: |
  Workspace for cell seeding (A29-A31): prepare diluted suspension and seed
  96-well plate. The inherited foreground plate is deliberately enlarged for
  well-level teaching; every supporting item below is an authored protocol target.

add_placements:
  # The two preparation vessels occupy the rear-left context station. The plate
  # remains unobscured in the foreground teaching zone.
  - placement_name: rear_left_cell_suspension_tube
    object_name: cell_suspension_tube
    zone: rear_left
    depth_tier: 1
    align_stop: center

  - placement_name: rear_left_conical_tube_for_dilution
    object_name: conical_tube_for_dilution
    zone: rear_left
    depth_tier: 2
    align_stop: right

  # Media and vortex are the two protocol targets needed to prepare the
  # suspension before dispensing into the foreground plate.
  - placement_name: rear_center_media_bottle
    object_name: media_bottle
    zone: rear_center
    depth_tier: 1
    align_stop: left

  - placement_name: rear_center_vortex
    object_name: vortex
    zone: rear_center
    depth_tier: 2
    align_stop: right

  # Incubator is the post-seeding destination in the rear-right context station.
  - placement_name: rear_right_incubator
    object_name: incubator
    zone: rear_right
    depth_tier: 1
    align_stop: center

  # The two authored pipettes share the deliberately narrow secondary tool rack.
  - placement_name: right_micropipette
    object_name: micropipette
    zone: right_tool_area
    depth_tier: 1
    align_stop: left

  - placement_name: right_serological_pipette
    object_name: serological_pipette
    zone: right_tool_area
    depth_tier: 1
    align_stop: right
