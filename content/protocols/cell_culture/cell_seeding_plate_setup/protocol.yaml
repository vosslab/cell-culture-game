# Simulation design: an eight-channel pipette draws from a reagent reservoir and
# dispenses one complete 8-well column per draw. The 12 column interactions model
# the genuine 96-well seeding action and show progress without converting it into
# 96 isolated clicks.
protocol_type: mini_protocol
protocol_name: cell_seeding_plate_setup
entry_step: calculate_dilution_volume
initial_state:
  # A standalone run begins after the 10 &micro;L trypan-blue count and the upstream
  # pellet resuspension. In cell_culture_full, the runner carries these same
  # object states forward and intentionally ignores constituent seeds.
  - target: conical_15ml
    state:
      material_name: cell_suspension
      material_volume: 6.85
  - target: media_bottle
    state:
      material_name: media
      material_volume: 474.24
learning:
  objectives:
    Students completing this mini-protocol will have achieved fluency with
    applying C1V1 = C2V2 dilution calculations to prepare a cell suspension at a specified
    target concentration.
  outcomes:
    Students completing this mini-protocol will be able to calculate the volume
    of cell stock needed to prepare 12 mL of 2x10^5 cells/mL suspension, prepare the
    diluted suspension, seed a 96-well plate at 100 microL per well, and incubate
    the seeded plate for overnight cell attachment.
  goals:
    "Overall, this mini-protocol aims to accomplish the cell-seeding phase for
    a dose-response experiment: taking the counted cell suspension from MP-3 and preparing
    a 12 mL working suspension at the precise concentration and volume needed for
    96-well experimental seeding. Students apply C1V1 = C2V2 to calculate dilution volume (A29), perform
    the physical seeding step (A30), and trigger incubation for cell attachment (A31)."
steps:
  - step_name: calculate_dilution_volume
    scene: seeding_calculation_review
    prompt:
      Use the displayed cell concentration to calculate the stock volume for 12 mL
      at 2x10^5 cells/mL with C1V1 = C2V2. The counter reports 8.5x10^5 cells/mL;
      select the calculation card that gives V1 in milliliters.
    sequence:
      - target: calculation_2_8_ml
        gesture: select
        instruction: "Choose the calculation card that matches the displayed dilution equation and target volume."
        hint: "Use the visible stock concentration, target concentration, and 12 mL final volume to identify the card whose V1 is in milliliters."
        validator:
          preset: correct_choice
        response:
          scene_operations:
            - type: ObjectStateChange
              target: calculation_pad
              state:
                entered_value: 2.8
            - type: SceneChange
              to_scene: seeding_workspace
          feedback:
            correct: "Correct. The displayed concentration and target volume give 2.8 mL of stock-cell suspension."
            incorrect: "Recheck C1V1 = C2V2 using the displayed concentration and the 12 mL target volume."
    step_validator:
      preset: sequence_complete
    outcome:
      on_success: complete
      on_failure: retry
    next_step: prepare_diluted_suspension
  - step_name: prepare_diluted_suspension
    prompt: >
      Prepare 12 mL of 2x10^5 cells/mL suspension. Add 9.2 mL complete media to a fresh
      conical first, then use a separate fresh serological pipette to add the calculated
      stock-cell volume. Mixing is gentle inversion; this rounded 2.8 mL plus 9.2 mL recipe yields approximately
      2x10^5 cells/mL from the 8.5x10^5 cells/mL measurement.
    sequence:
      - target: serological_pipette_pack
        gesture: click
        instruction: "Fit a fresh serological pipette for the media transfer."
        hint: "Use a sterile graduated pipette to draw the measured media first."
        validator: { preset: correct_target }
        response:
          scene_operations:
            - type: ObjectStateChange
              target: serological_pipette
              state: { freshness: sterile }
      - target: serological_pipette
        gesture: click
        instruction: "Attach the serological pipette for the next transfer."
        hint: "Use the attached tool to perform the following source draw or dispense."
        validator:
          preset: correct_target
        response:
          scene_operations: []
      - target: media_bottle
        gesture: click
        instruction: "Draw 9.2 mL of media from the bottle."
        hint: "Use the measured media load for the receiving tube, flask, or reservoir in the next action."
        validator:
          preset: correct_target
        response:
          scene_operations:
            - type: ObjectStateChange
              target: media_bottle
              state:
                material_volume: 465.04
            - type: ObjectStateChange
              target: serological_pipette
              state:
                held_material_name: media
                held_material_volume: 9.2
      - target: conical_tube_for_dilution
        gesture: click
        instruction: "Deliver 9.2 mL complete media into the dilution tube."
        hint: "Use the fresh pipette to receive the measured media before adding cells."
        validator:
          preset: correct_target
        response:
          scene_operations:
            - type: ObjectStateChange
              target: conical_tube_for_dilution
              state:
                material_name: media
                material_volume: 9.2
            - type: ObjectStateChange
              target: serological_pipette
              state:
                held_material_name: empty
                held_material_volume: 0
                freshness: used
      - target: serological_pipette_pack
        gesture: click
        instruction: "Fit a new serological pipette for the cell-suspension transfer."
        hint: "Switch to a fresh sterile pipette before drawing the calculated stock-cell volume."
        validator: { preset: correct_target }
        response:
          scene_operations:
            - type: ObjectStateChange
              target: serological_pipette
              state: { freshness: sterile }
      - target: conical_15ml
        gesture: click
        instruction: "Draw 2.8 mL of cell suspension from the conical 15ml."
        hint: "Use the conical 15ml as the source, then carry this measured load to conical tube for dilution."
        validator:
          preset: correct_target
        response:
          scene_operations:
            - type: ObjectStateChange
              target: conical_15ml
              state:
                material_volume: 4.05
            - type: ObjectStateChange
              target: serological_pipette
              state:
                held_material_name: cell_suspension
                held_material_volume: 2.8
      - target: conical_tube_for_dilution
        gesture: click
        instruction: "Deliver the calculated 2.8 mL cell suspension into the dilution tube."
        hint: "Add the stock-cell volume to the media already in the tube."
        validator:
          preset: correct_target
        response:
          scene_operations:
            - type: ObjectStateChange
              target: conical_tube_for_dilution
              state:
                material_name: cell_suspension
                material_volume: 12
            - type: ObjectStateChange
              target: serological_pipette
              state:
                held_material_name: empty
                held_material_volume: 0
                freshness: used
      - target: conical_tube_for_dilution
        gesture: click
        instruction: "Gently invert the 12 mL dilution tube to mix the suspension."
        hint: "The media and cells are combined; invert without creating bubbles."
        validator:
          preset: correct_target
        response:
          scene_operations:
            - type: ObjectStateChange
              target: conical_tube_for_dilution
              state:
                material_name: cell_suspension
                material_volume: 12
    step_validator:
      preset: sequence_complete
    outcome:
      on_success: complete
      on_failure: retry
    next_step: seed_96_well_plate
  - step_name: seed_96_well_plate
    prompt:
      Seed the 96-well plate with 100 microL per well of the prepared 2x10^5 cells/mL
      suspension. Transfer the prepared suspension to the reagent reservoir, then use the
      8-channel pipette to fill one complete column (A-H) at a time. Twelve 100 microL
      column dispenses seed the plate and leave 2.4 mL dead volume in the reservoir.
    sequence:
      - target: multichannel_pipette
        gesture: click
        instruction: "Attach the multichannel pipette for the next transfer."
        hint: "Use the attached tool to perform the following source draw or dispense."
        validator:
          preset: correct_target
        response:
          scene_operations: []
      - target: micropipette_tip_box
        gesture: click
        instruction: "Fit a fresh tip on the multichannel pipette."
        hint: "Use the fresh tip before touching the next source or receiving vessel."
        validator:
          preset: correct_target
        response:
          scene_operations:
            - type: ObjectStateChange
              target: multichannel_pipette
              state:
                tip_status: fresh
      - target: multichannel_pipette
        gesture: adjust
        instruction: "Set the multichannel pipette to 100 microL per channel for each plate column."
        hint: "The 100 microL set point delivers the required volume to every well in one 8-well column and keeps the seeding concentration consistent."
        validator:
          preset: target_with_value
          value:
            set_volume: 100
        response:
          scene_operations:
            - type: ObjectStateChange
              target: multichannel_pipette
              state:
                set_volume: 100
      - target: conical_tube_for_dilution
        gesture: click
        instruction: "Transfer the prepared cell suspension into the reagent reservoir."
        hint: "Empty the dilution tube completely so the reservoir can supply each plate column."
        validator:
          preset: correct_target
        response:
          scene_operations:
            - type: ObjectStateChange
              target: conical_tube_for_dilution
              state:
                material_name: empty
                material_volume: 0
            - type: ObjectStateChange
              target: reagent_reservoir
              state:
                material_name: cell_suspension
                material_volume: 12
      - target: reagent_reservoir
        gesture: click
        instruction: "Draw 100 microL of cell suspension for plate column 1."
        hint: "Use the reservoir as the source, then deliver this load into plate column 1."
        validator:
          preset: correct_target
        response:
          scene_operations:
            - type: ObjectStateChange
              target: reagent_reservoir
              state:
                material_volume: 11.2
            - type: ObjectStateChange
              target: multichannel_pipette
              state:
                held_material_name: cell_suspension
                held_material_volume: 100
      - target: well_plate_96.col_1
        gesture: click
        instruction: "Dispense 100 microL of cell suspension into plate column 1."
        hint: "Align all eight tips with column 1; empty the loaded cell suspension into the wells."
        validator:
