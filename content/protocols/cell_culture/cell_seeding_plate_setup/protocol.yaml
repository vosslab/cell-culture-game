        gesture: click
        instruction: "Pick up the completed plate for incubation."
        hint: "Keep the treatment map level while moving the plate into the incubator."
        validator:
          preset: correct_target
        response:
          scene_operations: []
      - target: incubator
        gesture: click
        instruction: "Place the prepared vessel in the incubator and start the overnight incubation (24 hours)."
        hint: "Allow the authored overnight incubation (24 hours) to complete before continuing the culture workflow."
        validator:
          preset: correct_target
        response:
          scene_operations:
            - type: ObjectStateChange
              target: incubator
              state:
                door_open: false
            - type: TimedWait
              target: incubator
              duration_min: 1440
              display: overnight incubation (24 hours)
            - type: ObjectStateChange
              target: well_plate_96.all_wells
              state:
                material_name: cells_in_growth_media
                material_volume: 100
    step_validator:
      preset: sequence_complete
    outcome:
      on_success: complete
      on_failure: retry
    next_step: null
