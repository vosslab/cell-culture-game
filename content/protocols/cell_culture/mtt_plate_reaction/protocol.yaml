# Simulation design: MTT is transferred to a reagent reservoir before the eight-channel
# pipette distributes it. The visible all-wells action represents the already-taught
# twelve-column pattern rather than an impossible draw from a small tube. Numerical model per OVCAR8_MATH_REVIEW.md:
# pre-MTT well total = 200 &micro;L (cells + media + drug); 25 &micro;L MTT added -> 225 &micro;L post-MTT.
# MTT (3-(4,5-dimethylthiazol-2-yl)-2,5-diphenyltetrazolium bromide) is reduced to purple
# formazan by viable-cell mitochondrial activity; depth of color after DMSO solubilization
# is proportional to viable cell count.
protocol_type: mini_protocol
protocol_name: mtt_plate_reaction
entry_step: prepare_mtt_and_pipette
initial_state:
  - target: mtt_solution_tube
    state:
      material_name: mtt_solution_12mm
      material_volume: 4.0
  - target: well_plate_96.all_wells
    state:
      material_name: treated_cell_culture
      material_volume: 200
learning:
  objectives:
    Students completing this mini-protocol will have achieved fluency with
    uniform whole-plate reagent dispensing using a multichannel pipette, timed incubation
    scheduling for metabolic conversion, biohazard waste handling for cytotoxic dye,
    and critical plate-preparation steps (drying) before downstream solubilization.
  outcomes:
    Students completing this mini-protocol will be able to add MTT reagent
    uniformly across a 96-well plate at a fixed concentration, manage an incubation
    timer for the MTT-to-formazan reduction, safely decant cytotoxic waste into a
    biohazard container, and dry a plate without dislodging formazan crystals.
  goals:
    "Overall, this mini-protocol aims to accomplish the MTT colorimetric assay
    readiness phase: loading MTT dye across treated wells, allowing formazan crystal
    formation under aerobic incubation, removing excess MTT/media/drug mixture, and
    preparing the dry plate for DMSO solubilization and absorbance measurement. This
    step bridges post-treatment cell samples (from Day 2 drug incubation; wells at
    200 &micro;L each) to the quantitative viability readout (Day 4 absorbance)."
steps:
  - step_name: prepare_mtt_and_pipette
    prompt:
      Confirm that the freshly prepared 12 mM MTT solution is yellow and ready, bring it
      with the treated 96-well plate to the incubator workspace, and set the multichannel
      pipette to 25 microL per channel. This produces 225 microL total and about 1.33 mM
      MTT in each 200 microL well.
    sequence:
      - target: mtt_solution_tube
        gesture: click
        validator:
          preset: correct_target
        response:
          scene_operations:
            - type: SceneChange
              to_scene: incubator_workspace
          feedback:
            correct: "Fresh yellow MTT solution is ready for the assay."
            incorrect: "Use only the freshly prepared yellow 12 mM MTT solution."
      - target: well_plate_96
        gesture: click
        validator:
          preset: correct_target
        response:
          scene_operations: []
      - target: multichannel_pipette
        gesture: click
        validator:
          preset: correct_target
        response:
          scene_operations: []
      - target: multichannel_pipette
        gesture: adjust
        validator:
          preset: target_with_value
          value:
            set_volume: 25
        response:
          scene_operations:
            - type: ObjectStateChange
              target: multichannel_pipette
              state:
                set_volume: 25
    step_validator:
      preset: sequence_complete
    outcome:
      on_success: complete
      on_failure: retry
    next_step: add_mtt_to_wells
  - step_name: add_mtt_to_wells
    prompt:
      "Transfer the MTT solution to the reagent reservoir, then use the 8-channel pipette
      to complete the same twelve column strokes practiced during seeding. Each well ends at 225 microL."
    sequence:
      - target: multichannel_pipette
        gesture: click
        validator:
          preset: correct_target
        response:
          scene_operations: []
      - target: micropipette_tip_box
        gesture: click
        validator:
          preset: correct_target
        response:
          scene_operations:
            - type: ObjectStateChange
              target: multichannel_pipette
              state:
                tip_status: fresh
          feedback:
            correct: "A fresh matched set of eight tips is fitted before the MTT transfer."
            incorrect: "Use the visible tip box to fit fresh multichannel tips before handling MTT."
      - target: mtt_solution_tube
        gesture: click
        validator:
          preset: correct_target
        response:
          scene_operations:
            - type: ObjectStateChange
              target: mtt_solution_tube
              state:
                material_name: mtt_solution_12mm
                material_volume: 0
            - type: ObjectStateChange
              target: reagent_reservoir
              state:
                material_name: mtt_solution_12mm
                material_volume: 4
      - target: reagent_reservoir
        gesture: click
        validator:
          preset: correct_target
        response:
          scene_operations:
            - type: ObjectStateChange
              target: reagent_reservoir
              state:
                material_volume: 3.8
            - type: ObjectStateChange
              target: multichannel_pipette
              state:
                held_material_name: mtt_solution_12mm
                held_material_volume: 25
      - target: well_plate_96.col_1
        gesture: click
        validator:
          preset: correct_target
        response:
          scene_operations:
            - type: ObjectStateChange
              target: well_plate_96.col_1
              state:
                material_name: mtt_reaction_mixture
                material_volume: 225
            - type: ObjectStateChange
              target: multichannel_pipette
              state:
                held_material_name: empty
                held_material_volume: 0
      - target: reagent_reservoir
        gesture: click
        validator: { preset: correct_target }
        response:
          scene_operations:
            - type: ObjectStateChange
              target: reagent_reservoir
              state: { material_volume: 3.6 }
            - type: ObjectStateChange
              target: multichannel_pipette
