      on_failure: retry
    next_step: incubate_formazan_conversion
  - step_name: incubate_formazan_conversion
    prompt: >
      Place the MTT-loaded plate into the incubator for 1.5 hours at 37 degrees Celsius.
      Viable cells reduce yellow MTT to purple formazan. Compare each carboplatin row
      with its matched metformin-combination half: the untreated controls are darkest,
      formazan becomes lighter with increasing carboplatin dose, and the combination
      half is lower than its carboplatin-only match.
    sequence:
      - target: well_plate_96
        gesture: click
        validator:
          preset: correct_target
        response:
          scene_operations: []
      - target: incubator
        gesture: click
        validator:
          preset: correct_target
        response:
          scene_operations:
            - type: TimedWait
              target: incubator
              duration_min: 90
              display: formazan conversion (1.5 hours)
            # Row A is the untreated reference. Rows B-H preserve the actual
            # carboplatin series, with a matched metformin-combination half.
            - { type: ObjectStateChange, target: well_plate_96.block_A_1_6, state: { material_name: formazan_control, material_volume: 225 } }
            - { type: ObjectStateChange, target: well_plate_96.block_A_7_12, state: { material_name: formazan_metformin_control, material_volume: 225 } }
            - { type: ObjectStateChange, target: well_plate_96.row_B_1_6, state: { material_name: formazan_carboplatin_0_1umol, material_volume: 225 } }
            - { type: ObjectStateChange, target: well_plate_96.row_B_7_12, state: { material_name: formazan_carboplatin_0_1umol_metformin_5mmol, material_volume: 225 } }
            - { type: ObjectStateChange, target: well_plate_96.row_C_1_6, state: { material_name: formazan_carboplatin_0_2umol, material_volume: 225 } }
            - { type: ObjectStateChange, target: well_plate_96.row_C_7_12, state: { material_name: formazan_carboplatin_0_2umol_metformin_5mmol, material_volume: 225 } }
            - { type: ObjectStateChange, target: well_plate_96.row_D_1_6, state: { material_name: formazan_carboplatin_0_5umol, material_volume: 225 } }
            - { type: ObjectStateChange, target: well_plate_96.row_D_7_12, state: { material_name: formazan_carboplatin_0_5umol_metformin_5mmol, material_volume: 225 } }
            - { type: ObjectStateChange, target: well_plate_96.row_E_1_6, state: { material_name: formazan_carboplatin_1umol, material_volume: 225 } }
            - { type: ObjectStateChange, target: well_plate_96.row_E_7_12, state: { material_name: formazan_carboplatin_1umol_metformin_5mmol, material_volume: 225 } }
            - { type: ObjectStateChange, target: well_plate_96.row_F_1_6, state: { material_name: formazan_carboplatin_2umol, material_volume: 225 } }
            - { type: ObjectStateChange, target: well_plate_96.row_F_7_12, state: { material_name: formazan_carboplatin_2umol_metformin_5mmol, material_volume: 225 } }
            - { type: ObjectStateChange, target: well_plate_96.row_G_1_6, state: { material_name: formazan_carboplatin_5umol, material_volume: 225 } }
            - { type: ObjectStateChange, target: well_plate_96.row_G_7_12, state: { material_name: formazan_carboplatin_5umol_metformin_5mmol, material_volume: 225 } }
            - { type: ObjectStateChange, target: well_plate_96.row_H_1_6, state: { material_name: formazan_carboplatin_10umol, material_volume: 225 } }
            - { type: ObjectStateChange, target: well_plate_96.row_H_7_12, state: { material_name: formazan_carboplatin_10umol_metformin_5mmol, material_volume: 225 } }
          feedback:
            correct: "The plate now shows a visible dose response: darker crystals indicate greater viable-cell metabolic activity."
            incorrect: "Incubate the MTT-loaded plate before interpreting its color pattern."
    step_validator:
      preset: sequence_complete
    outcome:
      on_success: complete
      on_failure: retry
    next_step: decant_mtt_to_waste
  - step_name: decant_mtt_to_waste
    prompt:
      Remove the plate from the incubator. Hold the plate over the biohazard waste
      container and carefully pour the spent well contents (cells + media + Day 2 drug
      residue + reduced MTT) into the waste bin. Do not lose any wells or spill on the
      work surface. The plate wells should be emptied to zero volume but retain the
      insoluble formazan crystals at the bottom for the downstream DMSO solubilization
      step.
    sequence:
      - target: well_plate_96
        gesture: click
        validator:
          preset: correct_target
        response:
          scene_operations: []
      - target: biohazard_decant_bin
        gesture: click
        validator:
          preset: correct_target
        response:
          scene_operations:
            - { type: ObjectStateChange, target: well_plate_96, state: { assay_status: crystals_retained } }
            - { type: ObjectStateChange, target: well_plate_96.block_A_1_6, state: { material_name: formazan_control, material_volume: 0 } }
            - { type: ObjectStateChange, target: well_plate_96.block_A_7_12, state: { material_name: formazan_metformin_control, material_volume: 0 } }
            - { type: ObjectStateChange, target: well_plate_96.row_B_1_6, state: { material_name: formazan_carboplatin_0_1umol, material_volume: 0 } }
            - { type: ObjectStateChange, target: well_plate_96.row_B_7_12, state: { material_name: formazan_carboplatin_0_1umol_metformin_5mmol, material_volume: 0 } }
            - { type: ObjectStateChange, target: well_plate_96.row_C_1_6, state: { material_name: formazan_carboplatin_0_2umol, material_volume: 0 } }
            - { type: ObjectStateChange, target: well_plate_96.row_C_7_12, state: { material_name: formazan_carboplatin_0_2umol_metformin_5mmol, material_volume: 0 } }
            - { type: ObjectStateChange, target: well_plate_96.row_D_1_6, state: { material_name: formazan_carboplatin_0_5umol, material_volume: 0 } }
            - { type: ObjectStateChange, target: well_plate_96.row_D_7_12, state: { material_name: formazan_carboplatin_0_5umol_metformin_5mmol, material_volume: 0 } }
            - { type: ObjectStateChange, target: well_plate_96.row_E_1_6, state: { material_name: formazan_carboplatin_1umol, material_volume: 0 } }
            - { type: ObjectStateChange, target: well_plate_96.row_E_7_12, state: { material_name: formazan_carboplatin_1umol_metformin_5mmol, material_volume: 0 } }
            - { type: ObjectStateChange, target: well_plate_96.row_F_1_6, state: { material_name: formazan_carboplatin_2umol, material_volume: 0 } }
            - { type: ObjectStateChange, target: well_plate_96.row_F_7_12, state: { material_name: formazan_carboplatin_2umol_metformin_5mmol, material_volume: 0 } }
            - { type: ObjectStateChange, target: well_plate_96.row_G_1_6, state: { material_name: formazan_carboplatin_5umol, material_volume: 0 } }
            - { type: ObjectStateChange, target: well_plate_96.row_G_7_12, state: { material_name: formazan_carboplatin_5umol_metformin_5mmol, material_volume: 0 } }
            - { type: ObjectStateChange, target: well_plate_96.row_H_1_6, state: { material_name: formazan_carboplatin_10umol, material_volume: 0 } }
            - { type: ObjectStateChange, target: well_plate_96.row_H_7_12, state: { material_name: formazan_carboplatin_10umol_metformin_5mmol, material_volume: 0 } }
            - type: ObjectStateChange
              target: biohazard_decant_bin
              state:
                material_name: waste_mtt
                material_volume: 21.6
          feedback:
            correct: "Liquid has been decanted while the condition-dependent insoluble formazan crystals remain visible in the empty wells."
            incorrect: "Decant only into the biohazard container so the insoluble formazan remains in the plate."
    step_validator:
      preset: sequence_complete
    outcome:
      on_success: complete
      on_failure: retry
    next_step: pat_plate_dry
  - step_name: pat_plate_dry
    prompt:
      Place the plate on a stack of paper towels. Using a gentle pressing motion,
      pat the bottom and top surfaces of the plate to absorb residual liquid without
      dislodging the formazan crystals. The plate should be completely dry and ready
      for DMSO solubilization. Ensure no liquid remains on the exterior of the plate
      that could obscure the absorbance measurement.
    sequence:
      - target: well_plate_96
        gesture: click
        validator:
          preset: correct_target
        response:
          scene_operations: []
      - target: paper_towel_pad
        gesture: click
        validator:
          preset: correct_target
        response:
          scene_operations:
            - type: ObjectStateChange
              target: well_plate_96
              state: { assay_status: dry }
          feedback:
            correct: "The plate is dry and the condition-dependent formazan crystals remain intact for DMSO solubilization."
            incorrect: "Use gentle blotting; vigorous motion can dislodge the crystals needed for readout."
    step_validator:
      preset: sequence_complete
    outcome:
      on_success: complete
      on_failure: retry
    next_step: null
