learning:
  objectives: 'Students completing this mini-protocol will have achieved fluency selecting the correct carboplatin stock for each dose-response row and using a repeating dispenser to deliver consistent 5 &micro;L aliquots without carry-over.

    '
  outcomes: 'Students completing this mini-protocol will be able to relate stock concentration, a 5 &micro;L dose, and the visible plate map to the four 200 &micro;L final-volume treatment conditions.

    '
  goals: 'Overall, this mini-protocol aims to accomplish a physically plausible drug treatment setup: each row is one fresh-tip, 60 &micro;L repeating-dispenser series, and the two 120 &micro;L metformin loads visibly complete the right-half treatment map before a 48-hour incubation.

    '
steps:
- step_name: dose_carboplatin_series
  prompt: Complete the carboplatin dose-response series from rows B through H. For each row, fit a fresh dispenser tip, load its labeled stock, and deliver a 12 x 5 &micro;L row series. Watch each row fill as you progress; the left half finishes at 200 &micro;L and the right half remains at 195 &micro;L for the metformin modifier.
  sequence:
  - target: repeat_dispenser
    gesture: click
    validator:
      preset: correct_target
    response:
      scene_operations:
      - type: SceneChange
        to_scene: plate_workspace
      - type: ObjectStateChange
        target: repeat_dispenser
        state:
          tip_status: fresh
      feedback:
        correct: 'Fresh tip selected: a row is one controlled 12 x 5 &micro;L series.'
        incorrect: Use the repeating dispenser for the row-B series.
  - target: repeat_dispenser
    gesture: adjust
    validator:
      preset: target_with_value
      value:
        set_dispense_volume: 5
    response:
      scene_operations:
      - type: ObjectStateChange
        target: repeat_dispenser
        state:
          set_dispense_volume: 5
  - target: dilution_tube_rack_8.tube_B
    gesture: click
    validator:
      preset: correct_target
    response:
      scene_operations:
      - type: ObjectStateChange
        target: dilution_tube_rack_8.tube_B
        state:
          material_volume: 940
      - type: ObjectStateChange
        target: repeat_dispenser
        state:
          held_material_name: carboplatin_4umol
          held_material_volume: 60
