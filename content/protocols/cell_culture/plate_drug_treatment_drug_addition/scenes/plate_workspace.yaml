scene_name: plate_workspace
extends: plate_focus_hood

scene_notes: |
  Hood workspace for controlled drug addition. The foreground plate is the
  dose-response map; the rear stocks identify the next row concentration and
  the repeating dispenser shows the 5 &micro;L aliquot method. The incubator remains
  a visible destination so treatment has a biological handoff, not merely a
  material-state change.

add_placements:
  - placement_name: rear_center_carb_stocks
    object_name: dilution_tube_rack_8
    zone: rear_center
    depth_tier: 1
    align_stop: left
  - placement_name: rear_center_carb_parent_stock
    object_name: microtube_15ml_intermediate
    zone: rear_center
    depth_tier: 2
    align_stop: center
  - placement_name: rear_center_metformin_stock
    object_name: metformin_working_tube
    zone: rear_center
    depth_tier: 2
    align_stop: right
  - placement_name: right_repeat_dispenser
    object_name: repeat_dispenser
    zone: right_tool_area
    depth_tier: 1
    align_stop: center
  - placement_name: rear_right_incubator
    object_name: incubator
    zone: rear_right
    depth_tier: 1
    align_stop: center
