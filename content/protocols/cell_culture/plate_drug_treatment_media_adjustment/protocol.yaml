protocol_type: mini_protocol
protocol_name: plate_drug_treatment_media_adjustment
entry_step: fill_columns_1_6
initial_state:
  # Direct play starts after Day-1 seeding and working-stock preparation.  In
  # cell_culture_full the runner owns this same handoff and ignores these seeds.
  - target: media_bottle
    state: { material_name: media, material_volume: 469.58 }
  - target: well_plate_96.all_wells
    state: { material_name: cells, material_volume: 100 }
learning:
  objectives: >
    Students completing this mini-protocol will have achieved fluency using an
    eight-channel pipette for column-wise plate fills and a single-channel
    micropipette for the row-A control adjustment.
  outcomes: >
    Students completing this mini-protocol will be able to establish the exact
    pre-drug volumes needed for a 200 uL final volume in every well of a
    two-drug dose-response plate.
  goals: >
    Overall, this mini-protocol aims to accomplish a physically executable
    pre-drug media adjustment: it fills columns 1-6 to 195 uL and columns 7-12
    to 190 uL with an eight-channel pipette, then adds 5 uL to every row-A
    control well. Every multichannel stroke addresses one complete eight-well
    column and every partial row-A correction is a real single-channel transfer,
    not a hidden batch write.
steps:
  - step_name: fill_columns_1_6
    prompt: >
      Use the eight-channel pipette to add 95 uL of media to each complete
      column from 1 through 6. Each stroke fills A-H in one column, bringing
      every well in those columns from 100 to 195 uL. Row A will receive its
      extra 5 uL control adjustment after the second column block.
    sequence:
      - target: multichannel_pipette
        gesture: click
        validator: { preset: correct_target }
        response: { scene_operations: [{ type: SceneChange, to_scene: plate_drug_treatment_media_adjustment_plate_workspace }] }
      - target: multichannel_pipette
        gesture: adjust
        validator: { preset: target_with_value, value: { set_volume: 95 } }
        response: { scene_operations: [{ type: ObjectStateChange, target: multichannel_pipette, state: { set_volume: 95 } }] }
      - target: media_bottle
        gesture: click
        validator: { preset: correct_target }
        response: { scene_operations: [{ type: ObjectStateChange, target: media_bottle, state: { material_volume: 468.82 } }, { type: ObjectStateChange, target: multichannel_pipette, state: { held_material_name: media, held_material_volume: 95 } }] }
      - target: well_plate_96.col_1
        gesture: click
        validator: { preset: correct_target }
        response: { scene_operations: [{ type: ObjectStateChange, target: well_plate_96.col_1, state: { material_name: mixed, material_volume: 195 } }, { type: ObjectStateChange, target: multichannel_pipette, state: { held_material_name: empty, held_material_volume: 0 } }] }
      - target: media_bottle
        gesture: click
        validator: { preset: correct_target }
        response: { scene_operations: [{ type: ObjectStateChange, target: media_bottle, state: { material_volume: 468.06 } }, { type: ObjectStateChange, target: multichannel_pipette, state: { held_material_name: media, held_material_volume: 95 } }] }
      - target: well_plate_96.col_2
