protocol_type: mini_protocol
protocol_name: plate_drug_treatment_media_adjustment
entry_step: balance_plate_for_treatments
initial_state:
- target: media_bottle
  state:
    material_name: media
    material_volume: 458.72
- target: well_plate_96.all_wells
  state:
    material_name: cells_in_growth_media
    material_volume: 100
learning:
  objectives: 'Students completing this mini-protocol will have achieved fluency using a reagent reservoir with an eight-channel pipette and using a repeating dispenser for a consistent row-wise control addition.

    '
  outcomes: 'Students completing this mini-protocol will be able to establish and check the distinct 95 and 90 &micro;L pre-drug volume classes that make every treated well reach its planned 200 &micro;L final volume.

    '
  goals: 'Overall, this mini-protocol aims to accomplish a physically plausible, visibly checkable pre-drug media adjustment. Complete columns receive one eight-channel stroke at a time from a reservoir; the row-A control series is a deliberate 5 &micro;L repeating-dispenser operation rather than twelve unrelated mouse clicks.

    '
steps:
- step_name: balance_plate_for_treatments
  prompt: 'Balance the complete plate for its planned treatments: transfer media to the reservoir, fill columns 1-6 at 95 &micro;L per channel and columns 7-12 at 90 &micro;L per channel, then use the repeating dispenser for row-A media controls. Inspect the final 195, 190, and row-A control volumes on the visible plate map.'
  sequence:
  - target: multichannel_pipette
    gesture: click
    validator:
      preset: correct_target
    response:
      scene_operations:
      - type: SceneChange
        to_scene: plate_drug_treatment_media_adjustment_plate_workspace
      feedback:
        correct: Use the sterile reservoir so all eight tips draw the same media at each column stroke.
        incorrect: Choose the eight-channel pipette for complete-column filling.
  - target: micropipette_tip_box
    gesture: click
    validator:
      preset: correct_target
    response:
      scene_operations:
      - type: ObjectStateChange
        target: multichannel_pipette
        state:
          tip_status: fresh
      feedback:
        correct: Fit one fresh matched set of eight tips before drawing media.
        incorrect: Click the visible tip box to fit fresh multichannel tips.
  - target: media_bottle
    gesture: click
    validator:
      preset: correct_target
    response:
      scene_operations:
      - type: ObjectStateChange
        target: media_bottle
        state:
          material_volume: 449.78
      - type: ObjectStateChange
        target: reagent_reservoir
        state:
          material_name: media
          material_volume: 8.94
      feedback:
        correct: The reservoir now contains the full 8.94 mL required for the plate adjustment.
        incorrect: Transfer the measured media from the bottle to the sterile reservoir.
  - target: multichannel_pipette
    gesture: adjust
    validator:
      preset: target_with_value
      value:
        set_volume: 95
    response:
      scene_operations:
      - type: ObjectStateChange
        target: multichannel_pipette
        state:
          set_volume: 95
      feedback:
        correct: 95 &micro;L per channel gives columns 1-6 their 195 &micro;L pre-drug volume.
        incorrect: Set the eight-channel pipette to 95 &micro;L for columns 1-6.
  - target: reagent_reservoir
    gesture: click
    validator:
      preset: correct_target
    response:
      scene_operations:
      - type: ObjectStateChange
        target: reagent_reservoir
        state:
          material_volume: 8.18
      - type: ObjectStateChange
        target: multichannel_pipette
        state:
          held_material_name: media
