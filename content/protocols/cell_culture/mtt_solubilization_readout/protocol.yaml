protocol_type: mini_protocol
protocol_name: mtt_solubilization_readout
entry_step: add_dmso_to_wells
initial_state:
  # The direct mini starts from the same dry, condition-dependent endpoint
  # produced by mtt_plate_reaction. A sequence runner preserves that live state
  # instead of reapplying this direct-entry seed.
  - { target: well_plate_96, state: { assay_status: dry } }
  - { target: well_plate_96.block_A_1_6, state: { material_name: formazan_control, material_volume: 0 } }
  - { target: well_plate_96.block_A_7_12, state: { material_name: formazan_metformin_control, material_volume: 0 } }
  - { target: well_plate_96.row_B_1_6, state: { material_name: formazan_carboplatin_0_1umol, material_volume: 0 } }
  - { target: well_plate_96.row_B_7_12, state: { material_name: formazan_carboplatin_0_1umol_metformin_5mmol, material_volume: 0 } }
  - { target: well_plate_96.row_C_1_6, state: { material_name: formazan_carboplatin_0_2umol, material_volume: 0 } }
  - { target: well_plate_96.row_C_7_12, state: { material_name: formazan_carboplatin_0_2umol_metformin_5mmol, material_volume: 0 } }
  - { target: well_plate_96.row_D_1_6, state: { material_name: formazan_carboplatin_0_5umol, material_volume: 0 } }
  - { target: well_plate_96.row_D_7_12, state: { material_name: formazan_carboplatin_0_5umol_metformin_5mmol, material_volume: 0 } }
  - { target: well_plate_96.row_E_1_6, state: { material_name: formazan_carboplatin_1umol, material_volume: 0 } }
  - { target: well_plate_96.row_E_7_12, state: { material_name: formazan_carboplatin_1umol_metformin_5mmol, material_volume: 0 } }
  - { target: well_plate_96.row_F_1_6, state: { material_name: formazan_carboplatin_2umol, material_volume: 0 } }
  - { target: well_plate_96.row_F_7_12, state: { material_name: formazan_carboplatin_2umol_metformin_5mmol, material_volume: 0 } }
  - { target: well_plate_96.row_G_1_6, state: { material_name: formazan_carboplatin_5umol, material_volume: 0 } }
  - { target: well_plate_96.row_G_7_12, state: { material_name: formazan_carboplatin_5umol_metformin_5mmol, material_volume: 0 } }
  - { target: well_plate_96.row_H_1_6, state: { material_name: formazan_carboplatin_10umol, material_volume: 0 } }
  - { target: well_plate_96.row_H_7_12, state: { material_name: formazan_carboplatin_10umol_metformin_5mmol, material_volume: 0 } }
  - target: dmso_tube
    state:
      material_name: dmso
      material_volume: 50.0
learning:
  objectives:
    Students completing this mini-protocol will have achieved fluency with
    dissolving precipitated colorimetric assay products using organic solvent, trituration
    technique for complete dissolution, and wavelength selection and optical absorbance
    measurement on a multi-well plate reader.
  outcomes:
    Students completing this mini-protocol will be able to use a multichannel
    pipette to add DMSO uniformly across all columns and wells of a 96-well plate
    containing formazan, perform manual trituration to dissolve precipitated formazan,
    and measure absorbance at 560 nm on a plate reader, recording the optical density
    for downstream IC50 calculations.
  goals:
    "Overall, this mini-protocol aims to accomplish the final quantification
    step in an MTT viability assay: converting the precipitated, insoluble formazan
    product into a colored solution amenable to spectrophotometric measurement. This
    step bridges the incubated, MTT-treated plate to absorbance readout values that
    indicate cell viability across the dose-response series."
steps:
  - step_name: add_dmso_to_wells
    prompt:
      "Transfer DMSO to the reagent reservoir, then use the multichannel pipette at
      200 microL per channel to distribute it across the plate. DMSO dissolves the
      precipitated formazan so absorbance can be measured."
    sequence:
      - target: multichannel_pipette
        gesture: click
        validator:
          preset: correct_target
        response:
          scene_operations:
            - type: SceneChange
              to_scene: mtt_solubilization_readout_bench_workspace
      - target: multichannel_pipette
        gesture: adjust
        validator:
          preset: target_with_value
          value:
            set_volume: 200
        response:
          scene_operations:
            - type: ObjectStateChange
              target: multichannel_pipette
              state:
                set_volume: 200
      - target: micropipette_tip_box
        gesture: click
        validator:
          preset: correct_target
        response:
          scene_operations:
            - type: ObjectStateChange
              target: multichannel_pipette
              state:
                tip_status: fresh
          feedback:
            correct: "A fresh matched set of eight tips is fitted before the DMSO transfer."
            incorrect: "Use the visible tip box to fit fresh multichannel tips before handling DMSO."
      - target: dmso_tube
        gesture: click
        validator:
          preset: correct_target
        response:
          scene_operations:
            - type: ObjectStateChange
              target: dmso_tube
              state:
                material_name: dmso
                material_volume: 30.8
            - type: ObjectStateChange
              target: reagent_reservoir
              state:
                material_name: dmso
                material_volume: 19.2
      - target: reagent_reservoir
        gesture: click
        validator:
          preset: correct_target
        response:
          scene_operations:
            - type: ObjectStateChange
              target: reagent_reservoir
              state:
                material_volume: 17.6
            - type: ObjectStateChange
              target: multichannel_pipette
              state:
