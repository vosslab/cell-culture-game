            - { type: ObjectStateChange, target: well_plate_96.row_D_7_12, state: { material_name: formazan_dmso_carboplatin_0_5umol_metformin_5mmol } }
            - { type: ObjectStateChange, target: well_plate_96.row_E_1_6, state: { material_name: formazan_dmso_carboplatin_1umol } }
            - { type: ObjectStateChange, target: well_plate_96.row_E_7_12, state: { material_name: formazan_dmso_carboplatin_1umol_metformin_5mmol } }
            - { type: ObjectStateChange, target: well_plate_96.row_F_1_6, state: { material_name: formazan_dmso_carboplatin_2umol } }
            - { type: ObjectStateChange, target: well_plate_96.row_F_7_12, state: { material_name: formazan_dmso_carboplatin_2umol_metformin_5mmol } }
            - { type: ObjectStateChange, target: well_plate_96.row_G_1_6, state: { material_name: formazan_dmso_carboplatin_5umol } }
            - { type: ObjectStateChange, target: well_plate_96.row_G_7_12, state: { material_name: formazan_dmso_carboplatin_5umol_metformin_5mmol } }
            - { type: ObjectStateChange, target: well_plate_96.row_H_1_6, state: { material_name: formazan_dmso_carboplatin_10umol } }
            - { type: ObjectStateChange, target: well_plate_96.row_H_7_12, state: { material_name: formazan_dmso_carboplatin_10umol_metformin_5mmol } }
    step_validator:
      preset: sequence_complete
    outcome:
      on_success: complete
      on_failure: retry
    next_step: trituration_to_dissolve
  - step_name: trituration_to_dissolve
    prompt:
      Perform trituration to fully dissolve the formazan precipitate. Using the
      multichannel pipette, pipette up and down approximately 10 times per well across
      the whole plate. Mechanical mixing ensures complete dissolution of the purple
      formazan product.
    sequence:
      - target: multichannel_pipette
        gesture: click
        validator:
          preset: correct_target
        response:
          scene_operations: []
      - target: well_plate_96.all_wells
        gesture: click
        validator:
          preset: correct_target
        response:
          scene_operations:
            - type: ObjectStateChange
              target: well_plate_96.all_wells
              state:
                material_volume: 200
              transition: animated
            - type: ObjectStateChange
              target: well_plate_96
              state: { assay_status: dissolved }
          feedback:
            correct: "The condition-dependent formazan is fully dissolved, with no visible crystals or bubbles before the optical reading."
            incorrect: "Triturate gently until the colored solution is uniform and free of visible crystals or bubbles."
    step_validator:
      preset: sequence_complete
    outcome:
      on_success: complete
      on_failure: retry
    next_step: read_absorbance
  - step_name: read_absorbance
    prompt: >
      Move to the plate reader workspace and measure absorbance. Access the plate
      reader, set the wavelength to 560 nm, insert the treated plate, and take the measurement.
      The reader will display a representative simulated dataset: inspect its blank,
      untreated-control reference, and treatment series before drawing a conclusion.
    sequence:
      - target: plate_reader
        gesture: click
        validator:
          preset: correct_target
        response:
          scene_operations:
            - type: SceneChange
              to_scene: mtt_solubilization_readout_plate_reader_workspace
      - target: plate_reader
        gesture: adjust
        validator:
          preset: target_with_value
          value:
            wavelength_nm: 560
        response:
          scene_operations:
            - type: ObjectStateChange
              target: plate_reader
              state:
                wavelength_nm: 560
      - target: well_plate_96
        gesture: click
        validator:
          preset: correct_target
        response:
          scene_operations:
            - type: ObjectStateChange
              target: plate_reader
              state:
                reading: true
      - target: plate_reader
        gesture: click
        validator:
          preset: correct_target
        response:
          scene_operations:
            - type: ObjectStateChange
              target: plate_reader
              state:
                reading: false
                result_state: results_ready
                mean_absorbance: 0.20
                normalized_viability_percent: 22
            - type: SceneChange
              to_scene: mtt_solubilization_readout_result_review
          feedback:
            correct: "Representative simulated 560 nm results are displayed. Use the blank-corrected untreated control to interpret the carboplatin dose series and the high-dose combination."
            incorrect: "Load the plate and take the reading to reveal the representative simulated result panel."
    step_validator:
      preset: sequence_complete
    outcome:
      on_success: complete
      on_failure: retry
    next_step: interpret_dose_response
  - step_name: interpret_dose_response
    prompt: >
      Review the reader's blank-corrected dose-response display and choose the conclusion
      supported by the untreated-control and treatment series. These are representative
      simulated results for interpretation practice, not measurements from a live experiment.
    sequence:
      - target: mtt_conclusion_dose_response
        gesture: select
        validator:
          preset: correct_choice
        response:
          scene_operations:
            - type: ObjectStateChange
              target: plate_reader
              state:
                result_state: normalized
          feedback:
            correct: "Conclusion recorded. The reduced absorbance at higher dose is consistent with lower viable-cell metabolic activity."
            incorrect: "Compare the untreated-control reference with the treatment series in the visible normalized-viability display."
    step_validator:
      preset: final_state_matches
      target: plate_reader
      contains:
        result_state: normalized
    outcome:
      on_success: complete
      on_failure: retry
    next_step: null
