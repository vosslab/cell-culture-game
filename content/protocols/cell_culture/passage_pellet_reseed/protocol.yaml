protocol_type: mini_protocol
protocol_name: passage_pellet_reseed
entry_step: transfer_to_conical
initial_state:
  # A direct run begins after neutralization with the same 12 mL suspension
  # produced by passage_hood_detachment in the full runner. Constituent seeds
  # are deliberately ignored by that runner, so its carried state remains
  # authoritative.
  - target: t75_flask
    state:
      material_name: cell_suspension
      material_volume: 12
  - target: media_bottle
    state:
      material_name: media
      material_volume: 491
  - target: sterile_water_bottle
    state:
      material_name: water
      material_volume: 500
learning:
  objectives:
    "Students completing this mini-protocol will have achieved fluency with

    centrifugation as a cell-recovery technique, the mechanics of

    cell-suspension transfer and resuspension, and the mathematical

    calculation of a 1:7 split for cell passage.

    "
  outcomes: "Students completing this mini-protocol will be able to transfer a

    trypsin-neutralized cell suspension to a conical tube, centrifuge

    to pellet cells, aspirate supernatant, resuspend the pellet,

    calculate and measure a 1:7 split, seed a fresh T75 culture, and

    return the labeled culture to the incubator.

    "
  goals: "Overall, this mini-protocol aims to accomplish the second half of

    the maintenance-passage workflow: from neutralized cell suspension

    (MP-1 endpoint) through centrifugal pellet recovery, split calculation,

    fresh-media seeding, and return to incubation (routine_passage runner

    endpoint).

    "
steps:
  - step_name: transfer_to_conical
    prompt: Transfer the complete 12 mL neutralized cell suspension to a labeled 15 mL conical tube.
    sequence:
      - target: t75_flask
        gesture: click
        instruction: "Draw 12 mL of cell suspension from the t75 flask."
        hint: "Use the t75 flask as the source, then carry this measured load to conical 15ml."
        validator:
          preset: correct_target
        response:
          scene_operations:
            - type: SceneChange
              to_scene: hood_workspace
            - type: CursorAttach
              target: serological_pipette
              operation: attach
            - type: ObjectStateChange
              target: t75_flask
              state:
                material_name: empty
                material_volume: 0
            - type: ObjectStateChange
              target: serological_pipette
              state:
                held_material_name: cell_suspension
                held_material_volume: 12
      - target: conical_15ml
        gesture: click
        instruction: "Deliver the neutralized suspension into the labeled 15 mL conical tube."
        hint: "Empty the complete 12 mL load into the receiving tube, then attach it for centrifugation."
        validator:
          preset: correct_target
        response:
          scene_operations:
            - type: ObjectStateChange
              target: conical_15ml
              state:
                material_name: cell_suspension
                material_volume: 12
            - type: ObjectStateChange
              target: serological_pipette
              state:
                held_material_name: empty
                held_material_volume: 0
                freshness: used
            - type: CursorAttach
              target: conical_15ml
              operation: attach
    step_validator:
      preset: sequence_complete
    outcome:
      on_success: complete
      on_failure: retry
    next_step: label_conical_tube
  - step_name: label_conical_tube
    prompt: Label the conical tube with cell line, date, passage number, and initials.
    sequence:
      - target: label_pen
        gesture: click
        instruction: "Pick up the label pen for the sample identity step."
        hint: "Write the required identity details before continuing with conical 15ml."
        validator:
          preset: correct_target
        response:
          scene_operations:
            - type: SceneChange
              to_scene: hood_workspace
            - type: CursorAttach
              target: label_pen
              operation: attach
      - target: conical_15ml
        gesture: click
        instruction: "Write the sample identity on the conical tube."
        hint: "Record the cell line, date, passage number, and initials before spinning."
        validator:
          preset: correct_target
        response:
          scene_operations:
            - type: ObjectStateChange
              target: conical_15ml
              state:
                label_status: sample_identity_complete
    step_validator:
      preset: sequence_complete
    outcome:
      on_success: complete
      on_failure: retry
    next_step: centrifuge_spin
  - step_name: centrifuge_spin
    prompt: Balance the conical tube opposite a matched balance tube, then centrifuge for 5 minutes at 200 x g.
    sequence:
      - target: conical_15ml
        gesture: click
        instruction: "Load the labeled conical tube into the centrifuge."
        hint: "Place it opposite the matched balance tube before setting the spin."
        validator:
          preset: correct_target
        response:
          scene_operations:
            - type: SceneChange
              to_scene: centrifuge_workspace
      - target: centrifuge
        gesture: click
        instruction: "Attach to the centrifuge controls."
        hint: "The balanced tube is ready; select the centrifuge so its controls can be set."
        validator:
          preset: correct_target
        response:
          scene_operations:
            - type: CursorAttach
              target: centrifuge
              operation: attach
      - target: centrifuge
        gesture: adjust
        instruction: "Set the centrifuge to 200 x g."
        hint: "Enter the required relative centrifugal force before setting the run time."
        validator:
          preset: target_with_value
          value:
            set_rcf: 200
        response:
          scene_operations:
            - type: ObjectStateChange
              target: centrifuge
              state:
                set_rcf: 200
      - target: sterile_water_bottle
        gesture: click
        instruction: "Select sterile water for the balance tube."
        hint: "Draw the matching balance volume before loading the centrifuge."
        validator:
          preset: correct_target
        response:
          scene_operations: []
      - target: centrifuge_balance_tube
        gesture: click
        instruction: "Load the matched balance tube into the centrifuge."
        hint: "Balance the cell-suspension tube opposite this water-filled tube before spinning."
        validator:
          preset: correct_target
        response:
          scene_operations:
            - type: ObjectStateChange
              target: sterile_water_bottle
              state:
                material_volume: 488
            - type: ObjectStateChange
              target: centrifuge_balance_tube
              state:
                material_name: water
                material_volume: 12
                balance_status: matched
      - target: centrifuge
        gesture: adjust
        instruction: "Set the centrifuge run time to 5 minutes."
        hint: "Keep the matched balance in place while you set the duration."
        validator:
          preset: target_with_value
          value:
            set_time_min: 5
        response:
          scene_operations:
            - type: ObjectStateChange
              target: centrifuge
              state:
                set_time_min: 5
      - target: centrifuge
        gesture: click
        instruction: "Start the 5-minute centrifuge run."
        hint: "The speed and time are set; begin the run and wait for the pellet."
        validator:
          preset: correct_target
        response:
          scene_operations:
            - type: ObjectStateChange
              target: centrifuge
              state:
                running: true
            - type: TimedWait
              target: centrifuge
              duration_min: 5
              display: spinner
            - type: ObjectStateChange
              target: centrifuge
              state:
                running: false
            - type: ObjectStateChange
              target: conical_15ml
              state:
                material_name: cell_supernatant
                material_volume: 12
    step_validator:
      preset: sequence_complete
    outcome:
      on_success: complete
      on_failure: retry
    next_step: aspirate_supernatant
  - step_name: aspirate_supernatant
    prompt:
      Carefully aspirate and discard the supernatant in two passes, leaving the cell pellet undisturbed.
    sequence:
      - target: aspirating_pipette
        gesture: click
        instruction: "Attach the aspirating pipette for the removal step."
        hint: "Keep its tip above the cell layer or pellet while aspirating."
        validator:
          preset: correct_target
        response:
          scene_operations:
            - type: CursorAttach
              target: aspirating_pipette
              operation: attach
      - target: conical_15ml
        gesture: click
        instruction: "Aspirate the first supernatant portion (9.9 mL) above the pellet."
        hint: "Keep the pipette tip above the pellet while removing this larger first portion."
        validator:
          preset: correct_target
        response:
          scene_operations:
            - type: ObjectStateChange
              target: conical_15ml
              state:
                material_name: cell_supernatant
                material_volume: 2.1
            - type: ObjectStateChange
              target: aspirating_pipette
              state:
                held_material_name: cell_supernatant
                held_material_volume: 9.9
      - target: biohazard_decant
        gesture: click
        instruction: "Discard the aspirated supernatant in the biohazard container (9.9 mL total)."
        hint: "Empty the first aspirate into biohazard waste, then continue the second careful pass."
        validator:
          preset: correct_target
        response:
          scene_operations:
            - type: ObjectStateChange
              target: biohazard_decant
              state:
                material_name: cell_supernatant
                material_volume: 9.9
            - type: ObjectStateChange
              target: aspirating_pipette
              state:
                held_material_name: empty
                held_material_volume: 0
      - target: conical_15ml
        gesture: click
        instruction: "Aspirate the remaining supernatant portion (2 mL)."
        hint: "Leave the cell pellet undisturbed while removing the final liquid portion."
        validator:
          preset: correct_target
        response:
          scene_operations:
            - type: ObjectStateChange
              target: conical_15ml
              state:
                material_name: cell_pellet
                material_volume: 0.1
            - type: ObjectStateChange
              target: aspirating_pipette
              state:
                held_material_name: cell_supernatant
                held_material_volume: 2
      - target: biohazard_decant
        gesture: click
        instruction: "Discard the remaining supernatant in the biohazard container (11.9 mL total)."
        hint: "Keep the cell pellet undisturbed; empty this final aspirate into biohazard waste."
        validator:
          preset: correct_target
        response:
          scene_operations:
            - type: ObjectStateChange
              target: biohazard_decant
              state:
                material_name: cell_supernatant
                material_volume: 11.9
            - type: ObjectStateChange
              target: aspirating_pipette
              state:
                held_material_name: empty
                held_material_volume: 0
    step_validator:
      preset: sequence_complete
    outcome:
      on_success: complete
      on_failure: retry
    next_step: resuspend_pellet
  - step_name: resuspend_pellet
    prompt: Add 7.9 mL fresh media, then gently pipette the pellet up and down until no pellet remains. This creates 8.0 mL of uniform cell suspension.
    sequence:
      - target: serological_pipette_pack
        gesture: click
        instruction: "Fit a fresh sterile pipette from the pack."
        hint: "Use the sterile graduated pipette for the measured transfer that follows."
        validator: { preset: correct_target }
        response:
          scene_operations:
            - type: ObjectStateChange
              target: serological_pipette
              state: { freshness: sterile }
      - target: serological_pipette
        gesture: click
        instruction: "Attach the serological pipette for the next transfer."
        hint: "Use the attached tool to perform the following source draw or dispense."
        validator:
          preset: correct_target
        response:
          scene_operations:
            - type: CursorAttach
              target: serological_pipette
              operation: attach
      - target: media_bottle
        gesture: click
        instruction: "Draw 7.9 mL of media from the bottle."
        hint: "Use the measured media load for the receiving tube, flask, or reservoir in the next action."
        validator:
          preset: correct_target
        response:
          scene_operations:
            - type: ObjectStateChange
              target: media_bottle
              state:
                material_volume: 483.1
            - type: ObjectStateChange
              target: serological_pipette
              state:
                held_material_name: media
                held_material_volume: 7.9
      - target: conical_15ml
        gesture: click
        instruction: "Resuspend the cell pellet in the fresh medium."
        hint: "Gently pipette up and down until no pellet remains."
        validator:
          preset: correct_target
        response:
          scene_operations:
            - type: ObjectStateChange
              target: conical_15ml
              state:
                material_name: cell_suspension
                material_volume: 8
            - type: ObjectStateChange
              target: serological_pipette
              state:
                held_material_name: empty
                held_material_volume: 0
    step_validator:
      preset: sequence_complete
    outcome:
      on_success: complete
      on_failure: retry
    next_step: calculate_split_volume
  - step_name: calculate_split_volume
    prompt:
      "For a 1:7 passage, transfer one seventh of the 8.0 mL suspension (1.14 mL) into a fresh T75 flask. The remaining suspension is not returned to the original flask."
    sequence:
      - target: serological_pipette_pack
        gesture: click
        instruction: "Fit a fresh sterile pipette from the pack."
        hint: "Use the sterile graduated pipette for the measured transfer that follows."
        validator: { preset: correct_target }
        response:
          scene_operations:
            - type: ObjectStateChange
              target: serological_pipette
              state: { freshness: sterile }
      - target: serological_pipette
        gesture: click
        instruction: "Attach the serological pipette for the next transfer."
        hint: "Use the attached tool to perform the following source draw or dispense."
        validator:
          preset: correct_target
        response:
          scene_operations:
            - type: CursorAttach
              target: serological_pipette
              operation: attach
      - target: conical_15ml
        gesture: click
        instruction: "Draw 1.14 mL of cell suspension for the 1:7 split."
        hint: "Use the calculated one-seventh volume for the fresh T75 flask."
        validator:
          preset: correct_target
        response:
          scene_operations:
            - type: ObjectStateChange
              target: conical_15ml
              state:
                material_volume: 6.86
            - type: ObjectStateChange
              target: serological_pipette
              state:
                held_material_name: cell_suspension
                held_material_volume: 1.14
      - target: t75_flask_new
        gesture: click
        instruction: "Dispense the calculated split into the fresh T75 flask."
        hint: "Deliver 1.14 mL of suspension to seed the new culture."
        validator:
          preset: correct_target
        response:
          scene_operations:
            - type: ObjectStateChange
              target: t75_flask_new
              state:
                material_name: cell_suspension
                material_volume: 1.14
            - type: ObjectStateChange
              target: serological_pipette
              state:
                held_material_name: empty
                held_material_volume: 0
    step_validator:
      preset: sequence_complete
    outcome:
      on_success: complete
      on_failure: retry
    next_step: label_plate
  - step_name: label_plate
    prompt: Label the fresh T75 flask with OVCAR8, date, passage number, and your initials.
    sequence:
      - target: label_pen
        gesture: click
        instruction: "Pick up the label pen for the sample identity step."
        hint: "Write the required identity details before continuing with t75 flask new."
        validator:
          preset: correct_target
        response:
          scene_operations:
            - type: SceneChange
              to_scene: hood_workspace
            - type: CursorAttach
              target: label_pen
              operation: attach
      - target: t75_flask_new
        gesture: click
        instruction: "Write the required identity label on the fresh T75 flask."
        hint: "Include OVCAR8, date, passage number, and initials before adding medium."
        validator:
          preset: correct_target
        response:
          scene_operations:
            - type: ObjectStateChange
              target: t75_flask_new
              state:
                label_status: identity_complete
    step_validator:
      preset: sequence_complete
    outcome:
      on_success: complete
      on_failure: retry
    next_step: return_to_incubator
  - step_name: return_to_incubator
    prompt:
      "Add 8.86 mL complete media to the new flask to reach 10 mL, then return the seeded T75 flask to 37 degrees C and 5% CO2."
    sequence:
      - target: serological_pipette_pack
        gesture: click
        instruction: "Fit a fresh sterile pipette from the pack."
        hint: "Use the sterile graduated pipette for the measured transfer that follows."
        validator: { preset: correct_target }
        response:
          scene_operations:
            - type: ObjectStateChange
              target: serological_pipette
              state: { freshness: sterile }
      - target: media_bottle
        gesture: click
        instruction: "Draw 8.86 mL of media from the bottle."
        hint: "Use the measured media load for the receiving tube, flask, or reservoir in the next action."
        validator:
          preset: correct_target
        response:
          scene_operations:
            - type: ObjectStateChange
              target: media_bottle
              state:
                material_volume: 474.24
            - type: ObjectStateChange
              target: serological_pipette
              state:
                held_material_name: media
                held_material_volume: 8.86
      - target: t75_flask_new
        gesture: click
        instruction: "Receive the complete medium in the fresh T75 flask."
        hint: "Add the measured medium to reach 10 mL before incubation."
        validator:
          preset: correct_target
        response:
          scene_operations:
            - type: ObjectStateChange
              target: t75_flask_new
              state:
                material_name: cell_suspension
                material_volume: 10
            - type: ObjectStateChange
              target: serological_pipette
              state:
                held_material_name: empty
                held_material_volume: 0
      - target: incubator
        gesture: click
        instruction: "Open the incubator for the next culture step."
        hint: "Place the prepared vessel inside and allow the authored incubation to run."
        validator:
          preset: correct_target
        response:
          scene_operations:
            - type: ObjectStateChange
              target: incubator
              state:
                door_open: false
            - type: ObjectStateChange
              target: t75_flask_new
              state:
                incubation_status: in_incubator
    step_validator:
      preset: sequence_complete
    outcome:
      on_success: complete
      on_failure: retry
    next_step: null
