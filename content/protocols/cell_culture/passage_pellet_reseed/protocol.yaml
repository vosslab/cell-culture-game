protocol_type: mini_protocol
protocol_name: passage_pellet_reseed
entry_step: transfer_to_conical
initial_state:
  # A direct run begins after neutralization with the same 12 mL suspension
  # produced by passage_hood_detachment in the full runner. Constituent seeds
  # are deliberately ignored by that runner, so its carried state remains
  # authoritative.
  - target: t75_flask
    state:
      material_name: cell_suspension
      material_volume: 12
  - target: media_bottle
    state:
      material_name: media
      material_volume: 491
  - target: sterile_water_bottle
    state:
      material_name: water
      material_volume: 500
learning:
  objectives:
    "Students completing this mini-protocol will have achieved fluency with

    centrifugation as a cell-recovery technique, the mechanics of

    cell-suspension transfer and resuspension, and the mathematical

    calculation of a 1:7 split for cell passage.

    "
  outcomes: "Students completing this mini-protocol will be able to transfer a

    trypsin-neutralized cell suspension to a conical tube, centrifuge

    to pellet cells, aspirate supernatant, resuspend the pellet,

    calculate and measure a 1:7 split, seed a fresh T75 culture, and

    return the labeled culture to the incubator.

    "
  goals: "Overall, this mini-protocol aims to accomplish the second half of

    the maintenance-passage workflow: from neutralized cell suspension

    (MP-1 endpoint) through centrifugal pellet recovery, split calculation,

    fresh-media seeding, and return to incubation (routine_passage runner

    endpoint).

    "
steps:
  - step_name: transfer_to_conical
    prompt: Transfer the complete 12 mL neutralized cell suspension to a labeled 15 mL conical tube.
    sequence:
      - target: t75_flask
        gesture: click
        validator:
          preset: correct_target
        response:
          scene_operations:
            - type: SceneChange
              to_scene: hood_workspace
            - type: CursorAttach
              target: serological_pipette
              operation: attach
            - type: ObjectStateChange
              target: t75_flask
              state:
                material_name: empty
                material_volume: 0
            - type: ObjectStateChange
              target: serological_pipette
              state:
                held_material_name: cell_suspension
                held_material_volume: 12
      - target: conical_15ml
        gesture: click
        validator:
          preset: correct_target
        response:
          scene_operations:
            - type: ObjectStateChange
              target: conical_15ml
              state:
                material_name: cell_suspension
                material_volume: 12
            - type: ObjectStateChange
              target: serological_pipette
              state:
                held_material_name: empty
                held_material_volume: 0
                freshness: used
            - type: CursorAttach
              target: conical_15ml
              operation: attach
    step_validator:
      preset: sequence_complete
    outcome:
      on_success: complete
      on_failure: retry
    next_step: label_conical_tube
  - step_name: label_conical_tube
    prompt: Label the conical tube with cell line, date, passage number, and initials.
    sequence:
      - target: label_pen
        gesture: click
        validator:
          preset: correct_target
        response:
          scene_operations:
            - type: SceneChange
              to_scene: hood_workspace
            - type: CursorAttach
              target: label_pen
              operation: attach
      - target: conical_15ml
        gesture: click
        validator:
          preset: correct_target
        response:
          scene_operations:
            - type: ObjectStateChange
              target: conical_15ml
              state:
                label_status: sample_identity_complete
    step_validator:
      preset: sequence_complete
    outcome:
      on_success: complete
      on_failure: retry
    next_step: centrifuge_spin
  - step_name: centrifuge_spin
    prompt: Balance the conical tube opposite a matched balance tube, then centrifuge for 5 minutes at 200 x g.
    sequence:
      - target: conical_15ml
        gesture: click
        validator:
          preset: correct_target
        response:
          scene_operations:
            - type: SceneChange
              to_scene: centrifuge_workspace
      - target: centrifuge
        gesture: click
        validator:
          preset: correct_target
        response:
          scene_operations:
            - type: CursorAttach
              target: centrifuge
              operation: attach
      - target: centrifuge
        gesture: adjust
        validator:
          preset: target_with_value
          value:
            set_rcf: 200
        response:
          scene_operations:
            - type: ObjectStateChange
              target: centrifuge
              state:
                set_rcf: 200
      - target: sterile_water_bottle
        gesture: click
        validator:
          preset: correct_target
        response:
          scene_operations: []
      - target: centrifuge_balance_tube
        gesture: click
        validator:
          preset: correct_target
        response:
          scene_operations:
            - type: ObjectStateChange
              target: sterile_water_bottle
              state:
                material_volume: 488
            - type: ObjectStateChange
              target: centrifuge_balance_tube
              state:
                material_name: water
                material_volume: 12
                balance_status: matched
      - target: centrifuge
        gesture: adjust
        validator:
          preset: target_with_value
          value:
            set_time_min: 5
        response:
          scene_operations:
            - type: ObjectStateChange
              target: centrifuge
              state:
                set_time_min: 5
      - target: centrifuge
        gesture: click
        validator:
          preset: correct_target
        response:
          scene_operations:
            - type: ObjectStateChange
              target: centrifuge
              state:
                running: true
            - type: TimedWait
              target: centrifuge
              duration_min: 5
              display: spinner
            - type: ObjectStateChange
              target: centrifuge
              state:
                running: false
            - type: ObjectStateChange
              target: conical_15ml
              state:
                material_name: cell_supernatant
                material_volume: 12
    step_validator:
      preset: sequence_complete
    outcome:
      on_success: complete
      on_failure: retry
    next_step: aspirate_supernatant
  - step_name: aspirate_supernatant
    prompt:
      Carefully aspirate and discard the supernatant in two passes, leaving the cell pellet undisturbed.
    sequence:
      - target: aspirating_pipette
        gesture: click
        validator:
          preset: correct_target
        response:
          scene_operations:
            - type: CursorAttach
              target: aspirating_pipette
              operation: attach
      - target: conical_15ml
        gesture: click
        validator:
          preset: correct_target
        response:
          scene_operations:
            - type: ObjectStateChange
              target: conical_15ml
              state:
                material_name: cell_supernatant
                material_volume: 2.1
            - type: ObjectStateChange
              target: aspirating_pipette
              state:
                held_material_name: cell_supernatant
                held_material_volume: 9.9
      - target: biohazard_decant
        gesture: click
        validator:
          preset: correct_target
        response:
          scene_operations:
            - type: ObjectStateChange
              target: biohazard_decant
              state:
                material_name: cell_supernatant
                material_volume: 9.9
            - type: ObjectStateChange
              target: aspirating_pipette
              state:
                held_material_name: empty
                held_material_volume: 0
      - target: conical_15ml
        gesture: click
        validator:
          preset: correct_target
        response:
          scene_operations:
            - type: ObjectStateChange
              target: conical_15ml
              state:
                material_name: cell_pellet
                material_volume: 0.1
            - type: ObjectStateChange
              target: aspirating_pipette
              state:
                held_material_name: cell_supernatant
                held_material_volume: 2
      - target: biohazard_decant
        gesture: click
        validator:
          preset: correct_target
        response:
          scene_operations:
            - type: ObjectStateChange
              target: biohazard_decant
              state:
                material_name: cell_supernatant
                material_volume: 11.9
            - type: ObjectStateChange
              target: aspirating_pipette
              state:
                held_material_name: empty
                held_material_volume: 0
    step_validator:
      preset: sequence_complete
    outcome:
      on_success: complete
      on_failure: retry
    next_step: resuspend_pellet
  - step_name: resuspend_pellet
    prompt: Add 7.9 mL fresh media, then gently pipette the pellet up and down until no pellet remains. This creates 8.0 mL of uniform cell suspension.
    sequence:
      - target: serological_pipette_pack
        gesture: click
        validator: { preset: correct_target }
        response:
          scene_operations:
            - type: ObjectStateChange
              target: serological_pipette
              state: { freshness: sterile }
      - target: serological_pipette
        gesture: click
        validator:
          preset: correct_target
        response:
          scene_operations:
            - type: CursorAttach
              target: serological_pipette
              operation: attach
      - target: media_bottle
        gesture: click
        validator:
          preset: correct_target
        response:
          scene_operations:
            - type: ObjectStateChange
              target: media_bottle
              state:
                material_volume: 483.1
            - type: ObjectStateChange
              target: serological_pipette
              state:
                held_material_name: media
                held_material_volume: 7.9
      - target: conical_15ml
        gesture: click
        validator:
          preset: correct_target
        response:
          scene_operations:
            - type: ObjectStateChange
              target: conical_15ml
              state:
                material_name: cell_suspension
                material_volume: 8
            - type: ObjectStateChange
              target: serological_pipette
              state:
                held_material_name: empty
                held_material_volume: 0
    step_validator:
      preset: sequence_complete
    outcome:
      on_success: complete
      on_failure: retry
    next_step: calculate_split_volume
  - step_name: calculate_split_volume
    prompt:
      "For a 1:7 passage, transfer one seventh of the 8.0 mL suspension (1.14 mL) into a fresh T75 flask. The remaining suspension is not returned to the original flask."
    sequence:
      - target: serological_pipette_pack
        gesture: click
        validator: { preset: correct_target }
        response:
          scene_operations:
            - type: ObjectStateChange
              target: serological_pipette
              state: { freshness: sterile }
      - target: serological_pipette
        gesture: click
        validator:
          preset: correct_target
        response:
          scene_operations:
            - type: CursorAttach
              target: serological_pipette
              operation: attach
      - target: conical_15ml
        gesture: click
        validator:
          preset: correct_target
        response:
          scene_operations:
            - type: ObjectStateChange
              target: conical_15ml
              state:
                material_volume: 6.86
            - type: ObjectStateChange
              target: serological_pipette
              state:
                held_material_name: cell_suspension
                held_material_volume: 1.14
      - target: t75_flask_new
        gesture: click
        validator:
          preset: correct_target
        response:
          scene_operations:
            - type: ObjectStateChange
              target: t75_flask_new
              state:
                material_name: cell_suspension
                material_volume: 1.14
            - type: ObjectStateChange
              target: serological_pipette
              state:
                held_material_name: empty
                held_material_volume: 0
    step_validator:
      preset: sequence_complete
    outcome:
      on_success: complete
      on_failure: retry
    next_step: label_plate
  - step_name: label_plate
    prompt: Label the fresh T75 flask with OVCAR8, date, passage number, and your initials.
    sequence:
      - target: label_pen
        gesture: click
        validator:
          preset: correct_target
        response:
          scene_operations:
            - type: SceneChange
              to_scene: hood_workspace
            - type: CursorAttach
              target: label_pen
              operation: attach
      - target: t75_flask_new
        gesture: click
        validator:
          preset: correct_target
        response:
          scene_operations:
            - type: ObjectStateChange
              target: t75_flask_new
              state:
                label_status: identity_complete
    step_validator:
      preset: sequence_complete
    outcome:
      on_success: complete
      on_failure: retry
    next_step: return_to_incubator
  - step_name: return_to_incubator
    prompt:
      "Add 8.86 mL complete media to the new flask to reach 10 mL, then return the seeded T75 flask to 37 degrees C and 5% CO2."
    sequence:
      - target: serological_pipette_pack
        gesture: click
        validator: { preset: correct_target }
        response:
          scene_operations:
            - type: ObjectStateChange
              target: serological_pipette
              state: { freshness: sterile }
      - target: media_bottle
        gesture: click
        validator:
          preset: correct_target
        response:
          scene_operations:
            - type: ObjectStateChange
              target: media_bottle
              state:
                material_volume: 474.24
            - type: ObjectStateChange
              target: serological_pipette
              state:
                held_material_name: media
                held_material_volume: 8.86
      - target: t75_flask_new
        gesture: click
        validator:
          preset: correct_target
        response:
          scene_operations:
            - type: ObjectStateChange
              target: t75_flask_new
              state:
                material_name: cell_suspension
                material_volume: 10
            - type: ObjectStateChange
              target: serological_pipette
              state:
                held_material_name: empty
                held_material_volume: 0
      - target: incubator
        gesture: click
        validator:
          preset: correct_target
        response:
          scene_operations:
            - type: ObjectStateChange
              target: incubator
              state:
                door_open: false
            - type: ObjectStateChange
              target: t75_flask_new
              state:
                incubation_status: in_incubator
    step_validator:
      preset: sequence_complete
    outcome:
      on_success: complete
      on_failure: retry
    next_step: null
