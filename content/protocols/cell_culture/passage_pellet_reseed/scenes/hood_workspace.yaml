scene_name: hood_workspace
extends: plate_focus_hood
scene_notes: |
  Hood workspace for pellet reseed mini-protocol. Adds T75 flask (center),
  conical 15ml rack (rear center), fresh media bottle (rear left), label pen
  (right tool area), and incubator (rear right). The foreground plate is the
  readout focus; all other placements below support authored protocol actions.

add_placements:
  - placement_name: right_serological_pipette
    object_name: serological_pipette
    zone: right_tool_area
    depth_tier: 1
    align_stop: center

  - placement_name: right_sterile_serological_pipette_pack
    object_name: serological_pipette_pack
    zone: right_tool_area
    depth_tier: 1
    align_stop: left

  # The original flask is the source for the visible full-volume transfer.
  - placement_name: center_original_t75_flask
    object_name: t75_flask
    zone: center
    depth_tier: 1
    align_stop: right

  # Fresh T75 flask is the reseeding destination beside the foreground plate.
  - placement_name: center_t75_flask_new
    object_name: t75_flask_new
    zone: center
    depth_tier: 1
    align_stop: left

  # Conical rack and fresh media are the reseeding supports in rear-left context.
  - placement_name: center_conical_rack
    object_name: conical_15ml_rack
    zone: rear_left
    depth_tier: 2
    align_stop: right
    # A lower label keeps the rack readable beside the fresh-media bottle.
    layout:
      label_placement: bottom

  - placement_name: rear_left_fresh_media
    object_name: media_bottle
    zone: rear_left
    depth_tier: 1
    align_stop: center

  # Incubator is the post-reseeding destination in rear-right context.
  - placement_name: rear_right_incubator
    object_name: incubator
    zone: rear_right
    depth_tier: 1
    align_stop: center

  # Label pen and aspirating pipette are the two authored tools in the
  # secondary rack.
  - placement_name: center_label_pen
    object_name: label_pen
    zone: right_tool_area
    depth_tier: 1
    align_stop: right

  - placement_name: right_aspirating_pipette
    object_name: aspirating_pipette
    zone: right_tool_area
    depth_tier: 1
    align_stop: left

  # The protocol clicks the rack while its response changes this standalone
  # conical tube's state; both must be present in the focused scene.
  - placement_name: rear_center_conical_tube
    object_name: conical_15ml
    zone: rear_center
    depth_tier: 1
    align_stop: right
