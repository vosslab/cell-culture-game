protocol_type: mini_protocol
protocol_name: mtt_reagent_prep
entry_step: prepare_solution_tube
initial_state:
  - target: mtt_powder_container
    state:
      material_name: mtt_powder
      material_volume: 20
  - target: pbs_bottle
    state:
      material_name: pbs
      material_volume: 496
  - target: mtt_solution_tube
    state:
      material_name: empty
      material_volume: 0
      pbs_added: false
      mtt_dissolved: false
learning:
  objectives:
    Students completing this mini-protocol will have achieved fluency with
    handling a pre-weighed powder vial, aseptic dissolution technique, and
    verification of final reagent concentration.
  outcomes:
    Students completing this mini-protocol will be able to combine a pre-weighed
    20 mg MTT powder vial with 4 mL PBS, dissolve it to reach 12 mM MTT, and verify
    solution readiness for use in the MTT assay.
  goals:
    Overall, this mini-protocol aims to accomplish the MTT reagent preparation
    step (Part 3, Day 4, action A39 of the OVCAR8 assay). A 12 mM MTT solution is
    the critical reagent for the colorimetric viability assay; preparation requires
    adding PBS, transferring the pre-weighed 20 mg powder, and mixing to ensure complete
    solubilization before use in downstream assay steps.
steps:
  - step_name: prepare_solution_tube
    prompt:
      Take a sterile serological pipette from its pack, then transfer 4 mL of
      PBS into the empty graduated MTT solution tube.
    sequence:
      - target: serological_pipette_pack
        gesture: click
        validator:
          preset: correct_target
        response:
          scene_operations:
            - type: ObjectStateChange
              target: serological_pipette
              state:
                freshness: sterile
          feedback:
            correct: "Use one visibly sterile graduated pipette for this PBS transfer."
            incorrect: "Take a fresh serological pipette from the sterile pack before contacting PBS."
      - target: serological_pipette
        gesture: click
        validator:
          preset: correct_target
        response:
          scene_operations:
            - type: SceneChange
              to_scene: mtt_reagent_prep_bench_workspace
      # This scene removes the inherited bench_basic rear_center_pbs placement
      # (see scenes/bench_workspace.yaml remove_placements), so pbs_bottle is
      # placed only once here (rear_center_pbs_bottle). The target names the
      # object_name, matching the PRIMARY_SPEC target vocabulary.
      - target: pbs_bottle
        gesture: click
        validator:
          preset: correct_target
        response:
          scene_operations:
            - type: ObjectStateChange
              target: pbs_bottle
              state:
                material_name: pbs
                material_volume: 492
            - type: ObjectStateChange
              target: serological_pipette
              state:
                held_material_name: pbs
                held_material_volume: 4.0
                freshness: used
      - target: mtt_solution_tube
        gesture: click
        validator:
          preset: correct_target
        response:
          scene_operations:
            - type: ObjectStateChange
              target: mtt_solution_tube
              state:
                material_name: pbs
                material_volume: 4.0
                pbs_added: true
            - type: ObjectStateChange
              target: serological_pipette
              state:
                held_material_name: empty
                held_material_volume: 0
    step_validator:
      preset: sequence_complete
    outcome:
      on_success: complete
      on_failure: retry
    next_step: dissolve_and_mix
  - step_name: dissolve_and_mix
    prompt:
      Transfer the 20 mg MTT powder into the solution tube by tapping the powder
      vial over the tube. Then vortex the tube for 30 seconds to fully dissolve the
      powder.
    sequence:
      - target: mtt_powder_container
        gesture: click
        validator:
          preset: correct_target
        response:
          scene_operations:
            - type: ObjectStateChange
              target: mtt_powder_container
              state:
                material_name: empty
                material_volume: 0
      - target: mtt_solution_tube
        gesture: click
        validator:
          preset: correct_target
        response:
          scene_operations:
            - type: ObjectStateChange
              target: mtt_solution_tube
              state:
                material_volume: 4.0
      - target: vortex
        gesture: click
        validator:
          preset: correct_target
        response:
          scene_operations: []
      - target: mtt_solution_tube
        gesture: click
        validator:
          preset: correct_target
        response:
          scene_operations:
            - type: TimedWait
              target: vortex
              duration_min: 0.5
              display: dissolving MTT
            - type: ObjectStateChange
              target: mtt_solution_tube
              state:
                material_name: mtt_solution_12mm
                material_volume: 4.0
                mtt_dissolved: true
    step_validator:
      preset: sequence_complete
    outcome:
      on_success: complete
      on_failure: retry
    next_step: verify_final_volume
  - step_name: verify_final_volume
    prompt:
      Inspect the graduated tube's visible 4 mL homogeneous yellow solution, then choose
      whether this preparation is ready to use in the assay.
    sequence:
      - target: volume_decision_sufficient
        gesture: select
        validator:
          preset: correct_choice
        response:
          scene_operations: []
          feedback:
            correct: "Ready: the visible 4 mL homogeneous yellow solution meets the preparation requirement."
            incorrect: "Compare the visible volume and solution appearance with the stated preparation requirement before choosing."
    step_validator:
      preset: final_state_matches
      target: mtt_solution_tube
      contains:
        material_name: mtt_solution_12mm
        material_volume: 4.0
        pbs_added: true
        mtt_dissolved: true
    outcome:
      on_success: complete
      on_failure: retry
    next_step: null
