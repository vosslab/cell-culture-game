protocol_type: mini_protocol
protocol_name: trypan_blue_counting
entry_step: add_trypan_blue_to_chamber
initial_state:
  # A direct run begins with the retained resuspended passage fraction. The
  # full runner carries this same state from passage_pellet_reseed instead.
  - target: conical_15ml
    state:
      material_name: cell_suspension
      material_volume: 6.86
learning:
  objectives:
    "Students completing this mini-protocol will have achieved fluency with

    trypan blue exclusion sample preparation and automated cell-counter operation

    and viability-threshold interpretation.

    "
  outcomes: "Students completing this mini-protocol will be able to prepare a

    trypan-blue-stained cell suspension on a hemocytometer slide, perform

    prepare a 1:1 trypan-blue cell mixture, load a hemocytometer chamber by capillary action,

    operate an automated cell counter, and interpret viability results

    against the required greater-than-90% threshold for downstream seeding decisions.

    "
  goals: "Overall, this mini-protocol aims to accomplish the cell-counting and

    viability-assessment stage of the OVCAR8 passage workflow. It teaches

    trypan-blue exclusion sample preparation and automated cell-counter

    operation in sequence. The hemocytometer is used as the sample chamber;

    the counter supplies the displayed count and viability result.

    "
steps:
  - step_name: add_trypan_blue_to_chamber
    prompt:
      Mount a fresh P20 tip, then add 10 microL of Trypan Blue stain to the central
      diamond mixing chamber of a clean hemocytometer slide.
    sequence:
      - target: p20_micropipette
        gesture: click
        validator:
          preset: correct_target
        response:
          scene_operations:
            - type: SceneChange
              to_scene: cell_counter_workspace
            - type: CursorAttach
              target: p20_micropipette
              operation: attach
      - target: micropipette_tip_box
        gesture: click
        validator:
          preset: correct_target
        response:
          scene_operations:
            - type: ObjectStateChange
              target: p20_micropipette
              state:
                tip_status: fresh
          feedback:
            correct: "Fresh P20 tip mounted before contacting the Trypan Blue source."
            incorrect: "Mount a fresh P20 tip before drawing Trypan Blue."
      - target: p20_micropipette
        gesture: adjust
        validator:
          preset: target_with_value
          value:
            set_volume: 10
        response:
          scene_operations:
            - type: ObjectStateChange
              target: p20_micropipette
              state:
                set_volume: 10
      - target: trypan_blue_tube
        gesture: click
        validator:
          preset: correct_target
        response:
          scene_operations:
            # 10 &micro;L = 0.01 mL; the pre-filled tube starts at 10 mL.
            - type: ObjectStateChange
              target: trypan_blue_tube
              state:
                material_volume: 9.99
            - type: ObjectStateChange
              target: p20_micropipette
              state:
                held_material_name: trypan_blue
                held_material_volume: 10
      - target: hemocytometer_slide.diamond
        gesture: click
        validator:
          preset: correct_target
        response:
          scene_operations:
            - type: ObjectStateChange
              target: hemocytometer_slide.diamond
              state:
                material_name: trypan_blue
                material_volume: 0.01
            - type: ObjectStateChange
              target: p20_micropipette
              state:
                held_material_name: empty
                held_material_volume: 0
                tip_status: used
    step_validator:
      preset: sequence_complete
    outcome:
      on_success: complete
      on_failure: retry
    next_step: add_cell_suspension_to_chamber
  - step_name: add_cell_suspension_to_chamber
    prompt:
      Use a fresh tip to add 10 microL cell suspension to the central diamond chamber, making a 1:1 mixture with Trypan Blue.
    sequence:
      - target: micropipette_tip_box
        gesture: click
        validator:
          preset: correct_target
        response:
          scene_operations:
            - type: ObjectStateChange
              target: p20_micropipette
              state:
                tip_status: fresh
          feedback:
            correct: "Fresh tip selected before contacting the cell-suspension source."
            incorrect: "Select a new sterile tip before drawing cell suspension; the prior tip contacted Trypan Blue."
      - target: p20_micropipette
        gesture: click
        validator:
          preset: correct_target
        response:
          scene_operations:
            - type: CursorAttach
              target: p20_micropipette
              operation: attach
      - target: p20_micropipette
        gesture: adjust
        validator:
          preset: target_with_value
          value:
            set_volume: 10
        response:
          scene_operations:
            - type: ObjectStateChange
              target: p20_micropipette
              state:
                set_volume: 10
      - target: conical_15ml
        gesture: click
        validator:
          preset: correct_target
        response:
          scene_operations:
            # The conical carries the resuspended passage fraction.
            - type: ObjectStateChange
              target: conical_15ml
              state:
                material_volume: 6.85
            - type: ObjectStateChange
              target: p20_micropipette
              state:
                held_material_name: cell_suspension
                held_material_volume: 10
      - target: hemocytometer_slide.diamond
        gesture: click
        validator:
          preset: correct_target
        response:
          scene_operations:
            - type: ObjectStateChange
              target: hemocytometer_slide.diamond
              state:
                material_name: trypan_blue_mixture
                material_volume: 0.02
            - type: ObjectStateChange
              target: p20_micropipette
              state:
                held_material_name: empty
                held_material_volume: 0
                tip_status: used
    step_validator:
      preset: sequence_complete
    outcome:
      on_success: complete
      on_failure: retry
    next_step: mix_by_pipetting
  - step_name: mix_by_pipetting
    prompt:
      Gently pipette the 1:1 Trypan Blue-cell mixture up and down three times. Watch the
      visible cycle counter; homogeneous mixing is required before chamber loading.
    sequence:
      - target: p20_micropipette
        gesture: click
        validator:
          preset: correct_target
        response:
          scene_operations:
            - type: CursorAttach
              target: p20_micropipette
              operation: attach
      - target: hemocytometer_slide.diamond
        gesture: click
        validator:
          preset: correct_target
        response:
          scene_operations:
            - type: ObjectStateChange
              target: hemocytometer_slide.diamond
              state:
                material_name: trypan_blue_mixture
            - type: ObjectStateChange
              target: hemocytometer_slide
              state:
                mix_cycles: 1
      - target: hemocytometer_slide.diamond
        gesture: click
        validator:
          preset: correct_target
        response:
          scene_operations:
            - type: ObjectStateChange
              target: hemocytometer_slide.diamond
              state:
                material_name: trypan_blue_mixture
            - type: ObjectStateChange
              target: hemocytometer_slide
              state:
                mix_cycles: 2
      - target: hemocytometer_slide.diamond
        gesture: click
        validator:
          preset: correct_target
        response:
          scene_operations:
            - type: ObjectStateChange
              target: hemocytometer_slide.diamond
              state:
                material_name: trypan_blue_mixture
            - type: ObjectStateChange
              target: hemocytometer_slide
              state:
                mix_cycles: 3
            - type: ObjectStateChange
              target: hemocytometer_slide
              state:
                mixture_homogeneous: true
            - type: ObjectStateChange
              target: p20_micropipette
              state:
                tip_status: used
          feedback:
            correct: "Three gentle cycles completed; the mixture is visibly homogeneous and ready for capillary loading."
            incorrect: "Complete all three gentle mixing cycles before loading the chamber."
    step_validator:
      preset: sequence_complete
    outcome:
      on_success: complete
      on_failure: retry
    next_step: load_semicircle_chamber
  - step_name: load_semicircle_chamber
    prompt:
      Draw 10 microL from the central diamond mixing chamber, then touch the right-hand chamber edge so capillary action loads the semicircle without bubbles.
    sequence:
      - target: p20_micropipette
        gesture: click
        validator:
          preset: correct_target
        response:
          scene_operations:
            - type: CursorAttach
              target: p20_micropipette
              operation: attach
      - target: p20_micropipette
        gesture: adjust
        validator:
          preset: target_with_value
          value:
            set_volume: 10
        response:
          scene_operations:
            - type: ObjectStateChange
              target: p20_micropipette
              state:
                set_volume: 10
      - target: hemocytometer_slide.diamond
        gesture: click
        validator:
          preset: correct_target
        response:
          scene_operations:
            - type: ObjectStateChange
              target: hemocytometer_slide.diamond
              state:
                material_name: trypan_blue_mixture
                material_volume: 0.01
            - type: ObjectStateChange
              target: hemocytometer_slide
              state:
                chamber_load_quality: capillary_loading
            - type: ObjectStateChange
              target: p20_micropipette
              state:
                held_material_name: trypan_blue_mixture
                held_material_volume: 10
      - target: hemocytometer_slide.semicircle
        gesture: click
        validator:
          preset: correct_target
        response:
          scene_operations:
            - type: ObjectStateChange
              target: hemocytometer_slide.semicircle
              state:
                material_name: trypan_blue_mixture
                material_volume: 0.01
            - type: ObjectStateChange
              target: hemocytometer_slide
              state:
                chamber_load_quality: bubble_free
            - type: ObjectStateChange
              target: p20_micropipette
              state:
                held_material_name: empty
                held_material_volume: 0
                tip_status: used
          feedback:
            correct: "The semicircle filled by capillary action with a bubble-free meniscus."
            incorrect: "Touch the chamber edge gently so capillary action fills the semicircle without bubbles."
    step_validator:
      preset: sequence_complete
    outcome:
      on_success: complete
      on_failure: retry
    next_step: wipe_off_excess
  - step_name: wipe_off_excess
    prompt:
      Wipe off excess liquid from the edges of the hemocytometer slide using a
      lens-cleaning tissue, leaving only the loaded chamber saturated.
    sequence:
      - target: lens_tissue
        gesture: click
        validator:
          preset: correct_target
        response:
          scene_operations:
            - type: CursorAttach
              target: lens_tissue
              operation: attach
      - target: hemocytometer_slide
        gesture: click
        validator:
          preset: correct_target
        response:
          scene_operations:
            - type: ObjectStateChange
              target: hemocytometer_slide
              state:
                excess_wiped: true
    step_validator:
      preset: sequence_complete
    outcome:
      on_success: complete
      on_failure: retry
    next_step: observe_manual_live_dead_cells
  - step_name: observe_manual_live_dead_cells
    prompt: >
      Move the loaded chamber to the microscope and view it. Clear cells exclude Trypan Blue
      (live); blue cells are nonviable. Count the representative quadrants before
      comparing your observation with the automated counter.
    sequence:
      - target: hemocytometer_slide
        gesture: click
        validator:
          preset: correct_target
        response:
          scene_operations:
            - type: SceneChange
              to_scene: hemocytometer_view
      - target: hemocytometer_slide
        gesture: click
        validator:
          preset: correct_target
        response:
          scene_operations:
            - type: ObjectStateChange
              target: hemocytometer_slide
              state:
                observation_state: live_dead_cells_visible
            - type: SceneChange
              to_scene: hemocytometer_count_review
      - target: manual_count_85_live_7_dead
        gesture: select
        validator:
          preset: correct_choice
        response:
          scene_operations:
            - type: ObjectStateChange
              target: hemocytometer_slide
              state:
                observation_state: quadrants_counted
          feedback:
            correct: "That count matches the visible clear and blue cells. Continue to compare it with the automated result."
            incorrect: "Recount the visible clear and blue cells in the representative quadrants, then choose the count that matches your observation."
    step_validator:
      preset: sequence_complete
    outcome:
      on_success: complete
      on_failure: retry
    next_step: insert_slide_into_counter
  - step_name: insert_slide_into_counter
    prompt:
      Insert the prepared hemocytometer slide into the automated cell counter
      to begin analysis.
    sequence:
      - target: hemocytometer_slide
        gesture: click
        validator:
          preset: correct_target
        response:
          scene_operations:
            - type: SceneChange
              to_scene: cell_counter_workspace
      - target: cell_counter
        gesture: click
        validator:
          preset: correct_target
        response:
          scene_operations:
            - type: ObjectStateChange
              target: cell_counter
              state:
                slide_loaded: true
                manual_observation: quadrants_counted
    step_validator:
      preset: sequence_complete
    outcome:
      on_success: complete
      on_failure: retry
    next_step: press_capture
  - step_name: press_capture
    prompt:
      Start the counter, wait for its focus-complete status, then press Capture to record the measured cell count and viability.
    sequence:
      - target: cell_counter
        gesture: click
        validator:
          preset: correct_target
        response:
          scene_operations:
            - type: TimedWait
              target: cell_counter
              duration_min: 0.05
              display: focusing
            - type: ObjectStateChange
              target: cell_counter
              state:
                focused: true
            - type: ObjectStateChange
              target: cell_counter
              state:
                capture_pressed: true
                cell_count: 850000
                cell_concentration_per_ml: 850000
                viability_percent: 92.5
            - type: SceneChange
              to_scene: viability_review
    step_validator:
      preset: sequence_complete
    outcome:
      on_success: complete
      on_failure: retry
    next_step: verify_viability_gate
  - step_name: verify_viability_gate
    prompt: >
      Review the displayed viable-cell concentration and viability percentage. Choose whether
      this sample is strictly greater than 90% viable, the required gate for downstream seeding.
    sequence:
      - target: viability_decision_proceed
        gesture: select
        validator:
          preset: correct_choice
        response:
          scene_operations:
            - type: ObjectStateChange
              target: cell_counter
              state:
                viability_verified: true
          feedback:
            correct: "Accepted. The displayed viability clears the stated gate, so the measured viable-cell concentration can carry forward to seeding."
            incorrect: "Compare the displayed viability percentage with the stated threshold before deciding whether to proceed or recount."
    step_validator:
      preset: final_state_matches
      target: cell_counter
      contains:
        viability_percent: 92.5
    outcome:
      on_success: complete
      on_failure: retry
    next_step: null
