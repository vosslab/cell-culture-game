protocol_type: mini_protocol
protocol_name: trypan_blue_counting
entry_step: add_trypan_blue_to_chamber
initial_state:
  # A direct run begins with the retained resuspended passage fraction. The
  # full runner carries this same state from passage_pellet_reseed instead.
  - target: conical_15ml
    state:
      material_name: cell_suspension
      material_volume: 6.86
learning:
  objectives:
    "Students completing this mini-protocol will have achieved fluency with

    trypan blue exclusion sample preparation and automated cell-counter operation

    and viability-threshold interpretation.

    "
  outcomes: "Students completing this mini-protocol will be able to prepare a

    trypan-blue-stained cell suspension on a hemocytometer slide, perform

    prepare a 1:1 trypan-blue cell mixture, load a hemocytometer chamber by capillary action,

    operate an automated cell counter, and interpret viability results

    against the required greater-than-90% threshold for downstream seeding decisions.

    "
  goals: "Overall, this mini-protocol aims to accomplish the cell-counting and

    viability-assessment stage of the OVCAR8 passage workflow. It teaches

    trypan-blue exclusion sample preparation and automated cell-counter

    operation in sequence. The hemocytometer is used as the sample chamber;

    the counter supplies the displayed count and viability result.

    "
steps:
  - step_name: add_trypan_blue_to_chamber
    prompt:
      Mount a fresh P20 tip, then add 10 microL of Trypan Blue stain to the central
      diamond mixing chamber of a clean hemocytometer slide.
    sequence:
      - target: p20_micropipette
        gesture: click
        instruction: "Attach the P20 micropipette for the Trypan Blue transfer."
        hint: "Use the fresh tip and 10 microL set point for the stain draw."
        validator:
          preset: correct_target
        response:
          scene_operations:
            - type: SceneChange
              to_scene: cell_counter_workspace
            - type: CursorAttach
              target: p20_micropipette
              operation: attach
      - target: micropipette_tip_box
        gesture: click
        instruction: "Fit a fresh tip on the P20 micropipette."
        hint: "Use the sterile tip before drawing Trypan Blue stain."
        validator:
          preset: correct_target
        response:
          scene_operations:
            - type: ObjectStateChange
              target: p20_micropipette
              state:
                tip_status: fresh
          feedback:
            correct: "Fresh P20 tip mounted before contacting the Trypan Blue source."
            incorrect: "Mount a fresh P20 tip before drawing Trypan Blue."
      - target: p20_micropipette
        gesture: adjust
        instruction: "Set the P20 micropipette to 10 &micro;L for the Trypan Blue transfer."
        hint: "The 10 &micro;L set point provides the equal stain volume needed for the planned 1:1 mixture."
        validator:
          preset: target_with_value
          value:
            set_volume: 10
        response:
          scene_operations:
            - type: ObjectStateChange
              target: p20_micropipette
              state:
                set_volume: 10
      - target: trypan_blue_tube
        gesture: click
        instruction: "Draw 10 microL of Trypan Blue stain from the tube."
        hint: "Use the measured stain load for the central diamond chamber."
        validator:
          preset: correct_target
        response:
          scene_operations:
            # 10 &micro;L = 0.01 mL; the pre-filled tube starts at 10 mL.
            - type: ObjectStateChange
              target: trypan_blue_tube
              state:
                material_volume: 9.99
            - type: ObjectStateChange
              target: p20_micropipette
              state:
                held_material_name: trypan_blue
                held_material_volume: 10
      - target: hemocytometer_slide.diamond
        gesture: click
        instruction: "Dispense the Trypan Blue into the central diamond chamber."
        hint: "Touch the diamond cleanly so the stain remains in the mixing chamber."
        validator:
          preset: correct_target
        response:
          scene_operations:
            - type: ObjectStateChange
              target: hemocytometer_slide.diamond
              state:
                material_name: trypan_blue
                material_volume: 0.01
            - type: ObjectStateChange
              target: p20_micropipette
              state:
                held_material_name: empty
                held_material_volume: 0
                tip_status: used
    step_validator:
      preset: sequence_complete
    outcome:
      on_success: complete
      on_failure: retry
    next_step: add_cell_suspension_to_chamber
  - step_name: add_cell_suspension_to_chamber
    prompt:
      Use a fresh tip to add 10 microL cell suspension to the central diamond chamber, making a 1:1 mixture with Trypan Blue.
    sequence:
      - target: micropipette_tip_box
        gesture: click
        instruction: "Fit a fresh tip on the P20 micropipette."
        hint: "Use a new tip before drawing the cell suspension."
        validator:
          preset: correct_target
        response:
          scene_operations:
            - type: ObjectStateChange
              target: p20_micropipette
              state:
                tip_status: fresh
          feedback:
            correct: "Fresh tip selected before contacting the cell-suspension source."
            incorrect: "Select a new sterile tip before drawing cell suspension; the prior tip contacted Trypan Blue."
      - target: p20_micropipette
        gesture: click
        instruction: "Attach the P20 micropipette for the cell-suspension draw."
        hint: "Use the fresh tip and 10 microL set point for the 1:1 mixture."
        validator:
          preset: correct_target
        response:
          scene_operations:
            - type: CursorAttach
              target: p20_micropipette
              operation: attach
      - target: p20_micropipette
        gesture: adjust
        instruction: "Set the P20 micropipette to 10 &micro;L for the cell-suspension transfer."
        hint: "The 10 &micro;L set point matches the stain volume so the chamber receives a 1:1 sample mixture."
        validator:
          preset: target_with_value
          value:
            set_volume: 10
        response:
          scene_operations:
            - type: ObjectStateChange
              target: p20_micropipette
              state:
                set_volume: 10
      - target: conical_15ml
        gesture: click
        instruction: "Draw 10 microL of cell suspension from the conical tube."
        hint: "Keep the fresh tip separate from the stain until dispensing into the diamond."
        validator:
          preset: correct_target
        response:
          scene_operations:
            # The conical carries the resuspended passage fraction.
            - type: ObjectStateChange
              target: conical_15ml
              state:
                material_volume: 6.85
            - type: ObjectStateChange
              target: p20_micropipette
              state:
                held_material_name: cell_suspension
                held_material_volume: 10
      - target: hemocytometer_slide.diamond
        gesture: click
        instruction: "Dispense 10 microL of cell suspension into the diamond."
        hint: "Add the cell suspension to the Trypan Blue to create the 1:1 mixture."
        validator:
          preset: correct_target
        response:
          scene_operations:
            - type: ObjectStateChange
              target: hemocytometer_slide.diamond
              state:
                material_name: trypan_blue_mixture
                material_volume: 0.02
            - type: ObjectStateChange
              target: p20_micropipette
              state:
                held_material_name: empty
                held_material_volume: 0
                tip_status: used
    step_validator:
      preset: sequence_complete
    outcome:
      on_success: complete
      on_failure: retry
    next_step: mix_by_pipetting
  - step_name: mix_by_pipetting
    prompt:
      Gently pipette the 1:1 Trypan Blue-cell mixture up and down three times. Watch the
      visible cycle counter; homogeneous mixing is required before chamber loading.
    sequence:
      - target: p20_micropipette
        gesture: click
        instruction: "Attach the P20 tip to begin the three mixing cycles."
        hint: "Use the attached pipette for each gentle up-and-down stroke."
        validator:
          preset: correct_target
        response:
          scene_operations:
            - type: CursorAttach
              target: p20_micropipette
              operation: attach
      - target: hemocytometer_slide.diamond
        gesture: click
        instruction: "Complete mixing cycle 1 in the central diamond."
        hint: "Pipette the mixture gently up and down once; stop after cycle 1."
        validator:
          preset: correct_target
        response:
          scene_operations:
            - type: ObjectStateChange
              target: hemocytometer_slide.diamond
              state:
                material_name: trypan_blue_mixture
            - type: ObjectStateChange
              target: hemocytometer_slide
              state:
                mix_cycles: 1
      - target: hemocytometer_slide.diamond
        gesture: click
        instruction: "Complete mixing cycle 2 in the central diamond."
        hint: "Pipette the mixture gently up and down once; stop after cycle 2."
        validator:
          preset: correct_target
        response:
          scene_operations:
            - type: ObjectStateChange
              target: hemocytometer_slide.diamond
              state:
                material_name: trypan_blue_mixture
            - type: ObjectStateChange
              target: hemocytometer_slide
              state:
                mix_cycles: 2
      - target: hemocytometer_slide.diamond
        gesture: click
        instruction: "Complete mixing cycle 3 in the central diamond."
        hint: "Pipette the mixture gently up and down once; stop after cycle 3."
        validator:
          preset: correct_target
        response:
          scene_operations:
            - type: ObjectStateChange
              target: hemocytometer_slide.diamond
              state:
                material_name: trypan_blue_mixture
            - type: ObjectStateChange
              target: hemocytometer_slide
              state:
                mix_cycles: 3
            - type: ObjectStateChange
              target: hemocytometer_slide
              state:
                mixture_homogeneous: true
            - type: ObjectStateChange
              target: p20_micropipette
              state:
                tip_status: used
          feedback:
            correct: "Three gentle cycles completed; the mixture is visibly homogeneous and ready for capillary loading."
            incorrect: "Complete all three gentle mixing cycles before loading the chamber."
    step_validator:
      preset: sequence_complete
    outcome:
      on_success: complete
      on_failure: retry
    next_step: load_semicircle_chamber
  - step_name: load_semicircle_chamber
    prompt:
      Draw 10 microL from the central diamond mixing chamber, then touch the right-hand chamber edge so capillary action loads the semicircle without bubbles.
    sequence:
      - target: p20_micropipette
        gesture: click
        instruction: "Attach the P20 micropipette to draw the mixed sample."
        hint: "Use the measured 10 microL load for capillary chamber loading."
        validator:
          preset: correct_target
        response:
          scene_operations:
            - type: CursorAttach
              target: p20_micropipette
              operation: attach
      - target: p20_micropipette
        gesture: adjust
        instruction: "Set the P20 micropipette to 10 &micro;L for the mixed-sample load."
        hint: "The 10 &micro;L load supplies enough homogeneous mixture for capillary chamber loading without overfilling it."
        validator:
          preset: target_with_value
          value:
            set_volume: 10
        response:
          scene_operations:
            - type: ObjectStateChange
              target: p20_micropipette
              state:
                set_volume: 10
      - target: hemocytometer_slide.diamond
        gesture: click
        instruction: "Draw 10 microL from the mixed central diamond."
        hint: "Keep the mixture homogeneous while moving the tip to the chamber edge."
        validator:
          preset: correct_target
        response:
          scene_operations:
            - type: ObjectStateChange
              target: hemocytometer_slide.diamond
              state:
                material_name: trypan_blue_mixture
                material_volume: 0.01
            - type: ObjectStateChange
              target: hemocytometer_slide
              state:
                chamber_load_quality: capillary_loading
            - type: ObjectStateChange
              target: p20_micropipette
              state:
                held_material_name: trypan_blue_mixture
                held_material_volume: 10
      - target: hemocytometer_slide.semicircle
        gesture: click
        instruction: "Touch the right chamber edge to load the semicircle."
        hint: "Let capillary action fill the chamber without introducing bubbles."
        validator:
          preset: correct_target
        response:
          scene_operations:
            - type: ObjectStateChange
              target: hemocytometer_slide.semicircle
              state:
                material_name: trypan_blue_mixture
                material_volume: 0.01
            - type: ObjectStateChange
              target: hemocytometer_slide
              state:
                chamber_load_quality: bubble_free
            - type: ObjectStateChange
              target: p20_micropipette
              state:
                held_material_name: empty
                held_material_volume: 0
                tip_status: used
          feedback:
            correct: "The semicircle filled by capillary action with a bubble-free meniscus."
            incorrect: "Touch the chamber edge gently so capillary action fills the semicircle without bubbles."
    step_validator:
      preset: sequence_complete
    outcome:
      on_success: complete
      on_failure: retry
    next_step: wipe_off_excess
  - step_name: wipe_off_excess
    prompt:
      Wipe off excess liquid from the edges of the hemocytometer slide using a
      lens-cleaning tissue, leaving only the loaded chamber saturated.
    sequence:
      - target: lens_tissue
        gesture: click
        instruction: "Pick up the lens tissue to wipe the slide edges."
        hint: "Use the tissue only around the loaded chamber to remove excess liquid."
        validator:
          preset: correct_target
        response:
          scene_operations:
            - type: CursorAttach
              target: lens_tissue
              operation: attach
      - target: hemocytometer_slide
        gesture: click
        instruction: "Wipe excess liquid from the hemocytometer slide edges."
        hint: "Leave the loaded chamber saturated while clearing the surrounding surface."
        validator:
          preset: correct_target
        response:
          scene_operations:
            - type: ObjectStateChange
              target: hemocytometer_slide
              state:
                excess_wiped: true
    step_validator:
      preset: sequence_complete
    outcome:
      on_success: complete
      on_failure: retry
    next_step: observe_manual_live_dead_cells
  - step_name: observe_manual_live_dead_cells
    prompt: >
      Move the loaded chamber to the microscope and view it. Clear cells exclude Trypan Blue
      (live); blue cells are nonviable. Count the representative quadrants before
      comparing your observation with the automated counter.
    sequence:
      - target: hemocytometer_slide
        gesture: click
        instruction: "Move the loaded slide into the microscope view."
        hint: "Place the prepared chamber on the microscope before counting cells."
        validator:
          preset: correct_target
        response:
          scene_operations:
            - type: SceneChange
              to_scene: hemocytometer_view
      - target: hemocytometer_slide
        gesture: click
        instruction: "View the chamber to reveal the live and dead cell pattern."
        hint: "The microscope view must be visible before you compare the representative counts."
        validator:
          preset: correct_target
        response:
          scene_operations:
            - type: ObjectStateChange
              target: hemocytometer_slide
              state:
                observation_state: live_dead_cells_visible
            - type: SceneChange
              to_scene: hemocytometer_count_review
      - target: manual_count_85_live_7_dead
        gesture: select
        instruction: "Compare the visible clear and blue cells in the representative quadrants and choose the matching count."
        hint: "Use the live/dead staining pattern and your quadrant tally as evidence for the manual count decision."
        validator:
          preset: correct_choice
        response:
          scene_operations:
            - type: ObjectStateChange
              target: hemocytometer_slide
              state:
                observation_state: quadrants_counted
          feedback:
            correct: "That count matches the visible clear and blue cells. Continue to compare it with the automated result."
            incorrect: "Recount the visible clear and blue cells in the representative quadrants, then choose the count that matches your observation."
    step_validator:
      preset: sequence_complete
    outcome:
      on_success: complete
      on_failure: retry
    next_step: insert_slide_into_counter
  - step_name: insert_slide_into_counter
    prompt:
      Insert the prepared hemocytometer slide into the automated cell counter
      to begin analysis.
    sequence:
      - target: hemocytometer_slide
        gesture: click
        instruction: "Insert the prepared hemocytometer slide into the counter."
        hint: "Seat the slide fully before beginning automated analysis."
        validator:
          preset: correct_target
        response:
          scene_operations:
            - type: SceneChange
              to_scene: cell_counter_workspace
      - target: cell_counter
        gesture: click
        instruction: "Open the cell-counter loading controls."
        hint: "Confirm the slide is seated before starting the measurement."
        validator:
          preset: correct_target
        response:
          scene_operations:
            - type: ObjectStateChange
              target: cell_counter
              state:
                slide_loaded: true
                manual_observation: quadrants_counted
    step_validator:
      preset: sequence_complete
    outcome:
      on_success: complete
      on_failure: retry
    next_step: press_capture
  - step_name: press_capture
    prompt:
      Start the counter, wait for its focus-complete status, then press Capture to record the measured cell count and viability.
    sequence:
      - target: cell_counter
        gesture: click
        instruction: "Start the cell counter and press Capture after focus completes."
        hint: "Wait for the focus-complete status before recording the measured count and viability."
        validator:
          preset: correct_target
        response:
          scene_operations:
            - type: TimedWait
              target: cell_counter
              duration_min: 0.05
              display: focusing
            - type: ObjectStateChange
              target: cell_counter
              state:
                focused: true
            - type: ObjectStateChange
              target: cell_counter
              state:
                capture_pressed: true
                cell_count: 850000
                cell_concentration_per_ml: 850000
                viability_percent: 92.5
            - type: SceneChange
              to_scene: viability_review
    step_validator:
      preset: sequence_complete
    outcome:
      on_success: complete
      on_failure: retry
    next_step: verify_viability_gate
  - step_name: verify_viability_gate
    prompt: >
      Review the displayed viable-cell concentration and viability percentage. Choose whether
      this sample is strictly greater than 90% viable, the required gate for downstream seeding.
    sequence:
      - target: viability_decision_proceed
        gesture: select
        instruction: "Compare the displayed viability percentage with the stated downstream gate and choose the matching decision."
        hint: "Use the counter's visible percentage and the threshold shown in the review screen as your evidence."
        validator:
          preset: correct_choice
        response:
          scene_operations:
            - type: ObjectStateChange
              target: cell_counter
              state:
                viability_verified: true
          feedback:
            correct: "Accepted. The displayed viability clears the stated gate, so the measured viable-cell concentration can carry forward to seeding."
            incorrect: "Compare the displayed viability percentage with the stated threshold before deciding whether to proceed or recount."
    step_validator:
      preset: final_state_matches
      target: cell_counter
      contains:
        viability_percent: 92.5
    outcome:
      on_success: complete
      on_failure: retry
    next_step: null
