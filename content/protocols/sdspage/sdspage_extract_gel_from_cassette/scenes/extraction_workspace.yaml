scene_name: extraction_workspace
extends: electrophoresis_bench

add_placements:
  - placement_name: front_center_staining_tray
    object_name: staining_tray
    zone: front_center
    depth_tier: 2
    align_stop: center
  # Kept visible beside the stopped apparatus so the direct-entry state makes
  # the seated buffer dam inspectable rather than silently recreating it.
  - placement_name: front_right_electrophoresis_buffer_dam
    object_name: electrophoresis_buffer_dam
    zone: front_right
    depth_tier: 2
    align_stop: center
  - placement_name: right_tool_area_electrophoresis_black_lead
    object_name: electrophoresis_black_lead
    zone: right_tool_area
    depth_tier: 1
  - placement_name: right_tool_area_electrophoresis_red_lead
    object_name: electrophoresis_red_lead
    zone: right_tool_area
    depth_tier: 1

remove_placements:
  # This extraction block uses the electrical assembly, gel cassette, opening
  # tool, and destination tray. Reagent vessels and loading supplies belong to
  # their own learning blocks and can carry unrelated default materials.
  - rear_left_running_buffer_10x
  - center_running_buffer_1x_carboy
  - center_ddh2o_bottle
  - center_serological_pipette
  - center_p200_micropipette
  - right_tool_area_p10_gel_loading_tip_box
  - rear_left_protein_ladder_tube
  - rear_left_recycle_buffer_bottle
  - front_left_mini_protean_gel
  - front_center_waste_container
  - front_right_gel_comb
