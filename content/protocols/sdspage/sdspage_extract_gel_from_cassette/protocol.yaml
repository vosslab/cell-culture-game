protocol_type: mini_protocol
protocol_name: sdspage_extract_gel_from_cassette
entry_step: disconnect_power_and_remove_lid
initial_state:
  # Match the stopped-run endpoint so this protocol is a viable standalone
  # continuation as well as the next block in the full SDS-PAGE runner.
  - target: electrophoresis_tank
    state: { lid_present: true, module_present: true }
  - target: electrode_module
    state: { mounted: true, cassette_mounted: true, wing_clamps_open: false }
  - target: electrophoresis_buffer_dam
    state: { seated: true }
  - target: electrophoresis_black_lead
    state: { attached: true }
  - target: electrophoresis_red_lead
    state: { attached: true }
  - target: power_supply
    state: { set_voltage: 150, running: false, cathode_lead_attached: true, anode_lead_attached: true }
  - target: gel_cassette
    state:
      { tape_present: false, comb_present: false, wing_clamps_locked: true,
        migration_state: near_bottom, gel_state: separated_unstained,
        lane_pattern: samples_1_to_3_ladder_5 }
learning:
  objectives:
    Students completing this mini-protocol will have achieved hands-on competency
    in de-energizing an electrophoresis system, safely removing the sealed chamber,
    recovering the electrode assembly, and extracting a polyacrylamide gel from its
    protective cassette.
  outcomes:
    Students completing this mini-protocol will be able to disconnect the
    power supply leads from the electrode module, open and remove the electrophoresis
    tank lid, lift the electrode module out of the tank, pry open the gel cassette
    plates using a specialized gel-opening tool, and transfer the intact gel to a
    staining tray for post-electrophoresis processing.
  goals:
    "Overall, this mini-protocol aims to accomplish the gel extraction phase
    of SDS-PAGE: transitioning from the closed electrophoresis chamber (powered down)
    to a gel ready for staining. This step comes immediately after the run is complete
    and power is off; it bridges the completed electrophoresis chamber to the staining
    workflow by safely recovering the gel."
steps:
  - step_name: disconnect_power_and_remove_lid
    prompt:
      Disconnect the power supply leads and open the electrophoresis tank. Turn
      off the supply first, remove both leads, then lift the lid. Never open a
      powered electrophoresis chamber.
    sequence:
      - target: electrophoresis_tank
        gesture: click
        instruction: Open the electrophoresis tank workspace.
        hint: Begin with the power-off apparatus so the leads and lid are visible.
        validator:
          preset: correct_target
        response:
          scene_operations:
            - type: SceneChange
              to_scene: extraction_workspace
      - target: power_supply
        gesture: click
        instruction: Turn off the power supply.
        hint: Confirm the supply is stopped before disconnecting either lead.
        validator:
          preset: correct_target
        response:
          scene_operations:
            - type: ObjectStateChange
              target: power_supply
              state:
                running: false
      - target: electrophoresis_black_lead
        gesture: click
        instruction: Disconnect the black cathode lead.
        hint: Remove the black lead only after the supply is off.
        validator:
          preset: correct_target
        response:
          scene_operations:
            - type: ObjectStateChange
              target: electrophoresis_black_lead
              state:
                attached: false
            - type: ObjectStateChange
              target: power_supply
              state:
                cathode_lead_attached: false
      - target: electrophoresis_red_lead
        gesture: click
        instruction: Disconnect the red anode lead.
        hint: Remove the red lead so both electrical connections are clear.
        validator:
          preset: correct_target
        response:
          scene_operations:
            - type: ObjectStateChange
              target: electrophoresis_red_lead
              state:
                attached: false
            - type: ObjectStateChange
              target: power_supply
              state:
                anode_lead_attached: false
      - target: electrophoresis_tank
        gesture: click
        instruction: Lift the tank lid after both leads are disconnected.
        hint: Power is off and both leads are removed; now open the chamber.
        validator:
          preset: correct_target
        response:
          scene_operations:
            - type: ObjectStateChange
              target: electrophoresis_tank
              state:
                lid_present: false
          feedback:
            correct: "The chamber is de-energized and open; the gel cassette can now be handled safely."
            incorrect: "Turn off the supply, disconnect both leads, then remove the tank lid."
    step_validator:
      preset: sequence_complete
    outcome:
      on_success: complete
      on_failure: retry
    next_step: remove_electrode_module
  - step_name: remove_electrode_module
    prompt:
      Lift the electrode module out of the electrophoresis tank and set it aside
      on the work surface.
    sequence:
      - target: electrode_module
        gesture: click
        instruction: Lift the electrode module out of the tank.
        hint: Set the module aside after confirming the tank no longer contains it.
        validator:
          preset: correct_target
        response:
          scene_operations:
            - type: ObjectStateChange
              target: electrode_module
              state:
                mounted: false
            - type: ObjectStateChange
              target: electrophoresis_tank
              state:
                module_present: false
    step_validator:
      preset: sequence_complete
    outcome:
      on_success: complete
      on_failure: retry
    next_step: pry_cassette_open
  - step_name: pry_cassette_open
    prompt:
      Locate the arrows on the cassette, align the gel-opening tool with an arrow,
      and use gentle downward pressure to break the seal. Do not twist the tool,
      which can crack or tear the gel.
    sequence:
      - target: gel_opening_tool
        gesture: click
        instruction: Pick up the gel-opening tool.
        hint: Align its tip with a marked cassette arrow before pressing down.
        validator:
          preset: correct_target
        response:
          scene_operations:
            - type: CursorAttach
              target: gel_opening_tool
              operation: attach
      - target: gel_cassette
        gesture: click
        instruction: Press the aligned opening tool straight down on the cassette.
        hint: Use gentle downward pressure and do not twist the tool.
        validator:
          preset: correct_target
        response:
          scene_operations:
            - type: ObjectStateChange
              target: gel_cassette
              state:
                top_plate_inserted: false
                opening_status: arrows_aligned_straight_open
            - type: CursorAttach
              target: gel_opening_tool
              operation: detach
          feedback:
            correct: "The cassette records arrow-aligned, straight opening; the gel remains supported for a gentle transfer."
            incorrect: "Align the opening tool at a marked cassette arrow and press straight down; twisting can tear the gel."
    step_validator:
      preset: sequence_complete
    outcome:
      on_success: complete
      on_failure: retry
    next_step: transfer_gel_to_staining_tray
  - step_name: transfer_gel_to_staining_tray
    prompt: Gently release the opened gel without folding or tearing it and transfer it flat into the staining tray. Keep the wells at the top and ladder in lane 5 for later comparison.
    sequence:
      - target: gel_cassette
        gesture: click
        instruction: Release the opened gel from the cassette.
        hint: Keep the gel flat and supported before moving it to the tray.
        validator:
          preset: correct_target
        response:
          scene_operations:
            - type: ObjectStateChange
              target: gel_cassette
              state:
                gel_state: separated_unstained
                gel_transfer_status: free_flat
      - target: staining_tray
        gesture: click
        instruction: Transfer the gel flat into the staining tray.
        hint: Keep the wells at the top and preserve ladder lane 5 orientation.
        validator:
          preset: correct_target
        response:
          scene_operations:
            - type: ObjectStateChange
              target: staining_tray
              state:
                gel_present: true
                gel_state: separated_unstained
                lane_pattern: samples_1_to_3_ladder_5
                orientation_status: wells_top_ladder_lane_5
            - type: SceneChange
              to_scene: staining_bench
          feedback:
            correct: "The fragile gel is free and flat in the tray; its wells-top, lane-5 ladder orientation is recorded for the workflow."
            incorrect: "Transfer the opened gel flat into the staining tray while preserving the wells-top, lane-5 ladder orientation."
    step_validator:
      preset: sequence_complete
    outcome:
      on_success: complete
      on_failure: retry
    next_step: null
