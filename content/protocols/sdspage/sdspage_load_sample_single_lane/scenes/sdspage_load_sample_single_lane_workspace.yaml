scene_name: sdspage_load_sample_single_lane_workspace
extends: electrophoresis_bench

remove_placements:
  # Keep the gel cassette, p200, loading-tip box, and waste container used by
  # this learning block. The tank and power supply remain as workstation
  # context; reagent vessels and preparation tools belong to other mini-
  # protocols and would distract from the precise lane-loading task.
  - rear_left_running_buffer_10x
  - center_running_buffer_1x_carboy
  - center_ddh2o_bottle
  - center_electrode_module
  - center_serological_pipette
  - rear_left_protein_ladder_tube
  - rear_left_recycle_buffer_bottle
  - rear_right_gel_opening_tool
  - front_left_mini_protean_gel
  - front_right_gel_comb
  - right_tool_area_p10_gel_loading_tip_box

add_placements:
  - placement_name: front_center_sds_microtube_rack
    object_name: microtube_rack_8
    zone: front_center
    depth_tier: 1
    align_stop: center
  - placement_name: right_tool_area_gel_loading_tip_box
    object_name: gel_loading_tip_box
    zone: right_tool_area
    depth_tier: 1

scene_notes: |
  Focused electrophoresis workspace for loading one denatured sample. The
  cassette and transfer supplies are primary; the tank and power supply provide
  secondary workstation context.
