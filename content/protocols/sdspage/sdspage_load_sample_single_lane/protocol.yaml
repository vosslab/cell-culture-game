protocol_type: mini_protocol
protocol_name: sdspage_load_sample_single_lane
entry_step: load_lane_one
initial_state:
  - target: electrophoresis_tank
    state: { lid_present: false, module_present: true }
  - target: electrode_module
    state: { mounted: true, cassette_mounted: true, wing_clamps_open: false }
  - target: electrophoresis_buffer_dam
    state: { seated: true }
  - target: gel_cassette
    state: { wells_rinsed: true, lane_pattern: samples_1_to_3_ladder_5 }
  - target: microtube_rack_8.slot_B1
    state: { material_name: protein_sample_denatured, material_volume: 30 }
learning:
  objectives: "Students completing this mini-protocol will have achieved a single lane-loading skill: choose a fresh gel-loading tip, set the volume, draw the sample, and dispense slowly into its assigned well."
  outcomes: "Students completing this mini-protocol will be able to eject a used tip, fit a fresh gel-loading tip, transfer 30 &micro;L of denatured sample from B1 into lane 1, and leave the pipette empty with a used tip."
  goals: "Overall, this mini-protocol aims to accomplish one meaningful loading action rather than a separate tip-swap lesson followed by a loading lesson."
steps:
  - step_name: load_lane_one
    prompt: >-
      Open the electrophoresis bench, eject the current tip, choose a fresh
      gel-loading tip, set the P200 to 30 &micro;L, draw B1, and slowly dispense it
      into lane 1. A controlled dispense protects the well from bubbles and
      splashing.
    sequence:
      - target: p200_micropipette
        gesture: click
        instruction: Open the single-lane gel-loading workspace.
        hint: Begin the B1-to-lane-1 cycle before changing the tip.
        validator: { preset: correct_target }
        response:
          scene_operations:
            - type: SceneChange
              to_scene: sdspage_load_sample_single_lane_workspace
            - type: ObjectStateChange
              target: gel_cassette.lane_1
              state: { material_name: empty, material_volume: 0 }
      - target: waste_container
        gesture: click
        instruction: Eject the used pipette tip into the waste container.
        hint: Clear the old tip before fitting a fresh gel-loading tip.
        validator: { preset: correct_target }
        response: { scene_operations: [{ type: ObjectStateChange, target: p200_micropipette, state: { held_material_name: empty, held_material_volume: 0, tip_status: none } }] }
      - target: gel_loading_tip_box
        gesture: click
        instruction: Fit a fresh gel-loading tip for B1.
        hint: Use the new tip for a controlled draw and dispense into lane 1.
        validator: { preset: correct_target }
        response: { scene_operations: [{ type: CursorAttach, target: p200_micropipette, operation: attach }, { type: ObjectStateChange, target: p200_micropipette, state: { tip_status: fresh } }], feedback: { correct: "Fresh gel-loading tip selected for B1.", incorrect: "Select a fresh gel-loading tip before drawing B1." } }
      - target: p200_micropipette
        gesture: adjust
        instruction: Set the P200 to 30 &micro;L for lane 1.
        hint: Match the fixed volume to the B1 sample transfer.
        validator: { preset: target_with_value, value: { set_volume: 30 } }
        response: { scene_operations: [{ type: ObjectStateChange, target: p200_micropipette, state: { set_volume: 30 } }] }
      - target: microtube_rack_8.slot_B1
        gesture: click
        instruction: Draw denatured sample B1 from the rack.
        hint: The P200 is ready; draw the 30 &micro;L aliquot for lane 1.
        validator: { preset: correct_target }
        response: { scene_operations: [{ type: ObjectStateChange, target: p200_micropipette, state: { held_material_name: protein_sample_denatured, held_material_volume: 30 } }, { type: ObjectStateChange, target: microtube_rack_8.slot_B1, state: { material_name: empty, material_volume: 0 } }] }
      - target: gel_cassette.lane_1
        gesture: click
        instruction: Dispense B1 slowly into gel lane 1.
        hint: Enter through the lane-1 well without pressing the tip against the bottom.
        validator: { preset: correct_target }
        response: { scene_operations: [{ type: ObjectStateChange, target: gel_cassette.lane_1, state: { material_name: protein_sample_denatured, material_volume: 30 } }, { type: ObjectStateChange, target: p200_micropipette, state: { held_material_name: empty, held_material_volume: 0, tip_status: used } }, { type: CursorAttach, target: p200_micropipette, operation: detach }] }
    step_validator: { preset: sequence_complete }
    outcome: { on_success: complete, on_failure: retry }
    next_step: null
