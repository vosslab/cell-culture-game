scene_name: sdspage_recycle_buffer_workspace
extends: electrophoresis_bench

scene_notes: |
  Electrophoresis bench workspace for buffer recycling. The whole tank remains
  rear context while enlarged foreground chamber views make each used-buffer
  transfer and the accumulating recycle-bottle volume visible. A wide-mouth
  funnel remains at the recycle bottle so the grouped apparatus drainage is a
  physically plausible laboratory action rather than an abstract bottle click.

remove_placements:
  # The tank, chamber close-ups, and recycle bottle are the complete transfer
  # system. Preparation, loading, and extraction equipment is not relevant.
  - rear_left_running_buffer_10x
  - rear_right_power_supply
  - center_running_buffer_1x_carboy
  - center_ddh2o_bottle
  - center_electrode_module
  - center_serological_pipette
  - center_p200_micropipette
  - right_tool_area_p10_gel_loading_tip_box
  - rear_left_protein_ladder_tube
  - rear_right_gel_opening_tool
  - front_left_mini_protean_gel
  - front_center_gel_cassette
  - front_center_waste_container
  - front_right_gel_comb

add_placements:
  - placement_name: rear_left_recycle_buffer_funnel
    object_name: recycle_buffer_funnel
    zone: rear_left
    depth_tier: 2
    align_stop: center
    layout:
      label_placement: bottom
  - placement_name: front_center_hazardous_liquid_waste
    object_name: hazardous_liquid_waste_container
    zone: rear_right
    depth_tier: 2
    align_stop: center
  - placement_name: front_left_electrophoresis_inner_chamber
    object_name: electrophoresis_inner_chamber
    zone: front_left
    depth_tier: 1
    align_stop: center
  - placement_name: front_right_electrophoresis_outer_chamber
    object_name: electrophoresis_outer_chamber
    zone: front_right
    depth_tier: 1
    align_stop: center
