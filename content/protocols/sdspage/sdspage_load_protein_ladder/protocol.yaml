protocol_type: mini_protocol
protocol_name: sdspage_load_protein_ladder
entry_step: rinse_wells_before_loading
initial_state:
  - target: microtube_rack_8.slot_B4
    state: { material_name: protein_ladder_denatured, material_volume: 20 }
  - target: electrophoresis_inner_chamber
    state: { material_name: running_buffer_1x, material_volume: 200, fill_state: filled }
  - target: gel_cassette
    state: { wells_rinsed: false }
learning:
  objectives:
    Students completing this mini-protocol will have achieved fluency with
    selecting the correct loading tool and reference lane, drawing a molecular
    weight standard, and carefully loading a gel well without cross-contamination.
  outcomes:
    Students completing this mini-protocol will be able to fit a fresh gel-loading
    tip, set a P200 to the fixed 20 &micro;L simulated ladder input from slot B4, and load it
    into the designated reference lane 5.
  goals:
    Overall, this mini-protocol aims to accomplish the protein ladder loading
    step for SDS-PAGE gel preparation. The ladder serves as a molecular weight reference
    standard and must be loaded into a designated lane (lane 5) to enable post-run
    analysis and band identification.
steps:
  - step_name: rinse_wells_before_loading
    scene: sdspage_load_protein_ladder_workspace
    prompt: >-
      After comb removal, fit a fresh gel-loading tip and use it to rinse the gel
      wells once with running buffer from the filled inner chamber. Discard that
      buffer-contact tip before loading the ladder.
    sequence:
      - target: gel_loading_tip_box
        gesture: click
        validator: { preset: correct_target }
        response:
          scene_operations:
            - type: CursorAttach
              target: p200_micropipette
              operation: attach
            - type: ObjectStateChange
              target: p200_micropipette
              state: { tip_status: fresh }
          feedback:
            correct: "Fresh gel-loading tip fitted for the well rinse."
            incorrect: "Fit a fresh gel-loading tip before rinsing the exposed wells."
      - target: electrophoresis_inner_chamber
        gesture: click
        validator: { preset: correct_target }
        response: { scene_operations: [] }
      - target: gel_cassette
        gesture: click
        validator: { preset: correct_target }
        response:
          scene_operations:
            - type: ObjectStateChange
              target: gel_cassette
              state: { wells_rinsed: true }
            - type: ObjectStateChange
              target: p200_micropipette
              state: { tip_status: used, held_material_name: empty, held_material_volume: 0 }
            - type: CursorAttach
              target: p200_micropipette
              operation: detach
          feedback:
            correct: "The wells are rinsed and ready; discard this buffer-contact tip before the ladder transfer."
            incorrect: "Rinse the wells once with upper-chamber running buffer before loading samples."
    step_validator: { preset: sequence_complete }
    outcome: { on_success: complete, on_failure: retry }
    next_step: load_ladder_into_lane_5
  - step_name: load_ladder_into_lane_5
    prompt:
      Fit a fresh gel-loading tip to the P200, set it to the fixed 20 &micro;L
      simulated ladder input, draw denatured ladder from rack slot B4, and slowly
      dispense it through the lane-5 well mouth without pressing the tip against
      the bottom. Bradford normalization and product-specific ladder loading volumes
      are faculty-data dependent and are not inferred by this simulation.
    sequence:
      - target: gel_loading_tip_box
        gesture: click
        validator: { preset: correct_target }
        response:
          scene_operations:
            - type: CursorAttach
              target: p200_micropipette
              operation: attach
            - type: ObjectStateChange
              target: p200_micropipette
              state: { tip_status: fresh }
      - target: p200_micropipette
        gesture: adjust
        validator: { preset: target_with_value, value: { set_volume: 20 } }
        response:
          scene_operations: [{ type: ObjectStateChange, target: p200_micropipette, state: { set_volume: 20 } }]
      - target: microtube_rack_8.slot_B4
        gesture: click
        validator: { preset: correct_target }
        response:
          scene_operations:
            - type: ObjectStateChange
              target: p200_micropipette
              state: { held_material_name: protein_ladder_denatured, held_material_volume: 20 }
            - type: ObjectStateChange
              target: microtube_rack_8.slot_B4
              state: { material_name: empty, material_volume: 0 }
      - target: gel_cassette.lane_5
        gesture: click
        validator: { preset: correct_target }
        response:
          scene_operations:
            - type: ObjectStateChange
              target: gel_cassette.lane_5
              state:
                material_name: protein_ladder_denatured
                material_volume: 20
            # This is the first actual lane-loading event.  Keep the lane map
            # with the physical gel so downstream running, staining, and
            # interpretation inherit it rather than fabricating it post-run.
            - type: ObjectStateChange
              target: gel_cassette
              state: { lane_pattern: samples_1_to_3_ladder_5 }
            - type: ObjectStateChange
              target: p200_micropipette
              state:
                held_material_name: empty
                held_material_volume: 0
                tip_status: used
            - type: CursorAttach
              target: p200_micropipette
              operation: detach
          feedback:
            correct: "Lane 5 now contains the molecular-weight reference for interpreting the sample lanes after staining."
            incorrect: "Load the denatured ladder into the highlighted lane 5 well."
    step_validator: { preset: sequence_complete }
    outcome: { on_success: complete, on_failure: retry }
    next_step: null
