protocol_type: mini_protocol
protocol_name: sdspage_prepare_gel_cassette
entry_step: unpack_cassette
learning:
  objectives:
    Students completing this mini-protocol will have achieved fluency with
    preparing a precast gel cassette for mounting without confusing cassette handling
    with the later clamping and buffer-seal steps.
  outcomes:
    Students completing this mini-protocol will be able to remove a precast gel
    from its package, remove the bottom tape, remove the comb straight upward, and
    recognize the exposed wells as ready for rinsing and sample loading.
  goals:
    Overall, this mini-protocol aims to accomplish making the gel cassette ready
    for correct orientation and gasket sealing in the electrode module.
steps:
  - step_name: unpack_cassette
    prompt: Open the Mini-PROTEAN gel package and place the cassette on the bench.
    sequence:
      - target: mini_protean_gel
        gesture: click
        instruction: Open the Mini-PROTEAN gel package.
        hint: Expose the cassette so it can be placed on the bench.
        validator:
          preset: correct_target
        response:
          scene_operations:
            - type: SceneChange
              to_scene: sdspage_prepare_gel_cassette_workspace
            - type: ObjectStateChange
              target: mini_protean_gel
              state:
                sealed: false
          feedback:
            correct: The cassette is out of its protective package.
            incorrect: Open the sealed gel package first.
    step_validator:
      preset: sequence_complete
    outcome:
      on_success: complete
      on_failure: retry
    next_step: remove_bottom_tape
  - step_name: remove_bottom_tape
    prompt:
      Remove the protective tape from the bottom of the cassette before mounting it.
    sequence:
      - target: gel_cassette
        gesture: click
        instruction: Remove the protective tape from the cassette bottom.
        hint: Strip the tape before mounting the cassette in the electrode module.
        validator:
          preset: correct_target
        response:
          scene_operations:
            - type: ObjectStateChange
              target: gel_cassette
              state:
                tape_present: false
          feedback:
            correct: The cassette bottom is exposed for buffer contact.
            incorrect: Remove the bottom tape from the cassette.
    step_validator:
      preset: sequence_complete
    outcome:
      on_success: complete
      on_failure: retry
    next_step: remove_comb
  - step_name: remove_comb
    prompt:
      Pull the comb straight upward to expose the wells. Rinse the wells with running
      buffer after the cassette is mounted and the upper chamber has passed its leak check.
    sequence:
      - target: gel_comb
        gesture: click
        instruction: Pull the gel comb straight upward.
        hint: Expose the wells without tilting or damaging the cassette.
        validator:
          preset: correct_target
        response:
          scene_operations:
            - type: ObjectStateChange
              target: gel_cassette
              state:
                comb_present: false
            - type: ObjectStateChange
              target: gel_comb
              state:
                position: not_in_cassette
          feedback:
            correct: The well openings are exposed and ready for the mounted-apparatus rinse.
            incorrect: Pull the gel comb straight up from the cassette.
    step_validator:
      preset: sequence_complete
    outcome:
      on_success: complete
      on_failure: retry
    next_step: null
