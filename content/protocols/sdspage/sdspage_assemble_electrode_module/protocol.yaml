protocol_type: mini_protocol
protocol_name: sdspage_assemble_electrode_module
entry_step: seat_cassette_and_buffer_dam
initial_state:
  # A lid is intentionally absent while the module is assembled and the tank is
  # filled.  The lid is attached only after the gel has been loaded.
  - target: electrophoresis_tank
    state: { lid_present: false, module_present: false }
learning:
  objectives:
    Students completing this mini-protocol will have achieved fluency with
    assembling one gel cassette and a buffer dam into a Mini-PROTEAN electrode module.
  outcomes:
    Students completing this mini-protocol will be able to orient the cassette's
    short plate toward the module gasket, pair one cassette with a buffer dam, close
    the clamping frame to make a leakproof upper chamber, and dock the assembly in its tank.
  goals:
    Overall, this mini-protocol aims to accomplish creating one physically coherent,
    sealed electrophoresis apparatus before buffer filling and sample loading.
steps:
  - step_name: seat_cassette_and_buffer_dam
    prompt:
      Open the electrode-module frame, then seat the gel cassette with its short plate
      facing inward against the gasket. Install the buffer dam in the other position;
      a one-gel run needs the dam to close the upper buffer chamber.
    sequence:
      - target: electrode_module
        gesture: click
        instruction: Open the electrode-module frame.
        hint: Bring the assembly workspace into view before seating the cassette.
        validator:
          preset: correct_target
        response:
          scene_operations:
            - type: SceneChange
              to_scene: sdspage_assemble_electrode_module_workspace
            - type: ObjectStateChange
              target: electrode_module
              state:
                wing_clamps_open: true
      - target: gel_cassette
        gesture: click
        instruction: Seat the gel cassette with its short plate against the gasket.
        hint: Align the short plate inward so the cassette seals the upper chamber.
        validator:
          preset: correct_target
        response:
          scene_operations:
            - type: ObjectStateChange
              target: electrode_module
              state:
                cassette_mounted: true
      - target: electrophoresis_buffer_dam
        gesture: click
        instruction: Install the buffer dam in the open module position.
        hint: The dam closes the upper chamber for this one-gel run.
        validator:
          preset: correct_target
        response:
          scene_operations:
            - type: ObjectStateChange
              target: electrophoresis_buffer_dam
              state:
                seated: true
          feedback:
            correct: One cassette and one buffer dam now define the two sides of the upper chamber.
            incorrect: Install the buffer dam opposite the gel cassette.
    step_validator:
      preset: sequence_complete
    outcome:
      on_success: complete
      on_failure: retry
    next_step: close_clamping_frame
  - step_name: close_clamping_frame
    prompt:
      Close both wing clamps. The frame presses the cassette short plate and buffer dam
      against the gasket to make a leakproof upper buffer chamber; it does not make the
      electrical connection.
    sequence:
      - target: electrode_module
        gesture: click
        instruction: Close both wing clamps on the electrode module.
        hint: Clamp the cassette and dam against the gasket to make a leakproof chamber.
        validator:
          preset: correct_target
        response:
          scene_operations:
            - type: ObjectStateChange
              target: electrode_module
              state:
                wing_clamps_open: false
            - type: ObjectStateChange
              target: gel_cassette
              state:
                wing_clamps_locked: true
          feedback:
            correct: The gasket seal is ready for the upper-chamber leak check.
            incorrect: Close the electrode-module wing clamps.
    step_validator:
      preset: sequence_complete
    outcome:
      on_success: complete
      on_failure: retry
    next_step: dock_module_in_tank
  - step_name: dock_module_in_tank
    prompt:
      Lower the sealed electrode module into the electrophoresis tank, aligning the
      banana plugs with the matching tank contacts.
    sequence:
      - target: electrophoresis_tank
        gesture: click
        instruction: Lower the sealed module into the electrophoresis tank.
        hint: Align the banana plugs with the matching tank contacts.
        validator:
          preset: correct_target
        response:
          scene_operations:
            - type: ObjectStateChange
              target: electrode_module
              state:
                mounted: true
            - type: ObjectStateChange
              target: electrophoresis_tank
              state:
                module_present: true
                lid_present: false
          feedback:
            correct: The gel, buffer dam, and electrode module are docked as one apparatus.
            incorrect: Dock the sealed electrode module in the tank.
    step_validator:
      preset: sequence_complete
    outcome:
      on_success: complete
      on_failure: retry
    next_step: null
