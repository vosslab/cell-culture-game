protocol_type: mini_protocol
protocol_name: sdspage_stain_gel
entry_step: rinse_tray
initial_state:
  - target: staining_tray
    state: { material_name: empty, material_volume: 0, gel_present: true, gel_state: separated_unstained, lane_pattern: samples_1_to_3_ladder_5 }
  - target: ddh2o_bottle
    state: { material_name: ddh2o, material_volume: 700 }
  - target: coomassie_stain_bottle
    state: { material_name: coomassie_stain, material_volume: 250, label_status: coomassie_stock }
learning:
  objectives:
    Students completing this mini-protocol will have achieved fluency with
    staining tray handling, pouring and discarding rinses, adding Coomassie stain
    solution, microwave heating for fixed duration, rocking shaker operation for timed
    incubation, and recovery of used stain for recycling.
  outcomes:
    Students completing this mini-protocol will be able to rinse a staining
    tray with ddH2O, pour Coomassie stain into the tray, heat the stain-loaded tray
    in a microwave for 50 seconds, transfer the tray to a rocking shaker for 7-minute
    incubation, and recover the used stain into a recycle bottle.
  goals:
    "Overall, this mini-protocol aims to accomplish the Coomassie staining phase
    of SDS-PAGE protein visualization: coating the gel with stain, heating to accelerate
    dye binding, and agitated incubation to distribute stain evenly while collecting
    spent stain for reuse."
steps:
  - step_name: rinse_tray
    prompt:
      Rinse the tray while the gel stays flat in it. Pour water around, not onto, the
      gel, then discard only the rinse to the waste container.
    sequence:
      - target: staining_tray
        gesture: click
        instruction: Open the staining-bench workspace with the gel tray.
        hint: Keep the gel flat while preparing its water rinse.
        validator:
          preset: correct_target
        response:
          scene_operations:
            - type: SceneChange
              to_scene: sdspage_stain_gel_workspace
      - target: ddh2o_bottle
        gesture: click
        instruction: Add water around the gel for the rinse.
        hint: Pour around the flat gel rather than directly onto it.
        validator:
          preset: correct_target
        response:
          scene_operations:
            - type: ObjectStateChange
              target: staining_tray
              state:
                material_name: ddh2o
                material_volume: 200
            - type: ObjectStateChange
              target: ddh2o_bottle
              state:
                material_name: ddh2o
                material_volume: 500
      - target: waste_container
        gesture: click
        instruction: Discard the water rinse in the waste container.
        hint: Remove only the rinse and keep the gel flat in its tray.
        validator:
          preset: correct_target
        response:
          scene_operations:
            - type: ObjectStateChange
              target: staining_tray
              state:
                material_name: empty
                material_volume: 0
            - type: ObjectStateChange
              target: waste_container
              state:
                material_name: mixed
                material_volume: 200
    step_validator:
      preset: sequence_complete
    outcome:
      on_success: complete
      on_failure: retry
    next_step: add_stain
  - step_name: add_stain
    prompt: Add enough Coomassie stain to cover the gel by about 1.5 cm. The tray should visibly contain stain while the gel is immersed.
    sequence:
      - target: coomassie_stain_bottle
        gesture: click
        instruction: Pour Coomassie stain into the staining tray.
        hint: Add enough solution to cover the gel by about 1.5 cm.
        validator:
          preset: correct_target
        response:
          scene_operations:
            - type: ObjectStateChange
              target: staining_tray
              state:
                material_name: coomassie_stain
                material_volume: 250
                gel_state: stained
                lane_pattern: samples_1_to_3_ladder_5
                coverage_depth_cm: 1.5
            - type: ObjectStateChange
              target: coomassie_stain_bottle
              state:
                material_name: empty
                material_volume: 0
          feedback:
            correct: "The gel remains oriented in the tray and is visibly covered by 1.5 cm of Coomassie stain."
            incorrect: "Add the Coomassie stain to the rinsed tray."
    step_validator:
      preset: sequence_complete
    outcome:
      on_success: complete
      on_failure: retry
    next_step: microwave_stain
  - step_name: microwave_stain
    prompt:
      Place the staining tray in the microwave. Set the timer for 50 seconds and
      start heating to accelerate stain binding. Stop if stain starts to boil; handle
      heated stain only with the course-approved ventilation and local SOP.
    sequence:
      - target: microwave
        gesture: click
        instruction: Place the staining tray inside the microwave.
        hint: Start by seating the covered tray before setting the timer.
        validator:
          preset: correct_target
        response:
          scene_operations:
            - type: ObjectStateChange
              target: microwave
              state:
                set_time_s: 50
      - target: microwave
        gesture: click
        instruction: Start the microwave heating cycle.
        hint: The tray is loaded and the timer is set; begin the short heating interval.
        validator:
          preset: correct_target
        response:
          scene_operations:
            - type: ObjectStateChange
              target: microwave
              state:
                running: true
      - target: microwave
        gesture: click
        instruction: Wait for the 50-second stain-heating interval to finish.
        hint: The heating cycle is running; wait for its fixed endpoint before rocking.
        validator:
          preset: correct_target
        response:
          scene_operations:
            - type: TimedWait
              target: microwave
              duration_min: 0.833
              display: Heating stain
            - type: ObjectStateChange
              target: microwave
              state:
                running: false
                heating_outcome: heated_without_boiling
          feedback:
            correct: "Heating is complete without boiling; transfer the covered gel to gentle rocking."
            incorrect: "Set the microwave timer and start the short stain-heating interval."
    step_validator:
      preset: sequence_complete
    outcome:
      on_success: complete
      on_failure: retry
    next_step: transfer_to_rocker
  - step_name: transfer_to_rocker
    prompt:
      Transfer the staining tray to the rocking shaker. Set 7 minutes and start gentle rocking; high speed can slosh stain out of the tray.
    sequence:
      - target: staining_tray
        gesture: click
        instruction: Transfer the stained tray to the rocking shaker.
        hint: Move the covered gel to the shaker before setting the rocking timer.
        validator:
          preset: correct_target
        response:
          scene_operations:
            - type: ObjectStateChange
              target: rocking_shaker
              state:
                tray_present: true
      - target: rocking_shaker
        gesture: click
        instruction: Set the rocking shaker to 7 minutes.
        hint: The tray is in place; enter the fixed gentle-rocking duration.
        validator:
          preset: correct_target
        response:
          scene_operations:
            - type: ObjectStateChange
              target: rocking_shaker
              state:
                set_time_min: 7
      - target: rocking_shaker
        gesture: click
        instruction: Start gentle rocking.
        hint: The timer is set; begin agitation at the configured speed.
        validator:
          preset: correct_target
        response:
          scene_operations:
            - type: ObjectStateChange
              target: rocking_shaker
              state:
                running: true
      - target: rocking_shaker
        gesture: click
        instruction: Wait for the 7-minute rocking cycle to finish.
        hint: The shaker is running; let the timed incubation complete.
        validator:
          preset: correct_target
        response:
          scene_operations:
            - type: TimedWait
              target: rocking_shaker
              duration_min: 7
              display: Rocking stain
            - type: ObjectStateChange
              target: rocking_shaker
              state:
                running: false
          feedback:
            correct: "Gentle rocking distributed stain across the immersed gel. The used stain can now be recovered and labeled."
            incorrect: "Set the rocking time and start gentle agitation."
    step_validator:
      preset: sequence_complete
    outcome:
      on_success: complete
      on_failure: retry
    next_step: recover_stain
  - step_name: recover_stain
    prompt:
      Recover the used stain in the Coomassie recycle bottle. Confirm its fixed-course
      label records used Coomassie stain, today's laboratory date, and the course/batch;
      then cap it and return it to designated stain storage. Retain the gel in the tray
      for its two water rinses before destaining.
    sequence:
      - target: coomassie_recycle_bottle
        gesture: click
        instruction: Recover the used Coomassie stain in its recycle bottle.
        hint: Verify the fixed-course label, closed cap, and designated storage state.
        validator:
          preset: correct_target
        response:
          scene_operations:
            - type: ObjectStateChange
              target: coomassie_recycle_bottle
              state:
                material_name: coomassie_stain_used
                material_volume: 250
                label_status: coomassie_recycle_complete
                stain_identity_status: used_coomassie_stain
                date_status: date_recorded
                course_batch_status: course_batch_recorded
                cap_status: closed
                storage_status: designated_stain_storage
            - type: ObjectStateChange
              target: staining_tray
              state:
                material_name: empty
                material_volume: 0
          feedback:
            correct: "Used Coomassie is recovered with its identity, date, and course/batch recorded; the bottle is capped in designated stain storage, and the gel remains in the tray for its next rinse."
            incorrect: "Recover the used stain in the Coomassie recycle bottle, then verify the visible label, closed cap, and designated storage state."
    step_validator:
      preset: sequence_complete
    outcome:
      on_success: complete
      on_failure: retry
    next_step: null
