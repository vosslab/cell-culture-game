protocol_type: mini_protocol
protocol_name: sdspage_heat_denature_samples
entry_step: denature_samples
initial_state:
  - target: microtube_rack_8.slot_B1
    state: { material_name: protein_sample_mixed, material_volume: 30 }
  - target: microtube_rack_8.slot_B2
    state: { material_name: protein_sample_mixed, material_volume: 30 }
  - target: microtube_rack_8.slot_B3
    state: { material_name: protein_sample_mixed, material_volume: 30 }
  - target: microtube_rack_8.slot_B4
    state: { material_name: protein_ladder, material_volume: 20 }
learning:
  objectives:
    Students completing this mini-protocol will have achieved fluency with
    using a heat block for thermal protein denaturation at a fixed temperature and
    managing incubation timing.
  outcomes:
    Students completing this mini-protocol will be able to load sample tubes
    into a pre-set heat block, incubate at 95 degrees Celsius for 5 minutes, and retrieve
    denatured samples for downstream analysis.
  goals:
    Overall, this mini-protocol aims to accomplish thermal denaturation of protein
    samples mixed with reducing agent (BME) and buffer, preparing them for SDS-PAGE
    electrophoresis.
steps:
  - step_name: denature_samples
    prompt: Open the pre-set 95 C heat block, place the rack containing the three prepared samples and molecular-weight ladder inside, then close the lid and start the 5-minute denaturation. The temperature is supplied by the heat block; this step teaches safe staging and timed denaturation, not a hidden set-point control.
    sequence:
      - target: heat_block
        gesture: click
        validator:
          preset: correct_target
        response:
          scene_operations:
            - type: SceneChange
              to_scene: sdspage_heat_denature_samples_workspace
            - type: ObjectStateChange
              target: heat_block
              state:
                lid_open: true
      - target: microtube_rack_8
        gesture: click
        validator:
          preset: correct_target
        response:
          scene_operations:
            - type: ObjectStateChange
              target: heat_block
              state:
                rack_present: true
      - target: heat_block
        gesture: click
        validator:
          preset: correct_target
        response:
          scene_operations:
            - type: ObjectStateChange
              target: heat_block
              state:
                lid_open: false
            - type: TimedWait
              target: heat_block
              duration_min: 5
              display: Denaturing samples at 95 C
            - type: ObjectStateChange
              target: microtube_rack_8.slot_B1
              state: { material_name: protein_sample_denatured, material_volume: 30 }
            - type: ObjectStateChange
              target: microtube_rack_8.slot_B2
              state: { material_name: protein_sample_denatured, material_volume: 30 }
            - type: ObjectStateChange
              target: microtube_rack_8.slot_B3
              state: { material_name: protein_sample_denatured, material_volume: 30 }
            - type: ObjectStateChange
              target: microtube_rack_8.slot_B4
              state: { material_name: protein_ladder_denatured, material_volume: 20 }
          feedback:
            correct: "All four tubes were heated together at 95 C for 5 minutes; SDS and reducing agent now support size-based migration."
            incorrect: "Stage the sample rack in the open heat block, then close it to begin the timed denaturation."
    step_validator:
      preset: sequence_complete
    outcome:
      on_success: complete
      on_failure: retry
    next_step: retrieve_denatured_rack
  - step_name: retrieve_denatured_rack
    prompt: After the timed incubation, open the lid and retrieve the denatured sample rack for immediate gel loading. Keep the labeled tubes together so lane identity is preserved.
    sequence:
      - target: heat_block
        gesture: click
        validator:
          preset: correct_target
        response:
          scene_operations:
            - type: ObjectStateChange
              target: heat_block
              state:
                lid_open: true
      - target: microtube_rack_8
        gesture: click
        validator:
          preset: correct_target
        response:
          scene_operations:
            - type: ObjectStateChange
              target: heat_block
              state:
                rack_present: false
          feedback:
            correct: "The denatured, labeled samples and ladder are ready for their assigned wells."
            incorrect: "Open the heat block, then remove the rack as one labeled set."
    step_validator:
      preset: sequence_complete
    outcome:
      on_success: complete
      on_failure: retry
    next_step: null
