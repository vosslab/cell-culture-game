protocol_type: mini_protocol
protocol_name: sdspage_prepare_running_buffer
entry_step: combine_concentrate_and_water
initial_state:
  - target: running_buffer_preparation_carboy
    state: { material_name: empty, material_volume: 0 }
  - target: running_buffer_10x_bottle
    state: { material_name: running_buffer_10x, material_volume: 500 }
  - target: ddh2o_carboy
    state: { material_name: ddh2o, material_volume: 1000 }
learning:
  objectives:
    Students completing this mini-protocol will have achieved fluency with
    calculating and preparing a bulk 1x working buffer from a 10x concentrate.
  outcomes:
    Students completing this mini-protocol will be able to combine 100 mL of
    10x Tris/Glycine/SDS concentrate with 900 mL of deionized water in a 1 L carboy
    and confirm the final 1 L volume and 1x identity.
  goals:
    Overall, this mini-protocol aims to accomplish preparing the working running
    buffer that conducts current through the electrophoresis apparatus.
steps:
  - step_name: combine_concentrate_and_water
    prompt: |
      Prepare 1 L of 1x running buffer: transfer 100 mL of 10x concentrate into
      the labeled 1 L carboy, then add deionized water to the 1 L mark (900 mL).
      This is a bulk preparation, not a 25 mL pipette-setpoint exercise.
    sequence:
      - target: running_buffer_10x_bottle
        gesture: click
        instruction: Pick up the 10x running-buffer concentrate.
        hint: Draw the bulk concentrate for the labeled 1 L carboy.
        validator:
          preset: correct_target
        response:
          scene_operations:
            - type: SceneChange
              to_scene: sdspage_prepare_running_buffer_workspace
            - type: CursorAttach
              target: running_buffer_10x_bottle
              operation: attach
      - target: running_buffer_preparation_carboy
        gesture: click
        instruction: Transfer the 100 mL 10x concentrate into the labeled 1 L carboy.
        hint: Use the carboy first to receive the concentrate.
        validator:
          preset: correct_target
        response:
          scene_operations:
            - type: ObjectStateChange
              target: running_buffer_10x_bottle
              state:
                material_name: running_buffer_10x
                material_volume: 400
            - type: ObjectStateChange
              target: running_buffer_preparation_carboy
              state:
                material_name: running_buffer_10x
                material_volume: 100
            - type: CursorAttach
              target: running_buffer_10x_bottle
              operation: detach
      - target: ddh2o_carboy
        gesture: click
        instruction: Pick up the deionized-water carboy.
        hint: Prepare water for the final 1 L fill after adding concentrate.
        validator:
          preset: correct_target
        response:
          scene_operations:
            - type: CursorAttach
              target: ddh2o_carboy
              operation: attach
      - target: running_buffer_preparation_carboy
        gesture: click
        instruction: Add ddH2O to the 1 L mark in the carboy.
        hint: The concentrate is already inside; top up with 900 mL water.
        validator:
          preset: correct_target
        response:
          scene_operations:
            - type: ObjectStateChange
              target: ddh2o_carboy
              state:
                material_name: ddh2o
                material_volume: 100
            - type: ObjectStateChange
              target: running_buffer_preparation_carboy
              state:
                material_name: running_buffer_1x
                material_volume: 1000
            - type: CursorAttach
              target: ddh2o_carboy
              operation: detach
          feedback:
            correct: The carboy now contains 1 L of 1x Tris/Glycine/SDS running buffer.
            incorrect: Transfer the 10x concentrate before adding water to the final mark.
    step_validator:
      preset: sequence_complete
    outcome:
      on_success: complete
      on_failure: retry
    next_step: null
