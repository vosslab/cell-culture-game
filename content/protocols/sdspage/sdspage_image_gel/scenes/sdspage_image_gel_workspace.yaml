scene_name: sdspage_image_gel_workspace
extends: imaging_bench

remove_placements:
  # Imaging uses the rinsed tray, ddH2O context, waste, and lightbox. Staining
  # reagents and sample-preparation tools are intentionally absent.
  - rear_coomassie
  - rear_destain
  - rear_ethanol_bottle
  - rear_center_rocking_shaker
  - rear_tip_box
  - rear_microtube_rack
  - left_microtube

add_placements:
  - placement_name: front_left_gel_conclusion_expected_band
    object_name: gel_conclusion_expected_band
    zone: left_tool_area
    depth_tier: 1
    align_stop: center
  - placement_name: front_right_gel_conclusion_nonspecific_bands
    object_name: gel_conclusion_nonspecific_bands
    zone: right_tool_area
    depth_tier: 1
    align_stop: left

scene_notes: |
  Focused final-rinse and lightbox workspace. The tray and lightbox dominate;
  water and waste remain as the only secondary supplies.
