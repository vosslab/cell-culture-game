scene_name: sdspage_image_gel_result_review
extends: imaging_bench

remove_placements:
  - center_lightbox
  - center_staining_tray
  - rear_coomassie
  - rear_destain
  - center_ddh2o_bottle
  - rear_ethanol_bottle
  - rear_center_rocking_shaker
  - rear_tip_box
  - rear_microtube_rack
  - left_microtube
  - right_waste_container

add_placements:
  - placement_name: center_gel_image_results_display
    object_name: gel_image_results_display
    zone: center
    depth_tier: 1
    align_stop: center

  - placement_name: rear_center_captured_lightbox
    object_name: lightbox
    zone: rear_center
    depth_tier: 1
    align_stop: left

  - placement_name: rear_right_oriented_staining_tray
    object_name: staining_tray
    zone: rear_right
    depth_tier: 1
    align_stop: center

  - placement_name: front_left_gel_conclusion_expected_band
    object_name: gel_conclusion_expected_band
    zone: left_tool_area
    depth_tier: 1
    align_stop: center

  - placement_name: front_right_gel_conclusion_nonspecific_bands
    object_name: gel_conclusion_nonspecific_bands
    zone: right_tool_area
    depth_tier: 1
    align_stop: center

scene_notes: |
  The captured lightbox and oriented tray remain visible while a readable
  lane-resolved result presents lanes 1-3, ladder lane 5, the 24-28 kDa band,
  capture metadata, orientation, and image quality before the two scientific
  conclusions are offered.
