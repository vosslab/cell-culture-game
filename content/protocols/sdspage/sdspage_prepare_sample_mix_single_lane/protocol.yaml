protocol_type: mini_protocol
protocol_name: sdspage_prepare_sample_mix_single_lane
entry_step: add_protein_sample
initial_state:
  - target: protein_sample_tube
    state: { material_name: protein_sample_raw, material_volume: 21 }
  - target: laemmli_4x_tube
    state: { material_name: laemmli_4x, material_volume: 1.0 }
  - target: bme_tube
    state: { material_name: bme, material_volume: 1.0 }
learning:
  objectives:
    Students completing this mini-protocol will have achieved fluency with
    precise liquid transfer using a micropipette, sequential reagent mixing for protein
    sample preparation, and hazard awareness when working with volatile reducing agents.
  outcomes:
    Students completing this mini-protocol will be able to accurately measure
    and transfer three distinct volumes (21 &micro;L protein, 7.5 &micro;L Laemmli
    buffer, 1.5 &micro;L beta-mercaptoethanol) into a single tube, combine them in
    the correct sequence to create a denaturation cocktail, and safely handle volatile
    reducing agents in a fume hood.
  goals:
    Overall, this mini-protocol aims to accomplish the protein sample denaturation
    mix preparation for one lane of an SDS-PAGE gel (Part 1, action map P1.1-P1.9
    single-lane slice). The three-component mix (protein sample, 4x Laemmli buffer,
    and beta-mercaptoethanol) is the foundational preparation step that enables the
    protein denaturation heating phase (MP-4). This mini-protocol establishes the
    core micropipette-transfer and sequential-mixing workflow that repeats three times
    in the full batch preparation (MP-3).
steps:
  - step_name: add_protein_sample
    prompt: >-
      Use the previously calculated 21 &micro;L worked-example loading volume: set
      the P200 to 21 &micro;L, draw protein sample from its tube, and dispense it
      into the empty microtube.
    sequence:
      - target: p200_micropipette
        gesture: click
        instruction: Open the single-lane sample-mix workspace.
        hint: Begin the worked protein-sample transfer into B1.
        validator:
          preset: correct_target
        response:
          scene_operations:
            - type: SceneChange
              to_scene: sdspage_prepare_sample_mix_single_lane_workspace
      - target: micropipette_tip_box
        gesture: click
        instruction: Fit a fresh tip for the protein sample transfer.
        hint: Use a clean tip before drawing the 21 &micro;L sample aliquot.
        validator: { preset: correct_target }
        response:
          scene_operations:
            - type: ObjectStateChange
              target: p200_micropipette
              state: { tip_status: fresh }
          feedback:
            correct: "Fresh tip fitted for the protein sample source."
            incorrect: "Use a fresh tip before drawing protein; a used tip can contaminate the next source."
      - target: p200_micropipette
        gesture: adjust
        instruction: Set the P200 to 21 &micro;L.
        hint: Use the 21 &micro;L setpoint to transfer the worked-example protein aliquot accurately.
        validator:
          preset: target_with_value
          value:
            set_volume: 21
        response:
          scene_operations:
            - type: ObjectStateChange
              target: p200_micropipette
              state:
                set_volume: 21
      - target: protein_sample_tube
        gesture: click
        instruction: Draw protein sample from its source tube.
        hint: The P200 is set to the worked-example volume for B1.
        validator:
          preset: correct_target
        response:
          scene_operations:
            - type: ObjectStateChange
              target: protein_sample_tube
              state:
                material_name: empty
                material_volume: 0
            - type: ObjectStateChange
              target: p200_micropipette
              state:
                held_material_name: protein_sample_raw
                held_material_volume: 21
      - target: microtube_rack_8.slot_B1
        gesture: click
        instruction: Dispense protein sample into rack slot B1.
        hint: Release the aliquot into the empty microtube before adding buffer.
        validator:
          preset: correct_target
        response:
          scene_operations:
            - type: ObjectStateChange
              target: microtube_rack_8.slot_B1
              state:
                material_name: protein_sample_raw
                material_volume: 21
            - type: ObjectStateChange
              target: p200_micropipette
              state:
                held_material_name: empty
                held_material_volume: 0
                tip_status: used
    step_validator:
      preset: sequence_complete
    outcome:
      on_success: complete
      on_failure: retry
    next_step: add_laemmli_buffer
  - step_name: add_laemmli_buffer
    prompt:
      Set the P20 to 7.5 &micro;L, draw 4x Laemmli sample buffer, and dispense it
      into the microtube containing protein. This produces 1x Laemmli in the
      final 30 &micro;L mixture.
    sequence:
      - target: micropipette_tip_box
        gesture: click
        instruction: Fit a fresh tip for the Laemmli transfer.
        hint: Replace the sample tip before drawing 4x Laemmli buffer.
        validator: { preset: correct_target }
        response:
          scene_operations:
            - type: ObjectStateChange
              target: p20_micropipette
              state: { tip_status: fresh }
          feedback:
            correct: "Fresh tip fitted for the Laemmli source."
            incorrect: "Use a fresh tip before Laemmli to prevent protein carry-over into the reagent stock."
      - target: p20_micropipette
        gesture: adjust
        instruction: Set the P20 to 7.5 &micro;L.
        hint: This setpoint adds the 4x Laemmli volume needed for a 1x final buffer concentration.
        validator:
          preset: target_with_value
          value:
            set_volume: 7.5
        response:
          scene_operations:
            - type: ObjectStateChange
              target: p20_micropipette
              state:
                set_volume: 7.5
      - target: laemmli_4x_tube
        gesture: click
        instruction: Draw 7.5 &micro;L of 4x Laemmli buffer.
        hint: Use the P20 setpoint and draw from the Laemmli source tube.
        validator:
          preset: correct_target
        response:
          scene_operations:
            - type: ObjectStateChange
              target: laemmli_4x_tube
              state:
                material_name: laemmli_4x
                material_volume: 0.9925
            - type: ObjectStateChange
              target: p20_micropipette
              state:
                held_material_name: laemmli_4x
                held_material_volume: 7.5
      - target: microtube_rack_8.slot_B1
        gesture: click
        instruction: Dispense Laemmli buffer into rack slot B1.
        hint: Add the buffer to the tube that already contains protein sample.
        validator:
          preset: correct_target
        response:
          scene_operations:
            - type: ObjectStateChange
              target: microtube_rack_8.slot_B1
              state:
                material_name: protein_sample_mixed
                material_volume: 28.5
            - type: ObjectStateChange
              target: p20_micropipette
              state:
                held_material_name: empty
                held_material_volume: 0
                tip_status: used
    step_validator:
      preset: sequence_complete
    outcome:
      on_success: complete
      on_failure: retry
    next_step: add_bme
  - step_name: add_bme
    prompt:
      "Caution: beta-mercaptoethanol is volatile and toxic. BME is prepared and
      handled in a fume hood in the physical laboratory. Set the P10 to 1.5
      &micro;L, draw 1.5 &micro;L from the hood-prepared BME tube, and dispense it into
      the microtube."
    sequence:
      - target: micropipette_tip_box
        gesture: click
        instruction: Fit a fresh tip for the BME transfer.
        hint: Use a clean tip after the Laemmli addition and remain in the hood.
        validator: { preset: correct_target }
        response:
          scene_operations:
            - type: ObjectStateChange
              target: p10_micropipette
              state: { tip_status: fresh }
          feedback:
            correct: "Fresh tip fitted for the BME source."
            incorrect: "Use a fresh tip before BME to prevent sample carry-over and keep the reagent source clean."
      - target: p10_micropipette
        gesture: adjust
        instruction: Set the P10 to 1.5 &micro;L.
        hint: Use this setpoint to add the prepared reducing-agent aliquot and bring the mix to 30 &micro;L.
        validator:
          preset: target_with_value
          value:
            set_volume: 1.5
        response:
          scene_operations:
            - type: ObjectStateChange
              target: p10_micropipette
              state:
                set_volume: 1.5
      - target: bme_tube
        gesture: click
        instruction: Draw 1.5 &micro;L BME from the hood-prepared tube.
        hint: Keep BME handling in the hood and use the P10 setpoint.
        validator:
          preset: correct_target
        response:
          scene_operations:
            - type: ObjectStateChange
              target: bme_tube
              state:
                material_name: bme
                material_volume: 0.9985
            - type: ObjectStateChange
              target: p10_micropipette
              state:
                held_material_name: bme
                held_material_volume: 1.5
      - target: microtube_rack_8.slot_B1
        gesture: click
        instruction: Dispense BME into rack slot B1.
        hint: Add BME to complete the 30 &micro;L sample mix.
        validator:
          preset: correct_target
        response:
          scene_operations:
            - type: ObjectStateChange
              target: microtube_rack_8.slot_B1
              state:
                material_name: protein_sample_mixed
                material_volume: 30
            - type: ObjectStateChange
              target: p10_micropipette
              state:
                held_material_name: empty
                held_material_volume: 0
                tip_status: used
    step_validator:
      preset: sequence_complete
    outcome:
      on_success: complete
      on_failure: retry
    next_step: cap_and_rack
  - step_name: cap_and_rack
    prompt:
      Cap the microtube and place it in the microtube rack for the next heating
      step.
    sequence:
      - target: microtube_rack_8.slot_B1
        gesture: click
        instruction: Cap the completed B1 sample and rack it for heating.
        hint: Keep the labeled tube with the other prepared samples for the next step.
        validator:
          preset: correct_target
        response:
          scene_operations:
            - type: ObjectStateChange
              target: microtube_rack_8.slot_B1
              state: { cap_status: closed, label_status: lane_assigned }
          feedback:
            correct: "Tube B1 is capped and visibly assigned to its gel lane for the heating handoff."
            incorrect: "Cap and label the completed sample tube before heating."
    step_validator:
      preset: sequence_complete
    outcome:
      on_success: complete
      on_failure: retry
    next_step: null
