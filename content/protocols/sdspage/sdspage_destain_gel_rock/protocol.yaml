protocol_type: mini_protocol
protocol_name: sdspage_destain_gel_rock
entry_step: rock_run
initial_state:
  - target: staining_tray
    state: { material_name: destain, material_volume: 250, gel_present: true, gel_state: destaining, lane_pattern: samples_1_to_3_ladder_5 }
learning:
  objectives:
    Students completing this mini-protocol will have achieved proficiency
    with running a rocking shaker for gel destaining, managing timed incubation phases,
    and proper disposal of used staining reagents.
  outcomes:
    Students completing this mini-protocol will be able to set up and run
    a 10-minute rocking cycle for gel destaining, remove supporting materials from
    the staining tray, and safely dispose of used destain solution into a waste container.
  goals:
    Overall, this mini-protocol aims to accomplish the core mechanical destaining
    phase of SDS-PAGE gel processing -- running the rocking shaker to gently agitate
    the gel in destain solution, then retrieving the tray and disposing the spent
    reagent.
steps:
  - step_name: rock_run
    prompt:
      Start the rocking shaker to destain the gel. Set the rocking shaker time
      to 10 minutes, then click the start button to begin the rocking cycle.
    sequence:
      - target: rocking_shaker
        gesture: click
        validator:
          preset: correct_target
        response:
          scene_operations:
            - type: SceneChange
              to_scene: sdspage_destain_gel_rock_workspace
      - target: rocking_shaker
        gesture: adjust
        validator:
          preset: target_with_value
          value:
            set_time_min: 10
        response:
          scene_operations:
            - type: ObjectStateChange
              target: rocking_shaker
              state:
                set_time_min: 10
      - target: rocking_shaker
        gesture: click
        validator:
          preset: correct_target
        response:
          scene_operations:
            - type: ObjectStateChange
              target: rocking_shaker
              state:
                running: true
            - type: TimedWait
              target: rocking_shaker
              duration_min: 10
              display: Rocking gel in destain
            - type: ObjectStateChange
              target: rocking_shaker
              state:
                running: false
    step_validator:
      preset: sequence_complete
    outcome:
      on_success: complete
      on_failure: retry
    next_step: judge_destain_endpoint
  - step_name: judge_destain_endpoint
    prompt: >-
      Select the visible conclusion supported by this simulated gel: its background is
      clear and its bands are distinct after destaining.
    sequence:
      - target: destain_decision_ready
        gesture: select
        validator: { preset: correct_choice }
        response:
          scene_operations: []
          feedback:
            correct: "Correct: the clear background and distinct bands meet the simulated destaining endpoint."
            incorrect: "This simulated gel has a clear background and distinct bands, so it is ready rather than needing another destain cycle."
    step_validator: { preset: sequence_complete }
    outcome: { on_success: complete, on_failure: retry }
    next_step: dispose_destain
  - step_name: dispose_destain
    prompt:
      Inspect the gel background after rocking. This simulated gel is ready when
      the matrix is clear and bands are distinct. Transfer its used destain to the
      designated stain-waste bottle in the fume hood; do not recycle it. If a real
      gel background remains blue, repeat fresh-destain treatment before imaging.
    sequence:
      - target: staining_tray
        gesture: click
        validator:
          preset: correct_target
        response:
          scene_operations: []
      - target: destain_waste_bottle
        gesture: click
        validator:
          preset: correct_target
        response:
          scene_operations:
            - type: ObjectStateChange
              target: destain_waste_bottle
              state:
                material_name: destain_used
                material_volume: 250
            - type: ObjectStateChange
              target: staining_tray
              state:
                material_name: empty
                material_volume: 0
                gel_state: destained
          feedback:
            correct: "Clear gel background and distinct bands are the endpoint; used destain is hazardous stain waste."
            incorrect: "Use the dedicated destain-waste bottle, not the recycle bottle."
    step_validator:
      preset: sequence_complete
    outcome:
      on_success: complete
      on_failure: retry
    next_step: null
