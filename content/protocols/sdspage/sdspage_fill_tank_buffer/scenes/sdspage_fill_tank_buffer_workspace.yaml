scene_name: sdspage_fill_tank_buffer_workspace
extends: electrophoresis_bench

scene_notes: |
  Electrophoresis bench workspace for filling tank buffer chambers. The full tank
  remains rear context while intentionally enlarged chamber views in the foreground
  let students compare the two distinct reservoir volumes during each transfer.

remove_placements:
  # Keep the tank, 1x carboy, and serological pipette needed to compare the
  # inner and outer reservoirs. Remove loading and unrelated reagent context.
  - rear_left_running_buffer_10x
  - rear_right_power_supply
  - center_ddh2o_bottle
  - center_electrode_module
  - center_p200_micropipette
  - right_tool_area_p10_gel_loading_tip_box
  - rear_left_protein_ladder_tube
  - rear_left_recycle_buffer_bottle
  - rear_right_gel_opening_tool
  - front_left_mini_protean_gel
  - front_center_gel_cassette
  - front_center_waste_container
  - front_right_gel_comb

add_placements:
  - placement_name: front_left_electrophoresis_inner_chamber
    object_name: electrophoresis_inner_chamber
    zone: front_left
    depth_tier: 1
    align_stop: center
  - placement_name: front_right_electrophoresis_outer_chamber
    object_name: electrophoresis_outer_chamber
    zone: front_right
    depth_tier: 1
    align_stop: center
