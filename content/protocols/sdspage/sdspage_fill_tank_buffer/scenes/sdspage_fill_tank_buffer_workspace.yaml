scene_name: sdspage_fill_tank_buffer_workspace
extends: electrophoresis_bench

scene_notes: |
  Buffer-fill view keeps the assembled tank in the background and the upper and
  lower reservoir indicators in the foreground. The buffer carboy remains the only
  source so each transfer visibly supports a gasket check or a marked fill line.

remove_placements:
  # Keep the tank and the prepared 1x carboy as the one visible transfer
  # source. Remove pipettes, loading, and unrelated reagent context.
  - rear_left_running_buffer_10x
  - center_running_buffer_1x_carboy
  - rear_right_power_supply
  - center_ddh2o_bottle
  - center_serological_pipette
  - center_p200_micropipette
  - right_tool_area_p10_gel_loading_tip_box
  - rear_left_protein_ladder_tube
  - rear_left_recycle_buffer_bottle
  - rear_right_gel_opening_tool
  - front_left_mini_protean_gel
  - front_center_gel_cassette
  - front_center_waste_container
  - front_right_gel_comb

add_placements:
  - placement_name: center_running_buffer_preparation_carboy
    object_name: running_buffer_preparation_carboy
    zone: center
    depth_tier: 1
    align_stop: left
  - placement_name: front_left_electrophoresis_inner_chamber
    object_name: electrophoresis_inner_chamber
    zone: front_left
    depth_tier: 1
    align_stop: center
  - placement_name: front_right_electrophoresis_outer_chamber
    object_name: electrophoresis_outer_chamber
    zone: front_right
    depth_tier: 1
    align_stop: center
  - placement_name: front_center_electrophoresis_buffer_dam
    object_name: electrophoresis_buffer_dam
    zone: front_center
    depth_tier: 2
    align_stop: right
