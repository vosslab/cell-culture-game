protocol_type: mini_protocol
protocol_name: sdspage_fill_tank_buffer
entry_step: check_upper_chamber_seal
initial_state:
  - target: running_buffer_preparation_carboy
    state: { material_name: running_buffer_1x, material_volume: 1000 }
  - target: electrophoresis_tank
    state: { lid_present: false, module_present: true }
  - target: electrode_module
    state: { mounted: true, cassette_mounted: true, wing_clamps_open: false }
  - target: electrophoresis_buffer_dam
    state: { seated: true }
  - target: gel_cassette
    state: { tape_present: false, comb_present: false, wing_clamps_locked: true }
  - target: electrophoresis_inner_chamber
    state: { material_name: empty, material_volume: 0, fill_state: empty }
  - target: electrophoresis_outer_chamber
    state: { material_name: empty, material_volume: 0, fill_state: empty }
learning:
  objectives:
    Students completing this mini-protocol will have achieved fluency with
    filling the upper and lower buffer reservoirs of an assembled one-gel apparatus.
  outcomes:
    Students completing this mini-protocol will be able to use a small initial
    buffer addition to check the upper-chamber gasket seal, then fill the upper chamber
    to the well-covering line and the lower chamber to its required level.
  goals:
    Overall, this mini-protocol aims to accomplish completing the conductive buffer
    path without substituting an incidental pipette dial for the physical fill-level check.
steps:
  - step_name: check_upper_chamber_seal
    prompt:
      Pour a small amount of 1x running buffer into the upper chamber and inspect the
      cassette-and-dam gasket seal before committing the full buffer volume.
    sequence:
      - target: running_buffer_preparation_carboy
        gesture: click
        instruction: Pick up the running-buffer carboy for the seal check.
        hint: Take only a small test volume before committing the full fill.
        validator:
          preset: correct_target
        response:
          scene_operations:
            - type: SceneChange
              to_scene: sdspage_fill_tank_buffer_workspace
            - type: CursorAttach
              target: running_buffer_preparation_carboy
              operation: attach
      - target: electrophoresis_inner_chamber
        gesture: click
        instruction: Add a small buffer volume to the upper chamber.
        hint: Use the test fill to inspect the cassette-and-dam gasket for leaks.
        validator:
          preset: correct_target
        response:
          scene_operations:
            - type: ObjectStateChange
              target: electrophoresis_inner_chamber
              state:
                material_name: running_buffer_1x
                material_volume: 25
                fill_state: leak_checked
            - type: ObjectStateChange
              target: running_buffer_preparation_carboy
              state:
                material_name: running_buffer_1x
                material_volume: 975
            - type: CursorAttach
              target: running_buffer_preparation_carboy
              operation: detach
          feedback:
            correct: "The small upper-chamber fill stays behind the gasket: no leak is visible."
            incorrect: Add the test volume to the upper buffer chamber.
    step_validator:
      preset: sequence_complete
    outcome:
      on_success: complete
      on_failure: retry
    next_step: fill_upper_chamber
  - step_name: fill_upper_chamber
    prompt:
      With the seal confirmed, fill the upper chamber with 1x running buffer to the
      line just below the outer plate edge so the wells are covered.
    sequence:
      - target: running_buffer_preparation_carboy
        gesture: click
        instruction: Pick up the running-buffer carboy for the upper fill.
        hint: The seal passed; prepare to cover the wells to the marked line.
        validator:
          preset: correct_target
        response:
          scene_operations:
            - type: CursorAttach
              target: running_buffer_preparation_carboy
              operation: attach
      - target: electrophoresis_inner_chamber
        gesture: click
        instruction: Fill the upper chamber to the well-covering line.
        hint: Add 1x running buffer just below the outer plate edge.
        validator:
          preset: correct_target
        response:
          scene_operations:
            - type: ObjectStateChange
              target: electrophoresis_inner_chamber
              state:
                material_name: running_buffer_1x
                material_volume: 200
                fill_state: filled
            - type: ObjectStateChange
              target: running_buffer_preparation_carboy
              state:
                material_name: running_buffer_1x
                material_volume: 800
            - type: CursorAttach
              target: running_buffer_preparation_carboy
              operation: detach
          feedback:
            correct: The upper reservoir reaches the well-covering fill line.
            incorrect: Fill the upper chamber after its seal check.
    step_validator:
      preset: sequence_complete
    outcome:
      on_success: complete
      on_failure: retry
    next_step: fill_lower_chamber
  - step_name: fill_lower_chamber
    prompt:
      Fill the lower reservoir with 1x running buffer to its marked fill line. This
      teaching scenario models 200 mL in the upper chamber plus 500 mL in the lower
      chamber (700 mL total); verify the exact split against your local apparatus SOP.
    sequence:
      - target: running_buffer_preparation_carboy
        gesture: click
        instruction: Pick up the running-buffer carboy for the lower fill.
        hint: The upper chamber is filled; now prepare the outer reservoir.
        validator:
          preset: correct_target
        response:
          scene_operations:
            - type: CursorAttach
              target: running_buffer_preparation_carboy
              operation: attach
      - target: electrophoresis_outer_chamber
        gesture: click
        instruction: Fill the lower reservoir to its marked line.
        hint: Add the remaining 1x buffer to the outer chamber after the upper fill.
        validator:
          preset: correct_target
        response:
          scene_operations:
            - type: ObjectStateChange
              target: electrophoresis_outer_chamber
              state:
                material_name: running_buffer_1x
                material_volume: 500
                fill_state: filled
            - type: ObjectStateChange
              target: running_buffer_preparation_carboy
              state:
                material_name: running_buffer_1x
                material_volume: 300
            - type: CursorAttach
              target: running_buffer_preparation_carboy
              operation: detach
          feedback:
            correct: Both reservoirs contain conductive 1x buffer at their fill lines.
            incorrect: Fill the lower reservoir after the upper chamber is sealed and filled.
    step_validator:
      preset: sequence_complete
    outcome:
      on_success: complete
      on_failure: retry
    next_step: null
