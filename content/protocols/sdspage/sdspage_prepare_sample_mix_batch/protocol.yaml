protocol_type: mini_protocol
protocol_name: sdspage_prepare_sample_mix_batch
entry_step: prepare_sample_one
initial_state:
  - target: microtube_rack_8.slot_A1
    state: { material_name: protein_sample_raw, material_volume: 21 }
  - target: microtube_rack_8.slot_A2
    state: { material_name: protein_sample_raw, material_volume: 21 }
  - target: microtube_rack_8.slot_A3
    state: { material_name: protein_sample_raw, material_volume: 21 }
  - target: microtube_rack_8.slot_B4
    state: { material_name: protein_ladder, material_volume: 20 }
  - target: laemmli_4x_tube
    state: { material_name: laemmli_4x, material_volume: 1.0 }
  - target: bme_tube
    state: { material_name: bme, material_volume: 1.0 }

learning:
  objectives: "Students completing this mini-protocol will have achieved proficiency with repetitive liquid-transfer workflows, maintaining accuracy and consistency across three sample-preparation cycles, and safely handling volatile reducing agents at scale."
  outcomes: "Students completing this mini-protocol will be able to accurately prepare three independent protein sample denaturation mixes in sequence, each combining 21 &micro;L protein sample, 7.5 &micro;L 4x Laemmli buffer, and 1.5 &micro;L beta-mercaptoethanol in the correct order, for a total of three ready-to-heat sample tubes."
  goals: "Overall, this mini-protocol aims to accomplish the complete batch preparation of protein sample mixes for three lanes of an SDS-PAGE gel, establishing the repetitive pipette-and-mix discipline required for multi-lane gel preparation."

steps:
  - step_name: prepare_sample_one
    prompt: Open the sample-preparation workspace, use the P200 micropipette at 21 &micro;L to transfer raw sample from slot A1 to slot B1, then switch to the P10 micropipette for 7.5 &micro;L Laemmli buffer and 1.5 &micro;L BME to make a 30 &micro;L denatured-sample mix.
    sequence:
      - target: p200_micropipette
        gesture: click
        validator: { preset: correct_target }
        response:
          scene_operations:
            - type: SceneChange
              to_scene: sdspage_prepare_sample_mix_batch_workspace
      - target: p200_micropipette
        gesture: adjust
        validator: { preset: target_with_value, value: { set_volume: 21 } }
        response: { scene_operations: [{ type: ObjectStateChange, target: p200_micropipette, state: { set_volume: 21 } }] }
      - target: microtube_rack_8.slot_A1
        gesture: click
        validator: { preset: correct_target }
        response:
          scene_operations:
            - type: ObjectStateChange
              target: microtube_rack_8.slot_A1
              state: { material_name: empty, material_volume: 0 }
            - type: ObjectStateChange
              target: p200_micropipette
              state: { held_material_name: protein_sample_raw, held_material_volume: 21 }
      - target: microtube_rack_8.slot_B1
        gesture: click
        validator: { preset: correct_target }
        response:
          scene_operations:
            - type: ObjectStateChange
              target: microtube_rack_8.slot_B1
              state: { material_name: protein_sample_raw, material_volume: 21 }
            - type: ObjectStateChange
              target: p200_micropipette
              state: { held_material_name: empty, held_material_volume: 0 }
      - target: p10_micropipette
        gesture: click
        validator: { preset: correct_target }
        response: { scene_operations: [] }
      - target: p10_micropipette
        gesture: adjust
        validator: { preset: target_with_value, value: { set_volume: 7.5 } }
        response: { scene_operations: [{ type: ObjectStateChange, target: p10_micropipette, state: { set_volume: 7.5 } }] }
      - target: laemmli_4x_tube
        gesture: click
        validator: { preset: correct_target }
        response:
          scene_operations:
            - type: ObjectStateChange
              target: laemmli_4x_tube
              state: { material_name: laemmli_4x, material_volume: 0.9925 }
            - type: ObjectStateChange
              target: p10_micropipette
              state: { held_material_name: laemmli_4x, held_material_volume: 7.5 }
      - target: microtube_rack_8.slot_B1
        gesture: click
        validator: { preset: correct_target }
        response:
          scene_operations:
            - type: ObjectStateChange
              target: microtube_rack_8.slot_B1
              state: { material_name: protein_sample_mixed, material_volume: 28.5 }
            - type: ObjectStateChange
              target: p10_micropipette
              state: { held_material_name: empty, held_material_volume: 0 }
      - target: p10_micropipette
        gesture: adjust
        validator: { preset: target_with_value, value: { set_volume: 1.5 } }
        response: { scene_operations: [{ type: ObjectStateChange, target: p10_micropipette, state: { set_volume: 1.5 } }] }
      - target: bme_tube
        gesture: click
        validator: { preset: correct_target }
        response:
          scene_operations:
            - type: ObjectStateChange
              target: bme_tube
              state: { material_name: bme, material_volume: 0.9985 }
            - type: ObjectStateChange
              target: p10_micropipette
              state: { held_material_name: bme, held_material_volume: 1.5 }
      - target: microtube_rack_8.slot_B1
        gesture: click
        validator: { preset: correct_target }
        response:
          scene_operations:
            - type: ObjectStateChange
              target: microtube_rack_8.slot_B1
              state: { material_name: protein_sample_mixed, material_volume: 30 }
            - type: ObjectStateChange
              target: p10_micropipette
              state: { held_material_name: empty, held_material_volume: 0 }
    step_validator: { preset: sequence_complete }
    outcome: { on_success: complete, on_failure: retry }
    next_step: prepare_sample_two
