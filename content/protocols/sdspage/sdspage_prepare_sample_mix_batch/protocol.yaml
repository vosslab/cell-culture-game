protocol_type: mini_protocol
protocol_name: sdspage_prepare_sample_mix_batch
entry_step: prepare_batch
initial_state:
  - target: microtube_rack_8.slot_A1
    state: { material_name: protein_sample_raw, material_volume: 21 }
  - target: microtube_rack_8.slot_A2
    state: { material_name: protein_sample_raw, material_volume: 21 }
  - target: microtube_rack_8.slot_A3
    state: { material_name: protein_sample_raw, material_volume: 21 }
  - target: laemmli_4x_tube
    state: { material_name: laemmli_4x, material_volume: 1.0 }
  - target: bme_tube
    state: { material_name: bme, material_volume: 1.0 }

learning:
  objectives: "Students completing this mini-protocol will have achieved consistent, correctly labeled batch preparation of three SDS-PAGE samples while using a fresh tip for every source transfer."
  outcomes: "Students completing this mini-protocol will be able to make three independent 30 &micro;L denaturation mixes from the pre-normalized simulated 21 &micro;L inputs, 7.5 &micro;L 4x Laemmli buffer, and 1.5 &micro;L BME."
  goals: "Overall, this mini-protocol aims to accomplish one batch lesson: the first B1 mix is a worked example, then B2 and B3 use the same checklist without losing lane identities."

steps:
  - step_name: prepare_batch
    prompt: >-
      In the fume-hood workspace, make the lane 1 mix in B1 as the worked example:
      21 &micro;L from A1, 7.5 &micro;L 4x Laemmli, then 1.5 &micro;L BME. Repeat the
      same fresh-tip checklist for A2 to B2 and A3 to B3. Each finished tube is
      a separate 30 &micro;L lane sample; BME handling remains in the hood.
    sequence:
      - target: p200_micropipette
        gesture: click
        validator: { preset: correct_target }
        response:
          scene_operations:
            - type: SceneChange
              to_scene: sdspage_prepare_sample_mix_batch_workspace
      # B1 worked example: sample -> Laemmli -> BME.
      - target: micropipette_tip_box
        gesture: click
        validator: { preset: correct_target }
        response: { scene_operations: [{ type: ObjectStateChange, target: p200_micropipette, state: { tip_status: fresh } }], feedback: { correct: "Fresh tip fitted for sample B1.", incorrect: "Fit a fresh tip before drawing sample." } }
      - target: p200_micropipette
        gesture: adjust
        validator: { preset: target_with_value, value: { set_volume: 21 } }
        response: { scene_operations: [{ type: ObjectStateChange, target: p200_micropipette, state: { set_volume: 21 } }] }
      - target: microtube_rack_8.slot_A1
        gesture: click
        validator: { preset: correct_target }
        response: { scene_operations: [{ type: ObjectStateChange, target: microtube_rack_8.slot_A1, state: { material_name: empty, material_volume: 0 } }, { type: ObjectStateChange, target: p200_micropipette, state: { held_material_name: protein_sample_raw, held_material_volume: 21 } }] }
      - target: microtube_rack_8.slot_B1
        gesture: click
        validator: { preset: correct_target }
        response: { scene_operations: [{ type: ObjectStateChange, target: microtube_rack_8.slot_B1, state: { material_name: protein_sample_raw, material_volume: 21 } }, { type: ObjectStateChange, target: p200_micropipette, state: { held_material_name: empty, held_material_volume: 0, tip_status: used } }] }
      - target: micropipette_tip_box
        gesture: click
        validator: { preset: correct_target }
        response: { scene_operations: [{ type: ObjectStateChange, target: p10_micropipette, state: { tip_status: fresh } }], feedback: { correct: "Fresh tip fitted for Laemmli.", incorrect: "Use a fresh reagent tip after handling sample." } }
      - target: p10_micropipette
        gesture: adjust
        validator: { preset: target_with_value, value: { set_volume: 7.5 } }
        response: { scene_operations: [{ type: ObjectStateChange, target: p10_micropipette, state: { set_volume: 7.5 } }] }
      - target: laemmli_4x_tube
        gesture: click
        validator: { preset: correct_target }
        response: { scene_operations: [{ type: ObjectStateChange, target: laemmli_4x_tube, state: { material_name: laemmli_4x, material_volume: 0.9925 } }, { type: ObjectStateChange, target: p10_micropipette, state: { held_material_name: laemmli_4x, held_material_volume: 7.5 } }] }
      - target: microtube_rack_8.slot_B1
        gesture: click
        validator: { preset: correct_target }
        response: { scene_operations: [{ type: ObjectStateChange, target: microtube_rack_8.slot_B1, state: { material_name: protein_sample_mixed, material_volume: 28.5 } }, { type: ObjectStateChange, target: p10_micropipette, state: { held_material_name: empty, held_material_volume: 0, tip_status: used } }] }
      - target: micropipette_tip_box
        gesture: click
        validator: { preset: correct_target }
        response: { scene_operations: [{ type: ObjectStateChange, target: p10_micropipette, state: { tip_status: fresh } }], feedback: { correct: "Fresh tip fitted for BME.", incorrect: "Use a fresh tip before entering the BME source." } }
      - target: p10_micropipette
        gesture: adjust
        validator: { preset: target_with_value, value: { set_volume: 1.5 } }
        response: { scene_operations: [{ type: ObjectStateChange, target: p10_micropipette, state: { set_volume: 1.5 } }] }
      - target: bme_tube
        gesture: click
        validator: { preset: correct_target }
        response: { scene_operations: [{ type: ObjectStateChange, target: bme_tube, state: { material_name: bme, material_volume: 0.9985 } }, { type: ObjectStateChange, target: p10_micropipette, state: { held_material_name: bme, held_material_volume: 1.5 } }] }
      - target: microtube_rack_8.slot_B1
        gesture: click
        validator: { preset: correct_target }
