scene_name: plate_focus_bench
workspace: bench
capabilities:
  - item_workspace

background:
  type: gradient
  from: "#E8E2D0"
  to: "#D4CBB3"
  angle: 180

# This scene intentionally treats the 96-well plate as a foreground teaching
# surface. It is not a literal scale drawing of every bench item: the wide plate
# makes well-level changes legible, while reagents and pipettes provide context.
zones:
  - zone_name: rear_left
    align: tab-stops
    label: Rear-left context
  - zone_name: rear_center
    align: tab-stops
    label: Rear-center context
  - zone_name: rear_right
    align: tab-stops
    label: Rear-right context
  # Kept for protocol-specific context instruments. The layout manager keeps
  # those instruments visibly secondary to the plate rather than co-primary.
  - zone_name: center
    align: tab-stops
    label: Secondary context
  - zone_name: right_tool_area
    align: tab-stops
    label: Secondary tool rack
  # The foreground teaching row is declared last so layout plans all supporting
  # context before placing the plate as the focal learning surface.
  - zone_name: foreground_plate
    align: tab-stops
    label: Foreground 96-well plate

placements:
  - placement_name: foreground_well_plate_96
    object_name: well_plate_96
    zone: foreground_plate
    depth_tier: 2
    align_stop: center

layout_rules:
  label_line_height: 1.1
  label_offset_y: 4
  zone_gap: 4
  default_align_stop: center

wrong_order_message:
  template: "Try using the {expected_label}."
  toast_duration_ms: 2000
