object_name: t75_flask_new
kind: flask
label: T75 flask (new)

state_fields:
  - field_name: material_name
    type: enum
    allowed: [empty, media, pbs, trypsin, cell_suspension]
    default: empty
    description: Contents currently in the flask.
  - field_name: material_volume
    type: float
    unit: ml
    min: 0
    max: 25
    default: 0
    description: Volume of contents in the flask, in milliliters.
  - field_name: incubation_status
    type: enum
    allowed: [out, in_incubator]
    default: out
    description: Whether the flask is currently in the incubator.
  - field_name: cell_state
    type: enum
    allowed: [not_applicable, attached_70_80, rounded_detached, suspension]
    default: not_applicable
    description: Visible culture morphology relevant to reseeding.
  - field_name: label_status
    type: enum
    allowed: [unlabeled, identity_complete]
    default: unlabeled
    description: Whether the fixed cell-line, date, passage, and initials label is complete.

visual_states:
  material_name:
    kind: svg
    cases:
      - when: empty
        output: { asset_name: t75_flask_empty }
      - when: media
        output: { asset_name: t75_flask_filled }
      - when: pbs
        output: { asset_name: t75_flask_filled }
      - when: trypsin
        output: { asset_name: t75_flask_filled }
      - when: cell_suspension
        output: { asset_name: t75_flask_filled }
  material_volume:
    kind: composite
    composite: []
  incubation_status:
    kind: composite
    composite: []
  cell_state:
    kind: overlay
    formula: 'label(state(cell_state), format="Cells: {value}")'
  label_status:
    kind: overlay
    formula: 'label(state(label_status), format="Flask label: {value}")'

capabilities: [clickable, material_container]

layout:
  default_width: 12
  display_width_cm: 20
  label_width: 8
