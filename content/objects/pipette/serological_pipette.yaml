object_name: serological_pipette
kind: pipette
label: Serological pipette

state_fields:
  - field_name: held_material_name
    type: enum
    allowed:
      [
        empty,
        media,
        pbs,
        trypsin,
        cells,
        cell_suspension,
        running_buffer_10x,
        running_buffer_1x,
        ddh2o,
      ]
    default: empty
    description: Contents currently drawn into the pipette barrel.
  - field_name: held_material_volume
    type: float
    unit: ml
    min: 0
    max: 25.0
    default: 0
    description: Volume of contents currently held, in milliliters.
  - field_name: freshness
    type: enum
    allowed: [sterile, used]
    default: sterile
    description: Whether this disposable graduated pipette has contacted a reagent source.

visual_states:
  held_material_name:
    kind: svg
    cases:
      - when: empty
        output: { asset_name: serological_pipette }
      - when: media
        output: { asset_name: serological_pipette }
      - when: pbs
        output: { asset_name: serological_pipette }
      - when: trypsin
        output: { asset_name: serological_pipette }
      - when: cells
        output: { asset_name: serological_pipette }
      - when: cell_suspension
        output: { asset_name: serological_pipette }
      - when: running_buffer_10x
        output: { asset_name: serological_pipette }
      - when: running_buffer_1x
        output: { asset_name: serological_pipette }
      - when: ddh2o
        output: { asset_name: serological_pipette }
  held_material_volume:
    applies_to: object
    render_effect: fill_height
    target: anchor_liquid_bounds
    clip: anchor_liquid_clip
    capacity_ml: 25.0
  freshness:
    kind: overlay
    formula: 'label(state(freshness), format="Pipette: {value}")'

capabilities:
  [clickable, material_container, cursor_attachable]

layout:
  default_width: 3
  display_width_cm: 3
  label_width: 6
  anchor_y: tip
  anchor_y_offset: 0
