object_name: repeat_dispenser
kind: pipette
label: Repeating dispenser

state_fields:
  - field_name: set_dispense_volume
    type: float
    unit: ul
    min: 1
    max: 50
    step: 0.5
    default: 5
    description: Volume dispensed with each trigger press.
  - field_name: held_material_name
    type: enum
    allowed: [empty, carboplatin, carboplatin_4umol, carboplatin_8umol, carboplatin_20umol, carboplatin_40umol, carboplatin_80umol, carboplatin_200umol, carboplatin_400umol, metformin, metformin_200mmol, media]
    default: empty
    description: Stock currently loaded in the dispenser tip.
  - field_name: held_material_volume
    type: float
    unit: ul
    min: 0
    max: 120
    default: 0
    description: Stock remaining in the dispenser tip.
  - field_name: tip_status
    type: enum
    allowed: [none, fresh, used]
    default: none
    description: Disposable dispensing-tip status for contamination-control checkpoints.

visual_states:
  set_dispense_volume:
    kind: overlay
    formula: label(state(set_dispense_volume), format="{value} &micro;L per dispense")
  held_material_name:
    kind: svg
    cases:
      - when: empty
        output: { asset_name: repeat_dispenser }
      - when: carboplatin
        output: { asset_name: repeat_dispenser }
      - when: carboplatin_4umol
        output: { asset_name: repeat_dispenser }
      - when: carboplatin_8umol
        output: { asset_name: repeat_dispenser }
      - when: carboplatin_20umol
        output: { asset_name: repeat_dispenser }
      - when: carboplatin_40umol
        output: { asset_name: repeat_dispenser }
      - when: carboplatin_80umol
        output: { asset_name: repeat_dispenser }
      - when: carboplatin_200umol
        output: { asset_name: repeat_dispenser }
      - when: carboplatin_400umol
        output: { asset_name: repeat_dispenser }
      - when: metformin
        output: { asset_name: repeat_dispenser }
      - when: metformin_200mmol
        output: { asset_name: repeat_dispenser }
      - when: media
        output: { asset_name: repeat_dispenser }
  held_material_volume:
    applies_to: object
    render_effect: fill_height
    target: anchor_liquid_bounds
    clip: anchor_liquid_clip
    capacity_ul: 120
  tip_status:
    kind: overlay
    formula: 'label(state(tip_status), format="Tip: {value}")'

capabilities: [clickable, material_container, instrument_with_setpoint, cursor_attachable]

layout:
  default_width: 3
  display_width_cm: 6
  label_width: 9
  anchor_y: tip
  anchor_y_offset: 0
