object_name: p20_micropipette
kind: pipette
label: P20 micropipette (2-20 &micro;L)

state_fields:
  - field_name: set_volume
    type: float
    unit: ul
    min: 2
    max: 20
    step: 0.1
    default: 10
    description: Volume the P20 is set to dispense.
  - field_name: tip_status
    type: enum
    allowed: [none, fresh, used]
    default: none
    description: Disposable tip state before and after liquid handling.
  - field_name: held_material_name
    type: enum
    allowed: [empty, carboplatin, carboplatin_400umol, metformin, media, cell_suspension, trypan_blue, trypan_blue_mixture, protein_sample_raw, protein_sample_denatured, protein_ladder, laemmli_4x, bme, running_buffer_1x, ddh2o]
    default: empty
    description: Contents currently held in the disposable tip.
  - field_name: held_material_volume
    type: float
    unit: ul
    min: 0
    max: 20
    default: 0
    description: Volume currently held in the disposable tip.

visual_states:
  set_volume:
    kind: overlay
    formula: label(state(set_volume), format="{value} &micro;L")
  tip_status:
    kind: overlay
    formula: 'label(state(tip_status), format="Tip: {value}")'
  held_material_name:
    kind: svg
    cases:
      - when: empty
        output: { asset_name: p20_micropipette_empty }
      - when: carboplatin
        output: { asset_name: p20_micropipette_filled }
      - when: carboplatin_400umol
        output: { asset_name: p20_micropipette_filled }
      - when: metformin
        output: { asset_name: p20_micropipette_filled }
      - when: media
        output: { asset_name: p20_micropipette_filled }
      - when: cell_suspension
        output: { asset_name: p20_micropipette_filled }
      - when: trypan_blue
        output: { asset_name: p20_micropipette_filled }
      - when: trypan_blue_mixture
        output: { asset_name: p20_micropipette_filled }
      - when: protein_sample_raw
        output: { asset_name: p20_micropipette_filled }
      - when: protein_sample_denatured
        output: { asset_name: p20_micropipette_filled }
      - when: protein_ladder
        output: { asset_name: p20_micropipette_filled }
      - when: laemmli_4x
        output: { asset_name: p20_micropipette_filled }
      - when: bme
        output: { asset_name: p20_micropipette_filled }
      - when: running_buffer_1x
        output: { asset_name: p20_micropipette_filled }
      - when: ddh2o
        output: { asset_name: p20_micropipette_filled }
  held_material_volume:
    kind: composite
    composite: []

capabilities: [clickable, material_container, instrument_with_setpoint, cursor_attachable]

layout:
  default_width: 2
  display_width_cm: 4
  label_width: 7
  anchor_y: tip
  anchor_y_offset: 0
