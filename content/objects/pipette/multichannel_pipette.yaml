object_name: multichannel_pipette
kind: pipette
label: Multichannel pipette

state_fields:
  - field_name: set_volume
    type: float
    unit: ul
    min: 20
    max: 300
    step: 1
    default: 50
    description: Volume the pipette is set to dispense per channel.
  - field_name: held_material_name
    type: enum
    allowed: [empty, media, cell_suspension, dmso, mtt_solution_12mm, carboplatin, metformin]
    default: empty
    description: Contents currently held in the channels.
  - field_name: held_material_volume
    type: float
    unit: ul
    min: 0
    max: 300
    default: 0
    description: Volume of contents currently held per channel, in microliters.

visual_states:
  set_volume:
    kind: overlay
    formula: label(state(set_volume), format="{value} ul")
  held_material_name:
    kind: svg
    cases:
      - when: empty
        output: { asset_name: multichannel_pipette }
      - when: media
        output: { asset_name: multichannel_pipette }
      - when: cell_suspension
        output: { asset_name: multichannel_pipette }
      - when: dmso
        output: { asset_name: multichannel_pipette }
      - when: mtt_solution_12mm
        output: { asset_name: multichannel_pipette }
      - when: carboplatin
        output: { asset_name: multichannel_pipette }
      - when: metformin
        output: { asset_name: multichannel_pipette }
  held_material_volume:
    applies_to: object
    render_effect: fill_height
    target: anchor_liquid_bounds
    clip: anchor_liquid_clip
    capacity_ul: 300

capabilities:
  [clickable, material_container, instrument_with_setpoint, cursor_attachable]

channel_addressing:
  channels: 8
  addressable_subpart_kinds: [well, column]

layout:
  default_width: 6
  display_width_cm: 14
  label_width: 8
  anchor_y: tip
  anchor_y_offset: 0
