object_name: p200_micropipette
kind: pipette
label: P200 micropipette (20-200 &micro;L)

state_fields:
  - field_name: set_volume
    type: float
    unit: ul
    min: 20
    max: 200
    step: 1
    default: 100
    description: Volume the pipette is set to dispense.
  - field_name: tip_status
    type: enum
    allowed: [none, fresh, used]
    default: none
    description: Disposable tip state before and after liquid handling.
  - field_name: held_material_name
    type: enum
    allowed:
      [
        empty,
        carboplatin,
        carboplatin_10mmol,
        carboplatin_400umol,
        metformin,
        metformin_1mol,
        media,
        protein_sample_raw,
        protein_sample_denatured,
        protein_ladder,
        protein_ladder_denatured,
        laemmli_4x,
        bme,
        running_buffer_1x,
        ddh2o,
      ]
    default: empty
    description: Contents currently loaded in the pipette tip.
  - field_name: held_material_volume
    type: float
    unit: ul
    min: 0
    max: 200
    default: 0
    description: Volume of contents currently held, in microliters.

visual_states:
  set_volume:
    kind: overlay
    formula: label(state(set_volume), format="{value} &micro;L")
  tip_status:
    kind: overlay
    formula: 'label(state(tip_status), format="Tip: {value}")'
  held_material_name:
    kind: svg
    cases:
      - when: empty
        output: { asset_name: p200_micropipette_unloaded }
      - when: carboplatin
        output: { asset_name: p200_micropipette_loaded }
      - when: carboplatin_10mmol
        output: { asset_name: p200_micropipette_loaded }
      - when: carboplatin_400umol
        output: { asset_name: p200_micropipette_loaded }
      - when: metformin
        output: { asset_name: p200_micropipette_loaded }
      - when: metformin_1mol
        output: { asset_name: p200_micropipette_loaded }
      - when: media
        output: { asset_name: p200_micropipette_loaded }
      - when: protein_sample_raw
        output: { asset_name: p200_micropipette_loaded }
      - when: protein_sample_denatured
        output: { asset_name: p200_micropipette_loaded }
      - when: protein_ladder
        output: { asset_name: p200_micropipette_loaded }
      - when: protein_ladder_denatured
        output: { asset_name: p200_micropipette_loaded }
      - when: laemmli_4x
        output: { asset_name: p200_micropipette_loaded }
      - when: bme
        output: { asset_name: p200_micropipette_loaded }
      - when: running_buffer_1x
        output: { asset_name: p200_micropipette_loaded }
      - when: ddh2o
        output: { asset_name: p200_micropipette_loaded }
  held_material_volume:
    kind: composite
    composite: []
capabilities:
  [clickable, material_container, instrument_with_setpoint, cursor_attachable]

layout:
  default_width: 2
  display_width_cm: 4
  label_width: 5
  anchor_y: tip
  anchor_y_offset: 0
