object_name: electrophoresis_outer_chamber
kind: equipment
label: Outer buffer chamber

state_fields:
  - field_name: material_name
    type: enum
    allowed: [empty, running_buffer_1x, running_buffer_1x_used]
    default: empty
    description: Contents currently in the outer electrophoresis buffer chamber.
  - field_name: material_volume
    type: float
    unit: ml
    min: 0
    max: 500
    default: 0
    description: Buffer volume currently in the outer chamber, in milliliters.
  - field_name: fill_state
    type: enum
    allowed: [empty, partial, filled, leak_checked]
    default: empty
    description: Visible outer-chamber fill level and successful leak-check state.

visual_states:
  material_name:
    kind: composite
    composite: []
  material_volume:
    kind: overlay
    formula: 'label(state(material_volume), format="Outer chamber: {value} mL")'
  fill_state:
    kind: svg
    cases:
      - when: empty
        output: { asset_name: electrophoresis_outer_chamber_empty }
      - when: partial
        output: { asset_name: electrophoresis_outer_chamber_partial }
      - when: filled
        output: { asset_name: electrophoresis_outer_chamber_filled }
      - when: leak_checked
        output: { asset_name: electrophoresis_outer_chamber_leak_checked }
capabilities: [clickable, material_container]

layout:
  default_width: 18
  # Enlarged in its focused protocol scenes so the surrounding reservoir can be
  # compared directly with the inner chamber during the transfer sequence.
  display_width_cm: 30
  label_width: 13
