object_name: cell_viability_results_display
kind: equipment
label: Automated viability results

state_fields:
  - field_name: visible
    type: bool
    default: true
    description: Whether the fixed representative counter result and seeding gate are visible.

visual_states:
  visible:
    kind: svg
    cases:
      - when: true
        output: { asset_name: cell_viability_results_display }
      - when: false
        output: { asset_name: cell_viability_results_display }

capabilities: [decoration_only]

layout:
  default_width: 54
  display_width_cm: 54
  label_width: 24
