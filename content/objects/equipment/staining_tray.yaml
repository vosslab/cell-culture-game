object_name: staining_tray
kind: equipment
label: Staining Tray

state_fields:
  - field_name: material_name
    type: enum
    allowed: [empty, running_buffer_1x, coomassie_stain, destain, ddh2o]
    default: empty
    description: Contents currently in the staining tray.
  - field_name: material_volume
    type: float
    unit: ml
    min: 0
    max: 500
    default: 0
    description: Volume of contents in the tray, in milliliters.
  - field_name: gel_present
    type: bool
    default: false
    description: Whether a gel is present in the tray.
  - field_name: kimwipes_present
    type: bool
    default: false
    description: Whether kimwipes are present in the tray.
  - field_name: kimwipe_count
    type: int
    min: 0
    max: 4
    default: 0
    description: Number of loose, no-contact knotted Kimwipes floating beside the gel.
  - field_name: rinse_count
    type: int
    min: 0
    max: 2
    default: 0
    description: Completed water-rinse cycles while the gel remains in the tray.
  - field_name: coverage_depth_cm
    type: float
    unit: cm
    min: 0
    max: 5
    default: 0
    description: Visible solution depth above the gel.
  - field_name: gel_state
    type: enum
    allowed: [empty, separated_unstained, stained, destaining, destained]
    default: empty
    description: Visible lifecycle state of the gel in the tray.
  - field_name: lane_pattern
    type: enum
    allowed: [unassigned, samples_1_to_3_ladder_5]
    default: unassigned
    description: Identity of the loaded lanes carried with the gel.
  - field_name: orientation_status
    type: enum
    allowed: [not_confirmed, wells_top_ladder_lane_5]
    default: not_confirmed
    description: Whether the gel is flat with the wells at the top and ladder in lane 5.
  - field_name: background_status
    type: enum
    allowed: [not_confirmed, clean_background_oriented]
    default: not_confirmed
    description: Whether the final rinse leaves a clean background while preserving gel orientation.

visual_states:
  material_name:
    kind: svg
    cases:
      - when: empty
        output: { asset_name: staining_tray_empty }
      - when: running_buffer_1x
        output: { asset_name: staining_tray_empty }
      - when: coomassie_stain
        output: { asset_name: staining_tray_empty }
      - when: destain
        output: { asset_name: staining_tray_empty }
      - when: ddh2o
        output: { asset_name: staining_tray_empty }
  material_volume:
    kind: composite
    composite: []
  gel_present:
    kind: composite
    composite: []
  kimwipes_present:
    kind: composite
    composite: []
  kimwipe_count:
    kind: overlay
    formula: 'label(state(kimwipe_count), format="Loose no-contact Kimwipes: {value}")'
  rinse_count:
    kind: overlay
    formula: 'label(state(rinse_count), format="Rinses complete: {value}/2")'
  coverage_depth_cm:
    kind: overlay
    formula: 'label(state(coverage_depth_cm), format="Gel coverage: {value} cm")'
  gel_state:
    kind: svg
    cases:
      - when: empty
        output: { asset_name: staining_tray_empty }
      - when: separated_unstained
        output: { asset_name: staining_tray_buffer }
      - when: stained
        output: { asset_name: staining_tray_stain }
      - when: destaining
        output: { asset_name: staining_tray_destain }
      - when: destained
        output: { asset_name: staining_tray_water }
  lane_pattern:
    kind: overlay
    formula: 'label(state(lane_pattern), format="Lanes: {value}")'
  orientation_status:
    kind: overlay
    formula: 'label(state(orientation_status), format="Gel orientation: {value}")'
  background_status:
    kind: overlay
    formula: 'label(state(background_status), format="Final rinse: {value}")'

capabilities: [clickable, material_container]

layout:
  default_width: 12
  display_width_cm: 22
  label_width: 12
