object_name: hemocytometer_slide
kind: equipment
label: Hemocytometer slide

# The slide has two independently addressable liquid regions.  Keeping their
# state separate makes the instructional transfer from mixed sample to loading
# chamber conserved, visible, and impossible to complete by clicking a vague
# whole-slide target.
structure:
  # The closed structured-surface vocabulary calls liquid-holding regions
  # wells; the learner-facing names remain the scientific chamber names below.
  subpart_kind: well
  layout: grid
  rows: 1
  cols: 2
  # Required for the grid schema; the explicit names below are the scientific
  # chamber vocabulary and are paired with measured SVG geometry in the object
  # generator's hemocytometer record.
  name_pattern: "chamber_{col}"
  subpart_names: [diamond, semicircle]

state_fields:
  - field_name: slide_status
    type: enum
    allowed: [ready]
    default: ready
    description: Static slide frame used to select the hemocytometer artwork.
  - field_name: material_name
    type: enum
    allowed: [empty, trypan_blue, cell_suspension, trypan_blue_mixture]
    default: empty
    applies_to: subpart
    description: Liquid currently in this named hemocytometer chamber.
  - field_name: material_volume
    type: float
    unit: ml
    min: 0
    max: 0.1
    default: 0
    applies_to: subpart
    description: Volume loaded in this named chamber.
  - field_name: excess_wiped
    type: bool
    default: false
    description: Whether excess liquid has been wiped from slide edges.
  - field_name: mix_cycles
    type: int
    min: 0
    max: 3
    default: 0
    description: Completed gentle pipette mixing cycles for the 1:1 Trypan Blue sample.
  - field_name: mixture_homogeneous
    type: bool
    default: false
    description: Whether the stained cell suspension has been mixed evenly before chamber loading.
  - field_name: chamber_load_quality
    type: enum
    allowed: [not_loaded, capillary_loading, bubble_free]
    default: not_loaded
    description: Visible quality of capillary loading into the hemocytometer chamber.
  - field_name: observation_state
    type: enum
    allowed: [not_observed, live_dead_cells_visible, quadrants_counted]
    default: not_observed
    description: Manual live/dead cell observation state for the loaded chamber.

visual_states:
  slide_status:
    kind: svg
    cases:
      - when: ready
        output: {asset_name: hemocytometer_slide}
  material_name:
    applies_to: subpart
    render_effect: material_tint
    target: subpart_geometry
  material_volume:
    kind: composite
    applies_to: subpart
    composite: []
  excess_wiped:
    kind: overlay
    formula: 'conditional(state(excess_wiped), "Wiped clean", "Excess present")'
  mix_cycles:
    kind: overlay
    formula: 'conditional(state(mix_cycles), label(state(mix_cycles), format="Gentle mix cycles: {value}/3"), "Gentle mix cycles: 0/3")'
  mixture_homogeneous:
    kind: overlay
    formula: 'conditional(state(mixture_homogeneous), "Evenly mixed", "Mix before loading")'
  chamber_load_quality:
    kind: overlay
    formula: 'label(state(chamber_load_quality), format="Capillary load: {value}")'
  observation_state:
    # A labelled status alone did not teach trypan-blue exclusion.  The
    # overlays preserve the physical grid and make viable (clear) and
    # nonviable (blue) cells, then the counted quadrants, observable.
    kind: composite
    cases:
      - when: not_observed
        output: { composite: [] }
      - when: live_dead_cells_visible
        output:
          composite:
            - { asset_name: hemocytometer_live_dead_cells_visible }
      - when: quadrants_counted
        output:
          composite:
            - { asset_name: hemocytometer_quadrants_counted }

capabilities: [clickable, structured_surface, material_container]

layout:
  default_width: 8
  display_width_cm: 8
  label_width: 10
