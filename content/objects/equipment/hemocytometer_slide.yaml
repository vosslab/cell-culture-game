object_name: hemocytometer_slide
kind: equipment
label: Hemocytometer slide

# The slide has two independently addressable liquid regions.  Keeping their
# state separate makes the instructional transfer from mixed sample to loading
# chamber conserved, visible, and impossible to complete by clicking a vague
# whole-slide target.
structure:
  # The closed structured-surface vocabulary calls liquid-holding regions
  # wells; the learner-facing names remain the scientific chamber names below.
  subpart_kind: well
  layout: grid
  rows: 1
  cols: 2
  # Required for the grid schema; the explicit names below are the scientific
  # chamber vocabulary and are paired with measured SVG geometry in the object
  # generator's hemocytometer record.
  name_pattern: "chamber_{col}"
  subpart_names: [diamond, semicircle]

state_fields:
  - field_name: slide_status
    type: enum
    allowed: [ready]
    default: ready
    description: Static slide frame used to select the hemocytometer artwork.
  - field_name: material_name
    type: enum
    allowed: [empty, trypan_blue, cell_suspension, trypan_blue_mixture]
    default: empty
    applies_to: subpart
    description: Liquid currently in this named hemocytometer chamber.
  - field_name: material_volume
    type: float
    unit: ml
    min: 0
    max: 0.1
    default: 0
    applies_to: subpart
    description: Volume loaded in this named chamber.
  - field_name: excess_wiped
    type: bool
    default: false
    description: Whether excess liquid has been wiped from slide edges.

visual_states:
  slide_status:
    kind: svg
    cases:
      - when: ready
        output: {asset_name: hemocytometer_slide}
  material_name:
    applies_to: subpart
    render_effect: material_tint
    target: subpart_geometry
  material_volume:
    kind: composite
    applies_to: subpart
    composite: []
  excess_wiped:
    kind: overlay
    formula: 'conditional(state(excess_wiped), "Wiped clean", "Excess present")'

capabilities: [clickable, structured_surface, material_container]

layout:
  default_width: 8
  display_width_cm: 8
  label_width: 10
