object_name: cell_counter
kind: equipment
label: Automated cell counter

state_fields:
  - field_name: slide_loaded
    type: bool
    default: false
    description: Whether a hemocytometer slide is currently inserted in the counter.
  - field_name: focused
    type: bool
    default: false
    description: Whether the cell counter has auto-focused on the loaded slide.
  - field_name: capture_pressed
    type: bool
    default: false
    description: Whether the Capture button has been pressed to count cells.
  - field_name: cell_count
    type: int
    min: 0
    max: 9999999
    default: 0
    description: Total cell count from the analysis.
  - field_name: cell_concentration_per_ml
    type: float
    unit: cells_per_ml
    min: 0
    max: 10000000
    step: 1000
    default: 0
    description: Viable cell concentration reported by the counter in cells per milliliter.
  - field_name: viability_percent
    type: float
    unit: percent
    min: 0
    max: 100
    default: 0
    description: Viability percentage (live cells / total cells).
  - field_name: viability_verified
    type: bool
    default: false
    description: Whether viability has been confirmed to clear the strictly greater-than-90% gate.
  - field_name: manual_observation
    type: enum
    allowed: [not_observed, live_dead_cells_visible, quadrants_counted]
    default: not_observed
    description: Manual hemocytometer observation completed before automated comparison.

visual_states:
  slide_loaded:
    kind: svg
    cases:
      - when: false
        output:
          asset_name: cell_counter_instrument
      - when: true
        output:
          asset_name: cell_counter_instrument
  focused:
    kind: overlay
    formula: 'conditional(state(focused), "Focus complete", conditional(state(slide_loaded), "Slide loaded", ""))'
  capture_pressed:
    kind: svg
    cases:
      - when: false
        output:
          asset_name: cell_counter_instrument
      - when: true
        output:
          asset_name: cell_counter_result
  cell_count:
    kind: overlay
    formula: 'conditional(state(cell_count), label(state(cell_count), format="Count: {value}"), "")'
  cell_concentration_per_ml:
    kind: overlay
    formula: 'conditional(state(cell_concentration_per_ml), label(state(cell_concentration_per_ml), format="Concentration: {value} cells/mL"), "")'
  viability_percent:
    kind: overlay
    formula: 'conditional(state(viability_percent), label(state(viability_percent), format="Viability: {value}%"), "")'
  viability_verified:
    kind: composite
    composite: []
  manual_observation:
    # Keep the microscope observation visible after the student moves to the
    # counter.  These are transparent full-frame layers, so capture results
    # and the numeric DOM overlays remain visible underneath.
    kind: composite
    cases:
      - when: not_observed
        output: { composite: [] }
      - when: live_dead_cells_visible
        output:
          composite:
            - { asset_name: cell_counter_manual_live_dead_panel }
      - when: quadrants_counted
        output:
          composite:
            - { asset_name: cell_counter_manual_quadrants_panel }

capabilities: [clickable]

layout:
  default_width: 22
  display_width_cm: 38
  label_width: 14
