object_name: gel_cassette
kind: equipment
label: Gel cassette

structure:
  subpart_kind: lane
  layout: grid
  rows: 1
  cols: 10
  name_pattern: "lane_{col}"
  subpart_groups:
    all_lanes:
      group_kind: region
      members:
        - name: all_lanes
          contains:
            [
              lane_1,
              lane_2,
              lane_3,
              lane_4,
              lane_5,
              lane_6,
              lane_7,
              lane_8,
              lane_9,
              lane_10,
            ]

state_fields:
  - field_name: material_name
    type: enum
    allowed: [empty, protein_ladder, protein_ladder_denatured, protein_sample_denatured]
    default: empty
    applies_to: subpart
    description: Contents currently in this lane.
  - field_name: material_volume
    type: float
    unit: ul
    min: 0
    max: 30
    default: 0
    applies_to: subpart
    description: Volume of sample loaded in this lane, in microliters.
  - field_name: tape_present
    type: bool
    default: true
    description: Whether the bottom tape is attached to the cassette.
  - field_name: comb_present
    type: bool
    default: true
    description: Whether the comb is inserted in the cassette.
  - field_name: top_plate_inserted
    type: bool
    default: true
    description: Whether the top glass plate is inserted in the cassette.
  - field_name: side_clamps_locked
    type: bool
    default: false
    description: Whether the side clamps are locked.
  - field_name: wing_clamps_locked
    type: bool
    default: false
    description: Whether the wing clamps are locked.
  - field_name: gel_state
    type: enum
    allowed: [empty, separated_unstained, stained, destaining, destained]
    default: empty
    description: Visible lifecycle state of the gel matrix.
  - field_name: migration_state
    type: enum
    allowed: [not_started, running, near_bottom, overrun]
    default: not_started
    description: Visible position of the tracking dye during electrophoresis.
  - field_name: lane_pattern
    type: enum
    allowed: [unassigned, samples_1_to_3_ladder_5]
    default: unassigned
    description: Identity of the assigned sample and ladder lanes carried through the workflow.
  - field_name: wells_rinsed
    type: bool
    default: false
    description: Whether the wells were rinsed with running buffer after comb removal and before loading.
  - field_name: opening_status
    type: enum
    allowed: [sealed, arrows_aligned_straight_open]
    default: sealed
    description: Whether the cassette was opened at its marked arrows using straight pressure.
  - field_name: gel_transfer_status
    type: enum
    allowed: [cassette_supported, free_flat]
    default: cassette_supported
    description: Whether the fragile gel remains supported in the cassette or has been transferred flat.

visual_states:
  material_name:
    applies_to: subpart
    render_effect: material_tint
    target: subpart_geometry
  material_volume:
    applies_to: subpart
    render_effect: fill_height
    target: subpart_geometry
    capacity_ul: 30
  tape_present:
    kind: composite
    cases:
      - when: false
        output: { composite: [] }
      - when: true
        output:
          composite:
            - { asset_name: gel_cassette_bottom_tape }
  comb_present:
    kind: composite
    cases:
      - when: false
        output: { composite: [] }
      - when: true
        output:
          composite:
            - { asset_name: gel_cassette_comb_inserted }
  top_plate_inserted:
    kind: composite
    cases:
      - when: true
        output: { composite: [] }
      - when: false
        output:
          composite:
            - { asset_name: gel_cassette_top_plate_removed }
  side_clamps_locked:
    kind: composite
    cases:
      - when: false
        output: { composite: [] }
      - when: true
        output:
          composite:
            - { asset_name: gel_cassette_side_clamps_locked }
  wing_clamps_locked:
    kind: composite
    cases:
      - when: false
        output: { composite: [] }
      - when: true
        output:
          composite:
            - { asset_name: gel_cassette_wing_clamps_locked }
  gel_state:
    kind: svg
    cases:
      - when: empty
        output: { asset_name: gel_cassette_empty }
      - when: separated_unstained
        output: { asset_name: gel_cassette_separated_unstained }
      - when: stained
        output: { asset_name: gel_cassette_stained }
      - when: destaining
        output: { asset_name: gel_cassette_destaining }
      - when: destained
        output: { asset_name: gel_cassette_destained }
  migration_state:
    kind: composite
    cases:
      - when: not_started
        output:
          composite: [{ asset_name: gel_migration_not_started }]
      - when: running
        output:
          composite: [{ asset_name: gel_migration_running }]
      - when: near_bottom
        output:
          composite: [{ asset_name: gel_migration_near_bottom }]
      - when: overrun
        output:
          composite: [{ asset_name: gel_migration_overrun }]
  lane_pattern:
    kind: overlay
    formula: 'label(state(lane_pattern), format="Lanes: {value}")'
  wells_rinsed:
    kind: overlay
    formula: 'label(state(wells_rinsed), format="Wells rinsed: {value}")'
  opening_status:
    kind: overlay
    formula: 'label(state(opening_status), format="Cassette opening: {value}")'
  gel_transfer_status:
    kind: overlay
    formula: 'label(state(gel_transfer_status), format="Gel transfer: {value}")'

capabilities: [clickable, structured_surface, material_container]

layout:
  default_width: 16
  display_width_cm: 16
  label_width: 10
