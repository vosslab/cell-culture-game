object_name: gel_cassette
kind: equipment
label: Gel cassette

structure:
  subpart_kind: lane
  layout: grid
  rows: 1
  cols: 10
  name_pattern: "lane_{col}"
  subpart_groups:
    all_lanes:
      group_kind: region
      members:
        - name: all_lanes
          contains:
            [
              lane_1,
              lane_2,
              lane_3,
              lane_4,
              lane_5,
              lane_6,
              lane_7,
              lane_8,
              lane_9,
              lane_10,
            ]

state_fields:
  - field_name: material_name
    type: enum
    allowed: [empty, protein_ladder, protein_ladder_denatured, protein_sample_denatured]
    default: empty
    applies_to: subpart
    description: Contents currently in this lane.
  - field_name: material_volume
    type: float
    unit: ul
    min: 0
    max: 30
    default: 0
    applies_to: subpart
    description: Volume of sample loaded in this lane, in microliters.
  - field_name: tape_present
    type: bool
    default: true
    description: Whether the bottom tape is attached to the cassette.
  - field_name: comb_present
    type: bool
    default: true
    description: Whether the comb is inserted in the cassette.
  - field_name: top_plate_inserted
    type: bool
    default: true
    description: Whether the top glass plate is inserted in the cassette.
  - field_name: side_clamps_locked
    type: bool
    default: false
    description: Whether the side clamps are locked.
  - field_name: wing_clamps_locked
    type: bool
    default: false
    description: Whether the wing clamps are locked.
  - field_name: gel_state
    type: enum
    allowed: [empty, separated_unstained, stained, destaining, destained]
    default: empty
    description: Visible lifecycle state of the gel matrix.

visual_states:
  material_name:
    kind: svg
    applies_to: subpart
    cases:
      - when: empty
        output: { asset_name: gel_cassette }
      - when: protein_ladder
        output: { asset_name: gel_cassette }
      - when: protein_ladder_denatured
        output: { asset_name: gel_cassette }
      - when: protein_sample_denatured
        output: { asset_name: gel_cassette }
  material_volume:
    kind: composite
    applies_to: subpart
    formula: fill_height(state(material_volume), capacity_ul=30)
  tape_present:
    kind: composite
    composite: []
  comb_present:
    kind: composite
    composite: []
  top_plate_inserted:
    kind: composite
    composite: []
  side_clamps_locked:
    kind: composite
    composite: []
  wing_clamps_locked:
    kind: composite
    composite: []
  gel_state:
    kind: svg
    cases:
      - when: empty
        output: { asset_name: gel_cassette }
      - when: separated_unstained
        output: { asset_name: gel_cassette }
      - when: stained
        output: { asset_name: gel_cassette }
      - when: destaining
        output: { asset_name: gel_cassette }
      - when: destained
        output: { asset_name: gel_cassette }

capabilities: [clickable, structured_surface, material_container]

layout:
  default_width: 16
  display_width_cm: 16
  label_width: 10
