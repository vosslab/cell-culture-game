object_name: gel_opening_tool
kind: equipment
label: Gel Opening Tool

state_fields:
  - field_name: tool_status
    type: enum
    allowed: [ready]
    default: ready
    description: Static aluminum opening lever ready for use with a gel cassette.

visual_states:
  tool_status:
    kind: svg
    cases:
      - when: ready
        output: { asset_name: gel_opening_tool }

capabilities: [clickable, cursor_attachable]

layout:
  default_width: 2
  display_width_cm: 8
  label_width: 10
