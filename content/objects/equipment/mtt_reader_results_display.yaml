object_name: mtt_reader_results_display
kind: equipment
label: Plate-reader results monitor

state_fields:
  - field_name: visible
    type: bool
    default: true
    description: Whether the completed representative dataset is visible on the reader monitor.

visual_states:
  visible:
    kind: svg
    cases:
      - when: true
        output: { asset_name: mtt_reader_results_display }
      - when: false
        output: { asset_name: mtt_reader_results_display }

capabilities: [decoration_only]

layout:
  default_width: 52
  display_width_cm: 92
  label_width: 24
