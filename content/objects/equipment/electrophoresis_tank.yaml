object_name: electrophoresis_tank
kind: equipment
label: Electrophoresis tank

state_fields:
  - field_name: lid_present
    type: bool
    default: true
    description: Whether the tank lid is in place.
  - field_name: module_present
    type: bool
    default: false
    description: Whether the electrode module is mounted in the tank.

visual_states:
  lid_present:
    kind: svg
    cases:
      - when: false
        output: { asset_name: electrophoresis_tank_open }
      - when: true
        output: { asset_name: electrophoresis_tank_lidded }
  module_present:
    kind: composite
    cases:
      - when: false
        output: { composite: [] }
      - when: true
        output:
          composite:
            - { asset_name: electrophoresis_tank_module_mounted }

capabilities: [clickable]

layout:
  default_width: 18
  display_width_cm: 35
  label_width: 10
