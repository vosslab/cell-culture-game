object_name: electrophoresis_tank
kind: equipment
label: Electrophoresis tank

state_fields:
  - field_name: lid_present
    type: bool
    default: true
    description: Whether the tank lid is in place.
  - field_name: module_present
    type: bool
    default: false
    description: Whether the electrode module is mounted in the tank.

visual_states:
  lid_present:
    kind: svg
    cases:
      - when: false
        output: { asset_name: electrophoresis_tank_open }
      - when: true
        output: { asset_name: electrophoresis_tank_lidded }
  module_present:
    # The electrode module is a separately placed, stateful object.  Its
    # mounted/cassette/clamp evidence remains visible in the assembled scene;
    # a second whole-tank SVG selector would overwrite lid_present in the
    # one-base-asset resolver and would duplicate the module artwork.
    kind: composite
    composite: []

capabilities: [clickable]

layout:
  default_width: 18
  display_width_cm: 35
  label_width: 10
