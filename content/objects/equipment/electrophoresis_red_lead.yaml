object_name: electrophoresis_red_lead
kind: equipment
label: Red anode lead

state_fields:
  - field_name: attached
    type: bool
    default: false
    description: Whether the red positive lead is attached to the anode terminal.

visual_states:
  attached:
    kind: svg
    cases:
      - when: false
        output: { asset_name: electrophoresis_red_lead_unattached }
      - when: true
        output: { asset_name: electrophoresis_red_lead_attached }

capabilities: [clickable]

layout:
  default_width: 7
  display_width_cm: 12
  label_width: 8
