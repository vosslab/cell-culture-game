object_name: electrophoresis_inner_chamber
kind: equipment
label: Inner buffer chamber

state_fields:
  - field_name: material_name
    type: enum
    allowed: [empty, running_buffer_1x, running_buffer_1x_used]
    default: empty
    description: Contents currently in the inner electrophoresis buffer chamber.
  - field_name: material_volume
    type: float
    unit: ml
    min: 0
    max: 800
    default: 0
    description: Buffer volume currently in the inner chamber, in milliliters.
  - field_name: fill_state
    type: enum
    allowed: [empty, partial, filled, leak_checked]
    default: empty
    description: Visible inner-chamber fill level and successful leak-check state.

visual_states:
  material_name:
    kind: composite
    composite: []
  material_volume:
    kind: overlay
    formula: 'label(state(material_volume), format="Inner chamber: {value} mL")'
  fill_state:
    kind: svg
    cases:
      - when: empty
        output: { asset_name: electrophoresis_inner_chamber_empty }
      - when: partial
        output: { asset_name: electrophoresis_inner_chamber_partial }
      - when: filled
        output: { asset_name: electrophoresis_inner_chamber_filled }
      - when: leak_checked
        output: { asset_name: electrophoresis_inner_chamber_leak_checked }
capabilities: [clickable, material_container]

layout:
  default_width: 18
  # Enlarged in its focused protocol scenes so students can read the inner
  # reservoir as a distinct compartment rather than infer it from tank context.
  display_width_cm: 28
  label_width: 13
