object_name: microscope
kind: equipment
label: Microscope

state_fields:
  - field_name: objective
    type: enum
    allowed: [4x, 10x, 20x, 40x, high_power]
    default: 10x
    description: Selected objective magnification.
  - field_name: light_on
    type: bool
    default: false
    description: Whether the microscope illumination is on.
  - field_name: observation_state
    type: enum
    allowed: [not_observed, confluent_70_80, rounded_detached]
    default: not_observed
    description: Visible fixed-scenario cell field currently observed through the microscope.

visual_states:
  objective:
    kind: overlay
    cases:
      - when: 4x
        output: { overlay_name: microscope_objective_4x }
      - when: 10x
        output: { overlay_name: microscope_objective_10x }
      - when: 20x
        output: { overlay_name: microscope_objective_20x }
      - when: 40x
        output: { overlay_name: microscope_objective_40x }
  light_on:
    kind: svg
    cases:
      - when: false
        output: { asset_name: microscope }
      - when: true
        output: { asset_name: microscope }
  observation_state:
    # The transparent field layers turn the instrument into evidence: the
    # student sees an adherent near-confluent monolayer before passage and
    # rounded cells after trypsin rather than inferring either state from a
    # flask label alone.
    kind: composite
    cases:
      - when: not_observed
        output: { composite: [] }
      - when: confluent_70_80
        output:
          composite:
            - { asset_name: microscope_field_confluent_70_80 }
      - when: rounded_detached
        output:
          composite:
            - { asset_name: microscope_field_rounded_detached }

capabilities: [clickable]

layout:
  default_width: 16
  display_width_cm: 35
  label_width: 12
