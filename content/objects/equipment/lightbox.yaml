object_name: lightbox
kind: equipment
label: Lightbox

state_fields:
  - field_name: powered_on
    type: bool
    default: false
    description: Whether the lightbox is powered on.
  - field_name: tray_present
    type: bool
    default: false
    description: Whether a gel tray is present on the lightbox surface.
  - field_name: image_captured
    type: bool
    default: false
    description: Whether an image has been captured.
  - field_name: gel_state
    type: enum
    allowed: [empty, separated_unstained, stained, destaining, destained]
    default: empty
    description: Lifecycle state of the gel presented on the lightbox.

visual_states:
  powered_on:
    kind: svg
    cases:
      - when: false
        output: { asset_name: lightbox_off }
      - when: true
        output: { asset_name: lightbox_on }
  tray_present:
    kind: composite
    cases:
      - when: false
        output: { composite: [] }
      - when: true
        output:
          composite:
            - { asset_name: lightbox_gel_tray }
  image_captured:
    kind: composite
    cases:
      - when: false
        output: { composite: [] }
      - when: true
        output:
          composite:
            - { asset_name: lightbox_capture_complete }
  gel_state:
    kind: overlay
    formula: 'label(state(gel_state), format="Gel: {value}")'

capabilities: [clickable]

layout:
  default_width: 18
  display_width_cm: 28
  label_width: 8
