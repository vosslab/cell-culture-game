object_name: conical_15ml_rack
kind: rack
label: 15 ml conical rack

structure:
  subpart_kind: slot
  layout: list
  count: 6
  name_pattern: "slot_{index}"

state_fields:
  - field_name: material_name
    type: enum
    allowed: [empty, cells, media]
    default: empty
    applies_to: subpart
    description: Contents currently in this slot.
  - field_name: material_volume
    type: float
    unit: ml
    min: 0
    max: 15
    default: 0
    applies_to: subpart
    description: Volume of contents in this slot, in milliliters.

visual_states:
  material_name:
    kind: svg
    applies_to: subpart
    cases:
      - when: empty
        output: { asset_name: falcon_15ml }
      - when: cells
        output: { asset_name: falcon_15ml }
      - when: media
        output: { asset_name: falcon_15ml }
  material_volume:
    # Slot volume is retained as state.  Rendering individual rack contents
    # is a structured-subpart question, not a whole-vessel material effect.
    kind: composite
    applies_to: subpart
    composite: []

capabilities: [clickable, structured_surface, material_container]

layout:
  default_width: 3
  display_width_cm: 3
  label_width: 8
