object_name: microtube_rack_24
kind: rack
label: Microtube rack (24-slot)

state_fields:
  - field_name: material_name
    type: enum
    allowed: [empty]
    default: empty
    description: Shared rack-content material state.
  - field_name: material_volume
    type: float
    unit: ml
    min: 0
    max: 100
    step: 0.1
    default: 0
    description: Shared rack-content volume.

visual_states:
  material_name:
    kind: svg
    cases:
      - when: empty
        output:
          asset_name: tube_rack
  material_volume:
    kind: composite

capabilities: [clickable]

layout:
  default_width: 6
  display_width_cm: 24
  label_width: 10
