object_name: microtube_rack_8
kind: rack
label: 8-tube SDS-PAGE rack

structure:
  subpart_kind: tube
  layout: grid
  rows: 2
  cols: 4
  name_pattern: "slot_{row_letter}{col}"

state_fields:
  - field_name: material_name
    type: enum
    allowed: [empty, protein_sample_raw, protein_sample_mixed, protein_sample_denatured, protein_ladder, protein_ladder_denatured]
    default: empty
    applies_to: subpart
    description: Contents currently in this labeled SDS-PAGE tube.
  - field_name: material_volume
    type: float
    unit: ul
    min: 0
    max: 30
    default: 0
    applies_to: subpart
    description: Volume currently in this labeled SDS-PAGE tube, in microliters.
  - field_name: cap_status
    type: enum
    allowed: [open, closed]
    default: open
    applies_to: subpart
    description: Whether the tube is capped for heating or storage.
  - field_name: label_status
    type: enum
    allowed: [unlabeled, lane_assigned]
    default: unlabeled
    applies_to: subpart
    description: Whether the tube visibly carries its lane assignment.

visual_states:
  material_name:
    kind: svg
    applies_to: subpart
    cases:
      - when: empty
        output: { asset_name: microtube_rack_8 }
      - when: protein_sample_raw
        output: { asset_name: microtube_rack_8 }
      - when: protein_sample_mixed
        output: { asset_name: microtube_rack_8 }
      - when: protein_sample_denatured
        output: { asset_name: microtube_rack_8 }
      - when: protein_ladder
        output: { asset_name: microtube_rack_8 }
      - when: protein_ladder_denatured
        output: { asset_name: microtube_rack_8 }
  material_volume:
    # Tube volume is retained as state.  Rendering individual rack contents
    # is a structured-subpart question, not a whole-vessel material effect.
    kind: composite
    applies_to: subpart
    composite: []
  cap_status:
    kind: overlay
    applies_to: subpart
    formula: 'label(state(cap_status), format="Cap: {value}")'
  label_status:
    kind: overlay
    applies_to: subpart
    formula: 'label(state(label_status), format="Lane label: {value}")'

capabilities: [clickable, structured_surface, material_container]

layout:
  default_width: 12
  display_width_cm: 24
  label_width: 10
