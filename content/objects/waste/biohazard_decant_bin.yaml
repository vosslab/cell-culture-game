object_name: biohazard_decant_bin
kind: waste
label: Biohazard decant bin
state_fields:
  - field_name: material_name
    type: enum
    allowed:
      - empty
      - mixed
      - waste_mtt
    default: empty
    description: Waste type in biohazard bin.
  - field_name: material_volume
    type: float
    unit: ml
    min: 0
    max: 100
    default: 0
    description: Volume of accumulated liquid waste in the 100 mL collection bin, in milliliters.
visual_states:
  material_name:
    kind: svg
    cases:
      - when: empty
        output:
          asset_name: biohazard_decant_bin
      - when: mixed
        output:
          asset_name: biohazard_decant_bin
      - when: waste_mtt
        output:
          asset_name: biohazard_decant_bin
  material_volume:
    kind: composite
    composite: []
capabilities:
  - clickable
  - material_container
layout:
  default_width: 4
  display_width_cm: 12
  label_width: 8
