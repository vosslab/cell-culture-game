object_name: biohazard_decant
kind: waste
label: Biohazard decant
state_fields:
  - field_name: material_name
    type: enum
    allowed:
      - empty
      - mixed
      - mtt
      - cell_supernatant
    default: empty
    description: Waste type (empty or mixed biohazard).
  - field_name: material_volume
    type: float
    unit: ml
    min: 0
    max: 50
    default: 0
    description: Volume of accumulated liquid waste in the 50 mL decant vessel, in milliliters.
visual_states:
  material_name:
    kind: svg
    cases:
      - when: empty
        output:
          asset_name: biohazard_decant
      - when: mixed
        output:
          asset_name: biohazard_decant
      - when: mtt
        output:
          asset_name: biohazard_decant
      - when: cell_supernatant
        output:
          asset_name: biohazard_decant
  material_volume:
    kind: composite
    composite: []
capabilities:
  - clickable
  - material_container
layout:
  default_width: 4
  display_width_cm: 12
  label_width: 8
