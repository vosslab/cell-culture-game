object_name: destain_bottle
kind: bottle
label: Destain
state_fields:
  - field_name: material_name
    type: enum
    allowed:
      - empty
      - destain
    default: destain
    description: Contents currently in the bottle.
  - field_name: material_volume
    type: float
    unit: ml
    min: 0
    max: 250
    default: 250
    description: Volume of destain remaining, in milliliters.
visual_states:
  material_name:
    kind: svg
    cases:
      - when: empty
        output:
          asset_name: bottle_medium_pink
      - when: destain
        output:
          asset_name: bottle_medium_pink
  material_volume:
    applies_to: object
    render_effect: fill_height
    target: anchor_liquid_bounds
    clip: anchor_liquid_clip
    capacity_ml: 250
capabilities:
  - clickable
  - material_container
  - cursor_attachable
layout:
  default_width: 2
  display_width_cm: 10
  label_width: 6
