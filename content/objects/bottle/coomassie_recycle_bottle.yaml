object_name: coomassie_recycle_bottle
kind: bottle
label: Coomassie recycle bottle
state_fields:
  - field_name: material_name
    type: enum
    allowed:
      - empty
      - coomassie_stain_used
    default: empty
    description: Contents currently in the bottle.
  - field_name: material_volume
    type: float
    unit: ml
    min: 0
    max: 250
    default: 0
    description: Volume of used Coomassie stain collected for reuse, in milliliters.
visual_states:
  material_name:
    kind: svg
    cases:
      - when: empty
        output:
          asset_name: bottle_medium_pink
      - when: coomassie_stain_used
        output:
          asset_name: bottle_medium_pink
  material_volume:
    applies_to: object
    render_effect: fill_height
    target: anchor_liquid_bounds
    clip: anchor_liquid_clip
    capacity_ml: 250
capabilities:
  - clickable
  - material_container
  - cursor_attachable
layout:
  default_width: 2
  display_width_cm: 10
  label_width: 8
