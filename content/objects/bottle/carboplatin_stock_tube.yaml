object_name: carboplatin_stock_tube
kind: bottle
label: Carboplatin 10 mM

state_fields:
  - field_name: material_name
    type: enum
    allowed: [carboplatin, carboplatin_10mmol]
    default: carboplatin_10mmol
    description: Contents currently in this bottle.
  - field_name: material_volume
    type: float
    unit: ml
    min: 0
    max: 50
    default: 50
    description: Volume of carboplatin stock remaining, in milliliters.

visual_states:
  material_name:
    kind: svg
    cases:
      - when: carboplatin
        output: { asset_name: falcon_50ml }
      - when: carboplatin_10mmol
        output: { asset_name: falcon_50ml }
  material_volume:
    applies_to: object
    render_effect: fill_height
    target: anchor_liquid_bounds
    clip: anchor_liquid_clip
    capacity_ml: 50

capabilities: [clickable, material_container, cursor_attachable]

layout:
  default_width: 3
  display_width_cm: 6.5
  label_width: 8
