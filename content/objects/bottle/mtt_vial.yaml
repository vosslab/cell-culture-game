object_name: mtt_vial
kind: bottle
label: MTT reagent

state_fields:
  - field_name: material_name
    type: enum
    allowed: [mtt]
    default: mtt
    description: Contents currently in this vial.
  - field_name: material_volume
    type: float
    unit: ml
    min: 0
    max: 10
    default: 10
    description: Volume of MTT reagent remaining, in milliliters.

visual_states:
  material_name:
    kind: svg
    cases:
      - when: mtt
        output: { asset_name: mtt_vial }
  material_volume:
    applies_to: object
    render_effect: fill_height
    target: anchor_liquid_bounds
    clip: anchor_liquid_clip
    capacity_ml: 10

capabilities: [clickable, material_container, cursor_attachable]

layout:
  default_width: 2
  display_width_cm: 4
  label_width: 5
