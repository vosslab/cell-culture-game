object_name: ddh2o_carboy
kind: bottle
label: ddH2O carboy
state_fields:
  - field_name: material_name
    type: enum
    allowed:
      - empty
      - ddh2o
    default: ddh2o
    description: Contents currently in the carboy.
  - field_name: material_volume
    type: float
    unit: ml
    min: 0
    max: 1000
    default: 1000
    description: Volume of deionized water remaining, in milliliters.
visual_states:
  material_name:
    kind: svg
    cases:
      - when: empty
        output:
          asset_name: bottle_green
      - when: ddh2o
        output:
          asset_name: bottle_green
  material_volume:
    applies_to: object
    render_effect: fill_height
    target: anchor_liquid_bounds
    clip: anchor_liquid_clip
    capacity_ml: 1000
capabilities:
  - clickable
  - material_container
  - cursor_attachable
layout:
  default_width: 4
  display_width_cm: 18
  label_width: 8
