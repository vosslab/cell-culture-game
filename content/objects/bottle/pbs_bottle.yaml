object_name: pbs_bottle
kind: bottle
label: PBS
state_fields:
  - field_name: material_name
    type: enum
    allowed:
      - empty
      - pbs
    default: pbs
    description: Contents currently in the bottle.
  - field_name: material_volume
    type: float
    unit: ml
    min: 0
    max: 500
    default: 500
    description: Volume of PBS remaining, in milliliters.
visual_states:
  material_volume:
    applies_to: object
    render_effect: fill_height
    target: anchor_liquid_bounds
    clip: anchor_liquid_clip
    capacity_ml: 500
  material_name:
    kind: svg
    cases:
      - when: empty
        output:
          asset_name: bottle_medium_pink
      - when: pbs
        output:
          asset_name: bottle_medium_pink
capabilities:
  - clickable
  - material_container
  - cursor_attachable
layout:
  default_width: 3
  display_width_cm: 12
  label_width: 4
