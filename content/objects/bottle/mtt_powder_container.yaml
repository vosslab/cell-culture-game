object_name: mtt_powder_container
kind: bottle
label: Pre-weighed MTT microtube

state_fields:
  - field_name: material_name
    type: enum
    allowed: [mtt_powder, empty]
    default: mtt_powder
    description: Contents of this pre-weighed microtube.
  - field_name: material_volume
    type: float
    unit: mg
    min: 0
    max: 20
    default: 20
    description: Mass of MTT powder in milligrams.

visual_states:
  material_name:
    kind: svg
    cases:
      - when: mtt_powder
        output: { asset_name: mtt_powder_vial }
      - when: empty
        output: { asset_name: mtt_powder_vial_empty }
  material_volume:
    kind: composite
    composite: []

capabilities: [clickable, material_container, cursor_attachable]

layout:
  default_width: 2
  display_width_cm: 5
  label_width: 6
