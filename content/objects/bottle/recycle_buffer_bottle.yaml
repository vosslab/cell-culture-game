object_name: recycle_buffer_bottle
kind: bottle
label: Buffer recycle bottle
state_fields:
  - field_name: material_name
    type: enum
    allowed:
      - empty
      - running_buffer_1x_used
    default: empty
    description: Contents currently in the bottle.
  - field_name: material_volume
    type: float
    unit: ml
    min: 0
    max: 1000
    default: 0
    description: Volume of used running buffer collected, in milliliters.
visual_states:
  material_name:
    kind: svg
    cases:
      - when: empty
        output:
          asset_name: bottle_medium_pink
      - when: running_buffer_1x_used
        output:
          asset_name: bottle_medium_pink
  material_volume:
    applies_to: object
    render_effect: fill_height
    target: anchor_liquid_bounds
    clip: anchor_liquid_clip
    capacity_ml: 1000
capabilities:
  - clickable
  - material_container
  - cursor_attachable
layout:
  default_width: 3
  display_width_cm: 14
  label_width: 8
