object_name: conical_15ml
kind: bottle
label: Conical 15 ml tube
state_fields:
  - field_name: material_name
    type: enum
    allowed:
      - empty
      - cells
      - media
      - trypsin
      - cell_suspension
      - cell_pellet
      - cell_supernatant
    default: empty
    description: Contents currently in the tube.
  - field_name: material_volume
    type: float
    unit: ml
    min: 0
    max: 15
    default: 0
    description: Volume of contents in the tube, in milliliters.
  - field_name: label_status
    type: enum
    allowed: [unlabeled, sample_identity_complete]
    default: unlabeled
    description: Whether the fixed sample, concentration, date, course, and use-count label is complete.
visual_states:
  material_name:
    kind: svg
    cases:
      - when: empty
        output:
          asset_name: falcon_15ml
      - when: cells
        output:
          asset_name: falcon_15ml
      - when: media
        output:
          asset_name: falcon_15ml
      - when: trypsin
        output:
          asset_name: falcon_15ml
      - when: cell_suspension
        output:
          asset_name: falcon_15ml
      - when: cell_pellet
        output:
          asset_name: falcon_15ml
      - when: cell_supernatant
        output:
          asset_name: falcon_15ml
  material_volume:
    applies_to: object
    render_effect: fill_height
    target: anchor_liquid_bounds
    clip: anchor_liquid_clip
    capacity_ml: 15
  label_status:
    kind: overlay
    formula: 'label(state(label_status), format="Tube label: {value}")'
capabilities:
  - clickable
  - material_container
layout:
  default_width: 3
  display_width_cm: 5
  label_width: 6
