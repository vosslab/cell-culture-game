object_name: protein_ladder_tube
kind: bottle
label: Protein ladder tube
state_fields:
  - field_name: material_name
    type: enum
    allowed:
      - empty
      - protein_ladder
    default: protein_ladder
    description: Contents currently in the tube.
  - field_name: material_volume
    type: float
    unit: ul
    min: 0
    max: 500
    default: 500
    description: Volume of protein ladder, in microliters.
visual_states:
  material_name:
    kind: svg
    cases:
      - when: empty
        output:
          asset_name: microtube
      - when: protein_ladder
        output:
          asset_name: microtube
  material_volume:
    applies_to: object
    render_effect: fill_height
    target: anchor_liquid_bounds
    clip: anchor_liquid_clip
    capacity_ul: 500
capabilities:
  - clickable
  - material_container
layout:
  default_width: 2
  display_width_cm: 4
  label_width: 6
