object_name: ethanol_bottle
kind: bottle
label: 70% ethanol
state_fields:
  - field_name: material_name
    type: enum
    allowed:
      - empty
      - ethanol_70
    default: ethanol_70
    description: Contents currently in the bottle.
  - field_name: material_volume
    type: float
    unit: ml
    min: 0
    max: 500
    default: 500
    description: Volume of ethanol remaining, in milliliters.
visual_states:
  material_volume:
    applies_to: object
    render_effect: fill_height
    target: anchor_liquid_bounds
    clip: anchor_liquid_clip
    capacity_ml: 500
  material_name:
    kind: svg
    cases:
      - when: empty
        output:
          asset_name: bottle_orange
      - when: ethanol_70
        output:
          asset_name: bottle_orange
capabilities:
  - clickable
  - material_container
  - cursor_attachable
layout:
  default_width: 3
  display_width_cm: 12
  label_width: 5
