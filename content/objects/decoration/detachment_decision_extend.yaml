object_name: detachment_decision_extend
kind: decoration
label: Extend trypsin exposure

state_fields:
  - field_name: visible
    type: bool
    default: true
    description: Whether this detachment decision is visible.

visual_states:
  visible:
    kind: svg
    cases:
      - when: true
        output: { asset_name: interpretation_choice_card }
      - when: false
        output: { asset_name: interpretation_choice_card }

capabilities: [clickable]

layout:
  default_width: 17
  display_width_cm: 21
  label_width: 21
