object_name: electrophoresis_endpoint_stop_now
kind: decoration
label: "Stop now: dye front is at the safe endpoint"

state_fields:
  - field_name: visible
    type: bool
    default: true
    description: Whether the endpoint decision card is visible.

visual_states:
  visible:
    kind: svg
    cases:
      - when: true
        output: { asset_name: interpretation_choice_card }
      - when: false
        output: { asset_name: interpretation_choice_card }

capabilities: [clickable]

layout:
  default_width: 20
  display_width_cm: 24
  label_width: 24
