object_name: mtt_conclusion_no_effect
kind: decoration
label: No treatment effect

state_fields:
  - field_name: visible
    type: bool
    default: true
    description: Whether this MTT conclusion is visible.

visual_states:
  visible:
    kind: svg
    cases:
      - when: true
        output: { asset_name: interpretation_choice_card }
      - when: false
        output: { asset_name: interpretation_choice_card }

capabilities: [clickable]

layout:
  default_width: 15
  display_width_cm: 19
  label_width: 19
