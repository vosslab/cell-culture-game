object_name: recycle_buffer_funnel
kind: decoration
label: Buffer-recovery funnel

state_fields:
  - field_name: visible
    type: bool
    default: true
    description: Whether the funnel remains visible beside the buffer-recycle bottle.

visual_states:
  visible:
    kind: svg
    cases:
      - when: true
        output:
          asset_name: recycle_buffer_funnel
      - when: false
        output:
          asset_name: recycle_buffer_funnel

capabilities: [decoration_only]

layout:
  default_width: 4
  display_width_cm: 9
  label_width: 8
