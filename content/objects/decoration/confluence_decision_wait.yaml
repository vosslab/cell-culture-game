object_name: confluence_decision_wait
kind: decoration
label: "Wait: culture needs more growth"

state_fields:
  - field_name: visible
    type: bool
    default: true
    description: Whether this confluence decision is visible.

visual_states:
  visible:
    kind: svg
    cases:
      - when: true
        output: { asset_name: interpretation_choice_card }
      - when: false
        output: { asset_name: interpretation_choice_card }

capabilities: [clickable]

layout:
  default_width: 19
  display_width_cm: 23
  label_width: 23
