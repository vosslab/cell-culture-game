object_name: viability_decision_proceed
kind: decoration
label: "Proceed: viability above 90%"

state_fields:
  - field_name: visible
    type: bool
    default: true
    description: Whether this viability decision is visible.

visual_states:
  visible:
    kind: svg
    cases:
      - when: true
        output: { asset_name: interpretation_choice_card }
      - when: false
        output: { asset_name: interpretation_choice_card }

capabilities: [clickable]

layout:
  default_width: 18
  display_width_cm: 22
  label_width: 22
