object_name: lens_tissue
kind: decoration
label: Lens-cleaning tissue

state_fields:
  - field_name: visible
    type: bool
    default: true
    description: Whether the lens tissue is visible.

visual_states:
  visible:
    kind: svg
    cases:
      - when: true
        output:
          asset_name: lens_tissue
      - when: false
        output:
          asset_name: lens_tissue

capabilities: [clickable, cursor_attachable]

layout:
  default_width: 4
  display_width_cm: 5
  label_width: 6
