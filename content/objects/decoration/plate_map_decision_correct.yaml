object_name: plate_map_decision_correct
kind: decoration
label: Plate map matches the planned treatments

state_fields:
  - field_name: visible
    type: bool
    default: true
    description: Whether this plate-map decision is visible.

visual_states:
  visible:
    kind: svg
    cases:
      - when: true
        output: { asset_name: interpretation_choice_card }
      - when: false
        output: { asset_name: interpretation_choice_card }

capabilities: [clickable]

layout:
  default_width: 21
  display_width_cm: 25
  label_width: 25
