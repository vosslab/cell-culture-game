object_name: mtt_conclusion_dose_response
kind: decoration
label: Viability decreases with carboplatin dose

state_fields:
  - field_name: visible
    type: bool
    default: true
    description: Whether this MTT conclusion is visible.

visual_states:
  visible:
    kind: svg
    cases:
      - when: true
        output: { asset_name: interpretation_choice_card }
      - when: false
        output: { asset_name: interpretation_choice_card }

capabilities: [clickable]

layout:
  default_width: 21
  display_width_cm: 25
  label_width: 25
