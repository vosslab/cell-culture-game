object_name: destain_decision_ready
kind: decoration
label: "Stop: background is sufficiently clear"

state_fields:
  - field_name: visible
    type: bool
    default: true
    description: Whether this destain decision is visible.

visual_states:
  visible:
    kind: svg
    cases:
      - when: true
        output: { asset_name: interpretation_choice_card }
      - when: false
        output: { asset_name: interpretation_choice_card }

capabilities: [clickable]

layout:
  default_width: 20
  display_width_cm: 24
  label_width: 24
