<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 106 64" preserveAspectRatio="xMidYMid meet">
  <!-- Biological safety cabinet interior, dirty-before-disinfection state. -->
  <defs>
    <linearGradient id="hood_back_wall" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f5ffff"/>
      <stop offset="1" stop-color="#b9dce1"/>
    </linearGradient>
    <linearGradient id="hood_work_surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#d9f3f5"/>
      <stop offset="1" stop-color="#6d9fa9"/>
    </linearGradient>
  </defs>

  <!-- Cabinet housing and raised front sash establish the BSC, not a bench bottle. -->
  <path fill="#4c6670" stroke="#263b46" stroke-width="2" d="M 10 6 L 96 6 A 4 4 0 0 1 100 10 L 100 54 A 4 4 0 0 1 96 58 L 10 58 A 4 4 0 0 1 6 54 L 6 10 A 4 4 0 0 1 10 6 Z"/>
  <path fill="url(#hood_back_wall)" stroke="#263b46" stroke-width="1.4" d="M 13 11 L 93 11 A 2 2 0 0 1 95 13 L 95 44 A 2 2 0 0 1 93 46 L 13 46 A 2 2 0 0 1 11 44 L 11 13 A 2 2 0 0 1 13 11 Z"/>
  <path fill="#74adba" d="M 13 13 L 93 13 L 93 18 L 13 18 Z"/>
  <path d="M 16 16 L 90 16" stroke="#d5e5e7" stroke-width="1" stroke-dasharray="3 2"/>

  <!-- Vertical air curtain / partially raised sash. -->
  <path d="M 15 28 L 15 42 M 19 28 L 19 42 M 87 28 L 87 42 M 91 28 L 91 42" stroke="#6ec4df" stroke-width="1.2" stroke-linecap="round" opacity="0.82"/>
  <path d="M 53 26 L 53 39 M 53 39 L 50.8 36 M 53 39 L 55.2 36" fill="none" stroke="#6ec4df" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round" opacity="0.9"/>
  <path fill="#263b46" d="M 11 42 L 95 42 L 95 46 L 11 46 Z"/>

  <!-- Stainless-steel work deck, front grill, and side walls. -->
  <path d="M 11 46 L 95 46 L 87 56 L 19 56 Z" fill="url(#hood_work_surface)" stroke="#263b46" stroke-width="1.4" stroke-linejoin="round"/>
  <path d="M 21 50 L 85 50" stroke="#dfe8e8" stroke-width="1" opacity="0.8"/>
  <path d="M 21 54 L 85 54" stroke="#40545a" stroke-width="1.2" stroke-dasharray="2 1"/>
  <path d="M 12 46 L 19 56 M 94 46 L 87 56" stroke="#d1dcdd" stroke-width="1"/>

  <!-- Dirty-state cue: a small spill and contamination flecks on the work deck. -->
  <path d="M 45 50 C 47.8 47.9 52.2 47.9 55 50 C 56.9 51.5 55.6 53.7 52.9 53.7 L 47.1 53.7 C 44.4 53.7 43.1 51.5 45 50 Z" fill="#bc6a56" stroke="#87483d" stroke-width="0.65"/>
  <path fill="#aa6654" d="M 33.1 52 A .9 .9 0 1 0 34.9 52 A .9 .9 0 1 0 33.1 52 Z"/>
  <path fill="#aa6654" d="M 70.2 51 A .8 .8 0 1 0 71.8 51 A .8 .8 0 1 0 70.2 51 Z"/>
  <path fill="#aa6654" d="M 75.35 53.5 A .65 .65 0 1 0 76.65 53.5 A .65 .65 0 1 0 75.35 53.5 Z"/>

  <path fill="#263b46" d="M 18 58 L 88 58 A 1 1 0 0 1 89 59 L 89 59 A 1 1 0 0 1 88 60 L 18 60 A 1 1 0 0 1 17 59 L 17 59 A 1 1 0 0 1 18 58 Z"/>
  <g id="overlay_root"/>
  <path id="anchor_label" fill="none" stroke="none" display="none" d="M 14 59 L 92 59 L 92 63 L 14 63 Z"/>
  <path id="anchor_error" fill="none" stroke="none" display="none" d="M 85 11 L 93 11 L 93 19 L 85 19 Z"/>
</svg>
