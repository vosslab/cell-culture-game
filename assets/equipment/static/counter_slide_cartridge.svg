    <path d="m38 71 252-24 14 53-253 27z" fill="#b8d2d8"/>
    <path d="m40 70 249-24" fill="none" stroke="#fff" stroke-width="2.2" opacity=".85"/>
    <path d="m48 119 257-27 4 13-257 28z" fill="#87a8b2"/>
  </g>
  <g id="slide_slots" fill="url(#slide_glass)" stroke="#83a6af" stroke-width="1">
    <path d="m54 75 18-2 8 38-18 2z"/><path d="m78 72 18-2 8 38-18 2z"/><path d="m102 70 18-2 8 38-18 2z"/><path d="m126 68 18-2 8 38-18 2z"/><path d="m150 65 18-2 8 38-18 2z"/><path d="m174 63 18-2 8 38-18 2z"/><path d="m198 61 18-2 8 38-18 2z"/><path d="m222 58 18-2 8 38-18 2z"/><path d="m246 56 18-2 8 38-18 2z"/><path d="m270 54 18-2 8 38-18 2z"/>
  </g>
  <g fill="#7db5c6" opacity=".62"><path d="m59 83 10-1 2 8-10 1z"/><path d="m83 80 10-1 2 8-10 1z"/><path d="m107 78 10-1 2 8-10 1z"/><path d="m131 76 10-1 2 8-10 1z"/><path d="m155 73 10-1 2 8-10 1z"/><path d="m179 71 10-1 2 8-10 1z"/><path d="m203 69 10-1 2 8-10 1z"/><path d="m227 66 10-1 2 8-10 1z"/><path d="m251 64 10-1 2 8-10 1z"/><path d="m275 62 10-1 2 8-10 1z"/></g>
  <!-- The retaining lip deliberately occludes the lower ends of the slides. -->
  <path d="m48 111 257-27 4 14-257 28q-5 0-8-5z" fill="#d9eaed" stroke="#7699a3" stroke-width="1.2"/>
  <path d="m52 119 251-27" fill="none" stroke="#fff" stroke-width="1.2" opacity=".82"/>
