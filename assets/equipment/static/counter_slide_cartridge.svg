<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 344 191" preserveAspectRatio="xMidYMid meet">
  <defs>
    <linearGradient id="tray_top" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#f4fbfc"/><stop offset=".58" stop-color="#c8dde2"/><stop offset="1" stop-color="#9dbbc4"/></linearGradient>
    <linearGradient id="tray_edge" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#a2c0c8"/><stop offset="1" stop-color="#7597a2"/></linearGradient>
    <linearGradient id="slide_glass" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#fff"/><stop offset=".42" stop-color="#ecf9fa"/><stop offset="1" stop-color="#b7d6dd"/></linearGradient>
  </defs>
  <!-- Low bench cassette: a true open tray, rear rail, front retaining lip, and individually visible microscope slides. -->
  <g id="cartridge_body" stroke-linejoin="round">
