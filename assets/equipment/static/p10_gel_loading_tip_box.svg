<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 284 196">
  <!-- The upright transparent lid identifies this as a tip box, not a gel tray. -->
  <path d="M 22 87 L 22 18 Q 22 8 32 8 L 252 8 Q 262 8 262 18 L 262 87" fill="#d9f0f2" fill-opacity=".40" stroke="#263b44" stroke-width="5" stroke-linejoin="round"/>
  <path d="M 34 23 L 250 23 M 34 39 L 250 39" fill="none" stroke="#75aebb" stroke-width="3" stroke-opacity=".8"/>
  <path d="M 80 8 L 80 87 M 204 8 L 204 87" fill="none" stroke="#75aebb" stroke-width="3" stroke-opacity=".55"/>
  <path fill="#5d929e" stroke="#263b44" stroke-width="5" d="M 24 78 L 260 78 A 12 12 0 0 1 272 90 L 272 172 A 12 12 0 0 1 260 184 L 24 184 A 12 12 0 0 1 12 172 L 12 90 A 12 12 0 0 1 24 78 Z"/>
  <path d="M 18 90 L 266 90 L 266 162 L 18 162 Z" fill="#f7fbfb" stroke="#263b44" stroke-width="4"/>
  <path d="M 22 92 L 262 92" stroke="#fff" stroke-width="4" stroke-opacity=".78"/>
  <!-- Long, narrow tips are intentionally much finer than ordinary P200-style tips. -->
  <path fill="#fffdf8" stroke="#9fcbd4" stroke-width="3" d="M 41 99 L 243 99 A 5 5 0 0 1 248 104 L 248 148 A 5 5 0 0 1 243 153 L 41 153 A 5 5 0 0 1 36 148 L 36 104 A 5 5 0 0 1 41 99 Z"/>
  <g fill="#b9e3ea" stroke="#3d6976" stroke-width="2" stroke-linejoin="round">
    <!-- Rear row: its shorter points stay visibly behind the staggered front row. -->
    <g id="rear_tip_row">
      <path d="M 48 104 L 58 104 L 58 114 L 55 134 L 53 142 L 51 134 L 48 114 Z"/><path d="M 83 104 L 93 104 L 93 114 L 90 134 L 88 142 L 86 134 L 83 114 Z"/><path d="M 118 104 L 128 104 L 128 114 L 125 134 L 123 142 L 121 134 L 118 114 Z"/><path d="M 153 104 L 163 104 L 163 114 L 160 134 L 158 142 L 156 134 L 153 114 Z"/><path d="M 188 104 L 198 104 L 198 114 L 195 134 L 193 142 L 191 134 L 188 114 Z"/><path d="M 223 104 L 233 104 L 233 114 L 230 134 L 228 142 L 226 134 L 223 114 Z"/>
    </g>
    <!-- Front row: offset one half-pitch so every fine gel-loading tip remains distinct. -->
    <g id="front_tip_row">
      <path d="M 63 119 L 73 119 L 73 129 L 70 144 L 68 151 L 66 144 L 63 129 Z"/><path d="M 98 119 L 108 119 L 108 129 L 105 144 L 103 151 L 101 144 L 98 129 Z"/><path d="M 133 119 L 143 119 L 143 129 L 140 144 L 138 151 L 136 144 L 133 129 Z"/><path d="M 168 119 L 178 119 L 178 129 L 175 144 L 173 151 L 171 144 L 168 129 Z"/><path d="M 203 119 L 213 119 L 213 129 L 210 144 L 208 151 L 206 144 L 203 129 Z"/><path d="M 238 119 L 248 119 L 248 129 L 245 144 L 243 151 L 241 144 L 238 129 Z"/>
    </g>
  </g>
  <g fill="none" stroke="#fff" stroke-width="2" stroke-opacity=".85"><path d="M 50 107 L 56 107 M 85 107 L 91 107 M 120 107 L 126 107 M 155 107 L 161 107 M 190 107 L 196 107 M 225 107 L 231 107"/><path d="M 65 122 L 71 122 M 100 122 L 106 122 M 135 122 L 141 122 M 170 122 L 176 122 M 205 122 L 211 122 M 240 122 L 246 122"/></g>
  <!-- The near tray lip closes the box in front of every tip. -->
  <path d="M 20 162 L 264 162 L 253 184 L 31 184 Z" fill="#416e79"/>
  <g id="overlay_root"/>
  <path id="anchor_label" fill="none" stroke="none" display="none" d="M 12 186 L 272 186 L 272 204 L 12 204 Z"/>
  <path id="anchor_error" fill="none" stroke="none" display="none" d="M 251 78 L 267 78 L 267 94 L 251 94 Z"/>
</svg>
