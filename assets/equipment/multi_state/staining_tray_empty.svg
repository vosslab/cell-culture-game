  <rect x="39" y="138" width="229" height="103" rx="13" fill="#eaf5f7" stroke="#527786" stroke-width="3"/>

  <!-- Material overlays are inserted here and clipped to the shallow basin. -->
  <g id="overlay_root"/>
  <rect id="anchor_liquid_bounds" x="39" y="138" width="229" height="103" rx="13" fill="none" stroke="none" display="none"/>

  <!-- The flat slab, loading wells, and sparse lanes make the scientific purpose legible. -->
