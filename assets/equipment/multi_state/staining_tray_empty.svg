  </defs>

  <!-- A deliberately low, open dish distinguishes a gel-staining tray from an instrument. -->
  <ellipse cx="154" cy="315" rx="119" ry="18" fill="#c9d3d9" opacity="0.48"/>
  <rect x="21" y="104" width="265" height="175" rx="28" fill="#6e8998"/>
